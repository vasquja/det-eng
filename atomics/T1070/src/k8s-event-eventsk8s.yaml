# TRR9010 Procedure C target — a harmless events.k8s.io/v1 Event the emulation
# creates and then deletes. The delete is the detection telemetry, and the validator
# needs it to be accepted (200), so the create must succeed first. The API server's
# Event validation (pkg/apis/core/validation/events.go, legacyValidateEvent, which also
# runs for events.k8s.io/v1, where regarding becomes involvedObject) refuses an Event
# outside default and kube-system whose regarding has no namespace, so the Event names
# an object in trr9010 (the object need not exist).
apiVersion: events.k8s.io/v1
kind: Event
metadata:
  name: trr9010-evt-c
  namespace: trr9010
eventTime: "2026-10-12T00:00:00.000000Z"
reportingController: trr9010-emulation
reportingInstance: trr9010
action: Benign
reason: Trr9010Benign
regarding:
  apiVersion: v1
  kind: ConfigMap
  name: trr9010-anchor
  namespace: trr9010
note: benign TRR9010 indicator-removal emulation
type: Normal
