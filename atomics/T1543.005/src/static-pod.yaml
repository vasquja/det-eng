# Benign static pod manifest for the TRR9003 emulation (Procedure A).
#
# The emulation writes this file into the kubelet's staticPodPath directory on a
# node (/etc/kubernetes/manifests by default). The kubelet then runs it directly
# through the container runtime, with NO API server scheduling, authorization, or
# admission. The kubelet also registers a read-only mirror pod in the API server
# (named trr9003-static-<nodeName>), which is the one audit-log trace.
#
# This pod is harmless: one busybox container that sleeps, no host mounts, no
# privilege. A real attacker would add hostPath/hostNetwork/privileged here to
# gain node-level access — the point of the lab is the control path, not harm.
# The emulation removes this file afterward, which makes the kubelet stop the pod.
apiVersion: v1
kind: Pod
metadata:
  name: trr9003-static
  namespace: default
  labels:
    app: trr9003-static
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: pause
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: false
        capabilities:
          drop: ["ALL"]
