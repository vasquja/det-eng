attack_technique: T1565.001
display_name: "Stored Data Manipulation (Kubernetes Cluster DNS Poisoning)"

# Behavioral emulation for TRR9027. Tests A-D write a cluster DNS ConfigMap in
# kube-system; tests E and F write the OpenShift DNS objects (the ConfigMap
# openshift-dns/dns-default and the DNS Operator object dnses.operator.openshift.io/default,
# which kind does not have, so they create inert copies first). So the API server writes
# the audit event the paired detections key on. The poison carries the sentinel token
# 'trr9027' so a validator matches the emulation's own events. SAFETY: Procedure A captures the real coredns Corefile, appends
# an INERT sentinel server block (a forward of a .invalid zone no workload resolves to a
# TEST-NET IP), and RESTORES the original at once; Procedures B and C write ConfigMaps a
# CoreDNS kind cluster does not read (kube-dns, coredns-custom), only when no ConfigMap of
# that name exists, label them app.kubernetes.io/part-of=trr9027, and cleanup deletes only
# that label. A, B and C write by name (B and C use server-side apply), and D deletes
# coredns and creates it again (a POST), saves the original first and restores it; the
# audit policy logs each with its body. These need a reachable cluster (Kubernetes 1.22+)
# with rights on kube-system ConfigMaps, audit logging at RequestResponse for the three DNS
# ConfigMaps and at Request for kube-system ConfigMap creates (see
# detections/k8s/audit-policy-apiserver.yaml), and python3. Tests E and F also need rights
# to create namespaces and ConfigMaps in openshift-dns, CustomResourceDefinitions, and
# dnses.operator.openshift.io objects, and the policy's openshift-dns and dnses rules.

atomic_tests:
  - name: "TRR9027.K8S.A — repoint the coredns Corefile, then restore"
    auto_generated_guid: ee24a095-e7c0-4e70-aac8-acb7d6d5ae10
    description: |
      Patches the coredns ConfigMap Corefile with an inert sentinel server block (a rewrite
      plus a forward of trr9027poison.example.invalid to a TEST-NET IP), then restores the
      original Corefile (armed on a signal before the poison, and verified after: the
      stored Corefile must equal the saved one byte for byte, trailing line break
      included, or the run exits 1 with a ::error:: line). Real resolution is never
      changed. The audit requestObject carries the poisoned Corefile; the
      grader keys on its rewrite and on the sentinel block's forward to a public (TEST-NET)
      IP; the root block's forward is never changed.
      Chokepoint: objectRef.resource=configmaps, objectRef.namespace=kube-system,
      objectRef.name=coredns, verb=patch.
      Rule: detections/sigma/T1565.001/k8s_coredns_configmap_modified.yml
      Grader: detections/sigma/T1565.001/k8s_coredns_corefile_poisoned.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate.sh a
      cleanup_command: |
        true
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1565.001/src

  - name: "TRR9027.K8S.B — edit the legacy kube-dns ConfigMap (inert)"
    auto_generated_guid: ebaca048-ef50-4df7-aa73-0e7bffe7072c
    description: |
      Creates a kube-dns ConfigMap in kube-system with a stubDomains redirect (JSON), by
      server-side apply (a PATCH by name, logged at Request with its body). Skipped when a
      kube-dns ConfigMap already exists. Inert on a CoreDNS cluster; created only to emit
      the chokepoint audit event.
      Rule: detections/sigma/T1565.001/k8s_coredns_configmap_modified.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate.sh b
      cleanup_command: |
        kubectl -n kube-system delete configmap -l app.kubernetes.io/part-of=trr9027 --ignore-not-found
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1565.001/src

  - name: "TRR9027.K8S.C — inject via the coredns-custom import path (inert)"
    auto_generated_guid: e4207aca-1ba8-41ee-8301-cba43749cc6c
    description: |
      Creates a coredns-custom ConfigMap in kube-system with a forward snippet, by server-side
      apply (a PATCH by name, logged at Request with its body). Skipped when a coredns-custom
      ConfigMap already exists. Inert unless the base Corefile imports it (a kind Corefile
      does not); created only for the chokepoint audit event.
      Rule: detections/sigma/T1565.001/k8s_coredns_configmap_modified.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate.sh c
      cleanup_command: |
        kubectl -n kube-system delete configmap -l app.kubernetes.io/part-of=trr9027 --ignore-not-found
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1565.001/src

  - name: "TRR9027.K8S.D — recreate the coredns ConfigMap (delete, then create), then restore"
    auto_generated_guid: 8b3e5d21-6f4a-4c9e-a7d2-1e0b9c8f7a63
    description: |
      Saves the coredns ConfigMap, deletes it, and creates it again at once (a POST to the
      collection, verb create) with the original Corefile plus an inert sentinel stub zone
      (trr9027stub.example.invalid forwarded to a TEST-NET IP), then restores the original
      Corefile. Skips a coredns ConfigMap that has an owner, an addon-manager label or the
      EKS add-on label (eks.amazonaws.com/component), and skips the run unless
      `kubectl auth can-i` allows create, patch and delete of ConfigMaps in kube-system
      (a failed read of coredns, or a can-i check that gives no answer, fails the test).
      Puts the saved object back if the create fails, then checks that coredns exists
      with the saved Corefile byte for byte (trailing line break included); if not, it
      prints a ::error:: line with the saved object and exits 1. A create names no object when the
      audit policy is evaluated, so the policy's kube-system ConfigMap create rule (Request)
      is what logs its body; the grader keys on the stub zone's forward to a public IP.
      Rule: detections/sigma/T1565.001/k8s_coredns_configmap_modified.yml
      Grader: detections/sigma/T1565.001/k8s_coredns_corefile_poisoned.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate.sh d
      cleanup_command: |
        true
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1565.001/src

  - name: "TRR9027.K8S.E — edit the OpenShift DNS Operator ConfigMap openshift-dns/dns-default (inert)"
    auto_generated_guid: 2d9f8c17-0a4b-4e6d-9c3f-71b5e0a9027e
    description: |
      OpenShift renders the cluster DNS Corefile into the ConfigMap openshift-dns/dns-default
      (the DNS Operator, openshift/cluster-dns-operator). kind has no DNS Operator, so this
      creates an inert openshift-dns namespace and a dns-default ConfigMap of the operator's
      default Corefile shape (no redirect), then patches it with an inert sentinel server block
      (a rewrite plus a forward of trr9027poison.example.invalid to a TEST-NET IP). Nothing on the
      cluster reads it. Skipped, before any write, when the cluster has an openshift-dns namespace
      or a dnses.operator.openshift.io CRD that the emulation did not create (no
      app.kubernetes.io/part-of=trr9027 label: a real OpenShift, OKD or MicroShift cluster), and
      when a dns-default ConfigMap already exists; so it never writes into a real OpenShift DNS
      namespace. The namespace and ConfigMap it creates are labelled
      app.kubernetes.io/part-of=trr9027 and cleanup deletes only those. The audit policy logs openshift-dns/dns-default at RequestResponse, so the patch
      reaches the log with its body; the chokepoint keys on objectRef.namespace=openshift-dns,
      objectRef.name=dns-default, and the grader keys on the injected rewrite and the public
      (TEST-NET) forward.
      Rule: detections/sigma/T1565.001/k8s_coredns_configmap_modified.yml
      Grader: detections/sigma/T1565.001/k8s_coredns_corefile_poisoned.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate.sh e
      cleanup_command: |
        kubectl -n openshift-dns delete configmap -l app.kubernetes.io/part-of=trr9027 --ignore-not-found
        kubectl delete namespace -l app.kubernetes.io/part-of=trr9027 --field-selector metadata.name=openshift-dns --ignore-not-found
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1565.001/src

  - name: "TRR9027.K8S.F — edit the OpenShift DNS Operator object dnses.operator.openshift.io (inert)"
    auto_generated_guid: 3e0a9d28-1b5c-4f7e-8d42-62c6f1b9027f
    description: |
      On OpenShift the sanctioned way to change cluster DNS is the cluster-scoped DNS Operator
      object dnses.operator.openshift.io/default (openshift/api). kind has no such object or CRD,
      so this installs the vendored CRD (src/openshift-dnses.crd.yaml, Apache-2.0; see
      src/SOURCES.md) only when absent, creates an inert dnses/default object with an empty spec,
      then patches spec.servers with a sentinel zone forwarded to a TEST-NET IP. Nothing renders a
      Corefile from it on kind, so it is inert. Skipped, before any write, when the cluster has a
      dnses.operator.openshift.io CRD or an openshift-dns namespace that the emulation did not
      create (no app.kubernetes.io/part-of=trr9027 label: a real OpenShift, OKD or MicroShift
      cluster), and when a dnses/default object already exists; so it never creates or deletes
      a dnses object under a real DNS Operator CRD (deleting dnses/default makes a real operator
      delete the cluster DNS DaemonSet). The CRD copy
      that this test installs carries the label app.kubernetes.io/part-of=trr9027 (added to the
      copy it sends; the vendored file is not changed), so cleanup deletes the labelled object
      and then the CRD only when it carries that label: a CRD that this test did not install
      is never deleted. The audit policy logs
      operator.openshift.io/dnses writes (update/patch at RequestResponse, create, delete and
      deletecollection at Request), so the patch reaches the log with its body; the chokepoint keys on
      objectRef.apiGroup=operator.openshift.io and objectRef.resource=dnses.
      Rule: detections/sigma/T1565.001/k8s_coredns_configmap_modified.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate.sh f
      cleanup_command: |
        if kubectl get crd dnses.operator.openshift.io >/dev/null 2>&1; then kubectl delete dnses.operator.openshift.io -l app.kubernetes.io/part-of=trr9027 --ignore-not-found; fi
        kubectl delete crd -l app.kubernetes.io/part-of=trr9027 --field-selector metadata.name=dnses.operator.openshift.io --ignore-not-found
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1565.001/src

  - name: "TRR9027.K8S — node-local Corefile bypass (no audit event)"
    auto_generated_guid: 156cf4ea-472c-4e6f-bfdf-00a0030ba87e
    description: |
      Read-only demonstration of the gap: an adversary with control-plane node access can
      edit CoreDNS's mounted config on disk or in etcd with no API write and no audit event,
      so the chokepoint is blind. Shows the etcd data path on the node; makes no change.
      Needs node access (docker exec on kind) or TRR9027_NODE_EXEC.
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate.sh gap
      cleanup_command: |
        true
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1565.001/src
