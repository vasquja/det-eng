attack_technique: T1565.001
display_name: "Stored Data Manipulation (Kubernetes Cluster DNS Poisoning)"

# Behavioral emulation for TRR9027. Each test writes a cluster DNS ConfigMap in
# kube-system, so the API server writes the configmaps audit event the paired detections
# key on. The poison carries the sentinel token 'trr9027' so a validator matches the
# emulation's own events. SAFETY: Procedure A captures the real coredns Corefile, appends
# an INERT sentinel server block (a forward of a .invalid zone no workload resolves to a
# TEST-NET IP), and RESTORES the original at once; Procedures B and C write ConfigMaps a
# CoreDNS kind cluster does not read (kube-dns, coredns-custom), so they are inert and are
# deleted on cleanup. These need a reachable cluster with rights on kube-system ConfigMaps,
# audit logging at Request level for kube-system ConfigMaps (see
# detections/k8s/audit-policy-apiserver.yaml), and python3.

atomic_tests:
  - name: "TRR9027.K8S.A — repoint the coredns Corefile, then restore"
    auto_generated_guid: ee24a095-e7c0-4e70-aac8-acb7d6d5ae10
    description: |
      Patches the coredns ConfigMap Corefile with an inert sentinel server block (a forward
      of trr9027poison.example.invalid to a TEST-NET IP), then restores the original
      Corefile. Real resolution is never changed. The audit requestObject carries the
      poisoned Corefile the grader keys on.
      Chokepoint: objectRef.resource=configmaps, objectRef.namespace=kube-system,
      objectRef.name=coredns, verb=patch.
      Rule: detections/sigma/T1565.001/k8s_coredns_configmap_modified.yml
      Grader: detections/sigma/T1565.001/k8s_coredns_corefile_poisoned.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate.sh a
      cleanup_command: |
        true
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1565.001/src

  - name: "TRR9027.K8S.B — edit the legacy kube-dns ConfigMap (inert)"
    auto_generated_guid: ebaca048-ef50-4df7-aa73-0e7bffe7072c
    description: |
      Creates a kube-dns ConfigMap in kube-system with a stubDomains redirect (JSON). Inert
      on a CoreDNS cluster; created only to emit the chokepoint audit event.
      Rule: detections/sigma/T1565.001/k8s_coredns_configmap_modified.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate.sh b
      cleanup_command: |
        kubectl -n kube-system delete configmap kube-dns --ignore-not-found
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1565.001/src

  - name: "TRR9027.K8S.C — inject via the coredns-custom import path (inert)"
    auto_generated_guid: e4207aca-1ba8-41ee-8301-cba43749cc6c
    description: |
      Creates a coredns-custom ConfigMap in kube-system with a forward snippet. Inert unless
      the base Corefile imports it (a kind Corefile does not); created only for the
      chokepoint audit event.
      Rule: detections/sigma/T1565.001/k8s_coredns_configmap_modified.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate.sh c
      cleanup_command: |
        kubectl -n kube-system delete configmap coredns-custom --ignore-not-found
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1565.001/src

  - name: "TRR9027.K8S — node-local Corefile bypass (no audit event)"
    auto_generated_guid: 156cf4ea-472c-4e6f-bfdf-00a0030ba87e
    description: |
      Read-only demonstration of the gap: an adversary with control-plane node access can
      edit CoreDNS's mounted config on disk or in etcd with no API write and no audit event,
      so the chokepoint is blind. Shows the etcd data path on the node; makes no change.
      Needs node access (docker exec on kind) or TRR9027_NODE_EXEC.
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate.sh gap
      cleanup_command: |
        true
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1565.001/src
