attack_technique: T1685
display_name: Disable or Modify Tools

atomic_tests:
  - name: io_uring syscall-bypass ring created — behavioral
    auto_generated_guid: 739898de-9d8c-4b09-a1e4-558aebe9e1b6
    description: |
      Generates `io_uring_setup(2)` and a zero-submission `io_uring_enter(2)`.
      io_uring performs file and network I/O through a shared ring instead of
      the classic read()/write()/openat() syscalls, which is a known blind
      spot for syscall-hooking sensors (EDR, basic auditd). This atomic only
      creates a ring and issues an enter with zero submissions — no file is
      opened, read, or written — so a team can measure whether its tooling
      observes io_uring at all.

      Reference: io_uring_setup(2), io_uring_enter(2); kernel.io_uring_disabled
      sysctl. Behavioral signature only — not a working exploit.

      Detection guidance:
        * `io_uring_setup` (ring creation) from a process not baselined for
          the host (databases, proxies and some runtimes use io_uring). Do not
          alert on `io_uring_enter`: a ring user calls it for every I/O batch
        * Confirm your sensor records io_uring at all — many only hook the
          classic I/O syscalls
    supported_platforms:
      - linux
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1685/src
    dependency_executor_name: bash
    dependencies:
      - description: gcc must be available
        prereq_command: command -v gcc >/dev/null
        get_prereq_command: |
          echo "Install gcc via your package manager (apt/dnf/pacman)."
          exit 1
    executor:
      name: bash
      elevation_required: false
      command: |
        gcc -O0 -Wall -o /tmp/io_uring_bypass_behavioral #{source_dir}/io_uring_bypass_behavioral.c
        /tmp/io_uring_bypass_behavioral
      cleanup_command: |
        rm -f /tmp/io_uring_bypass_behavioral

  # --- Kubernetes admission-control disabling (TRR9008) ---------------------------
  # These disable harmless, throwaway admission objects (never a real policy webhook)
  # so the API server audit events exist for the paired detections. They need a
  # reachable cluster (kubectl) with rights to write admissionregistration and apps
  # objects, and audit logging at Request level (detections/k8s/kind-apiserver-cluster.yaml).

  - name: "TRR9008.K8S.A — delete a ValidatingWebhookConfiguration (Kubernetes)"
    auto_generated_guid: 14758b1b-d47d-4825-ac6d-be3c18aaf56d
    description: |
      Applies a harmless no-op ValidatingWebhookConfiguration (failurePolicy Ignore,
      bogus rules) and deletes it. Deleting a validating webhook config stops admission
      validation for the resources it covered.
      Chokepoint: objectRef.apiGroup=admissionregistration.k8s.io, a disabling verb.
      Rule: detections/sigma/T1685/k8s_admission_webhook_disabled.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate_k8s.sh a
      cleanup_command: |
        kubectl delete validatingwebhookconfiguration trr9008-vwc --ignore-not-found
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1685/src

  - name: "TRR9008.K8S.B — delete a MutatingWebhookConfiguration (Kubernetes)"
    auto_generated_guid: 5f8985cf-d1be-484b-bb87-fa1d85a333eb
    description: |
      Applies a harmless no-op MutatingWebhookConfiguration and deletes it.
      Rule: detections/sigma/T1685/k8s_admission_webhook_disabled.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate_k8s.sh b
      cleanup_command: |
        kubectl delete mutatingwebhookconfiguration trr9008-mwc --ignore-not-found
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1685/src

  - name: "TRR9008.K8S.C — neuter a webhook configuration in place (Kubernetes)"
    auto_generated_guid: 7a722e03-05e4-4c7e-b5e7-7a526ca63203
    description: |
      Applies an enforcing (failurePolicy Fail) but harmless webhook config, then
      merge-patches it to failurePolicy Ignore with an empty rules list, so the request
      body carries the neuter markers the severity rule grades (verb=patch). Then four
      more neuter shapes, each on its own harmless config (trr9008-neuter-merge, -json,
      -const, -nssel): a merge patch and a JSON patch that replace the webhooks list and
      drop rules (graded from the stored object, RequestResponse), a constant-false
      matchCondition, and a namespaceSelector that matches no namespace.
      Chokepoint rule: detections/sigma/T1685/k8s_admission_webhook_disabled.yml
      Severity rule: detections/sigma/T1685/k8s_admission_webhook_neutered.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate_k8s.sh c
      cleanup_command: |
        kubectl delete validatingwebhookconfiguration trr9008-neuter trr9008-neuter-merge trr9008-neuter-json trr9008-neuter-const trr9008-neuter-nssel --ignore-not-found
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1685/src

  - name: "TRR9008.K8S.D — remove the enforcer workload (Kubernetes)"
    auto_generated_guid: 685c887d-91a9-47ee-b2d8-71f7fd8693d6
    description: |
      In a throwaway namespace, creates a harmless pause Deployment as a stand-in for a
      policy engine, scales it to zero twice (kubectl scale, which writes the
      deployments/scale subresource, then a patch of spec.replicas to 0), then deletes it. Removing or
      scaling down the enforcer removes the webhook endpoint; with failurePolicy Ignore,
      admission then fails open. Never touches a real Gatekeeper/Kyverno/Falco workload.
      Rule: detections/sigma/T1685/k8s_security_tool_workload_removed.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate_k8s.sh d
      cleanup_command: |
        kubectl delete namespace trr9008 --ignore-not-found
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1685/src

  - name: "TRR9008.K8S.D — remove a stand-in enforcer workload in the kyverno namespace (Kubernetes)"
    auto_generated_guid: 40b34102-8658-4d46-8948-b0b8933f332d
    description: |
      Procedure D in a policy engine's default namespace. Creates the kyverno namespace
      only when it is absent (labelled trr9008-created=true; it waits first for a kyverno
      namespace that is still terminating), and a harmless pause Deployment
      trr9008-enforcer-standin in it. Scales the Deployment to zero twice: kubectl scale
      --current-replicas=1, which reads the Scale object and writes it back with an
      update (PUT) of the deployments/scale subresource, then a plain kubectl scale (a
      patch). Then deletes the Deployment, and deletes the kyverno namespace only when
      the test created it.
      Never touches a real Kyverno workload; a kyverno namespace that existed before is
      kept.
      Rule: detections/sigma/T1685/k8s_enforcer_workload_removed.yml
      Anchor rule: detections/sigma/T1685/k8s_security_tool_workload_removed.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate_k8s.sh d2
      cleanup_command: |
        kubectl -n kyverno delete deployment trr9008-enforcer-standin --ignore-not-found
        kubectl delete namespace -l trr9008-created=true --ignore-not-found
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1685/src

  - name: "TRR9008.K8S — node-local admission bypass (detection gap, Kubernetes)"
    auto_generated_guid: 9597a1ca-7b5d-4310-bfd4-2c792b4d1545
    description: |
      Read-only demonstration that an attacker with control-plane node access can disable
      admission without any admissionregistration write (editing the kube-apiserver static
      manifest to drop admission plugins, or tampering with the webhook TLS material). None
      of that is an API write, so the audit chokepoint is blind; a node file-integrity sensor
      covers it. Needs node access (docker exec on kind), as TRR9003 does.
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate_k8s.sh gap
      cleanup_command: |
        true
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1685/src

  - name: "TRR9008.K8S — server-side dry runs of a disable and a removal (control: must not fire, Kubernetes)"
    auto_generated_guid: 2c6806c3-5e12-4cdd-a8b2-10ca9bd72f11
    description: |
      A control, not a procedure. Installs a harmless enforcing webhook config
      trr9008-dryrun-vwc (rules on a bogus group) and a pause Deployment
      trr9008-dryrun-standin in the gatekeeper-system namespace (created only when it is
      absent, labelled trr9008-created=true). Then sends each write with
      --dry-run=server: a merge patch that neuters the webhook and its delete; a patch of
      spec.replicas 0, kubectl scale --current-replicas=1 --replicas=0 (a PUT of
      deployments/scale), kubectl scale --replicas=0 (a patch) and the delete of the
      Deployment; a deletecollection of the Deployments labelled
      app=trr9008-dryrun-standin (kubectl delete --raw with a DeleteOptions body that
      holds dryRun ["All"]); and the delete of the gatekeeper-system namespace. When
      gatekeeper-system existed before the test (it has no trr9008-created label), the
      test fails before its first write and sends nothing to that namespace. It checks
      that the webhook still fails closed, the Deployment still asks for 1 replica and the
      namespace is still Active. A server-side dry run persists nothing, so the rules
      below must match none of these records (the validator's must-not-match checks).
      Never touches a real Gatekeeper workload or namespace.
      Rules: detections/sigma/T1685/k8s_admission_webhook_disabled.yml,
      detections/sigma/T1685/k8s_admission_webhook_neutered.yml,
      detections/sigma/T1685/k8s_security_tool_workload_removed.yml,
      detections/sigma/T1685/k8s_enforcer_workload_removed.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate_k8s.sh dryrun
      cleanup_command: |
        kubectl delete validatingwebhookconfiguration trr9008-dryrun-vwc --ignore-not-found
        kubectl -n gatekeeper-system delete deployment trr9008-dryrun-standin --ignore-not-found
        kubectl delete namespace -l trr9008-created=true --ignore-not-found
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1685/src
