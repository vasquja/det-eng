attack_technique: T1078.004
display_name: "Valid Accounts: Cloud Accounts (leaked long-term access key + Cognito guest identities, AWS)"

# Behavioral emulation for TRR9012 (leaked long-term access key) and TRR9016 (Amazon
# Cognito unauthenticated identity-pool abuse). The live tests run in your own AWS account
# and clean up (the 9012 test is READ-ONLY; the 9016 test creates and deletes a throwaway
# identity pool); NOT run in CI. CI validation runs the paired Sigma rules over the
# committed CloudTrail fixtures in detections/cloud/fixtures/trr9012/ and trr9016/ via
# detections/validate_cloud_detections.py.

atomic_tests:
  - name: "TRR9012.AWS.A — leaked long-term key: whoami + account enumeration"
    auto_generated_guid: 7e1c2a90-9012-4a3b-8d21-3f4a5b6c7d81
    description: |
      Uses a long-term IAM-user access key (AKIA...) to call sts:GetCallerIdentity and
      an IAM/S3 enumeration burst from off-cloud. Read-only.
      Chokepoint: CloudTrail userIdentity.type IAMUser + accessKeyId AKIA, orientation/
      enumeration eventName, from a source outside known-good egress.
      Rule: detections/sigma/T1078.004/aws_leaked_access_key_recon.yml
    supported_platforms:
      - iaas:aws
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate.sh a
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1078.004/src

  - name: "TRR9016.AWS.D — Cognito identity pool allows unauthenticated identities"
    auto_generated_guid: 6d4b2f10-9016-4a1b-9c21-1a2b3c4d5e61
    description: |
      Creates a throwaway Cognito identity pool with AllowUnauthenticatedIdentities=true
      (and AllowClassicFlow=true), requests a guest identity with no logins, then deletes
      the pool.
      Chokepoint: CloudTrail CreateIdentityPool with requestParameters
      allowUnauthenticatedIdentities=true (the enabling misconfiguration, default trail),
      plus the downstream AssumedRole use (sessionIssuer.userName Cognito_*Unauth_Role).
      Rules: detections/sigma/T1078.004/aws_cognito_identity_pool_unauth_enabled.yml ;
             detections/sigma/T1078.004/aws_cognito_unauthenticated_identity_use.yml
    supported_platforms:
      - iaas:aws
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate_aws_cognito.sh d
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1078.004/src

  - name: "TRR9023.AZR.A — federated service-principal sign-in (FIC use)"
    auto_generated_guid: 8d9e0f12-9023-4a1b-9c21-1a2b3c4d5e61
    description: |
      Performs a workload-identity-federation token exchange so a service principal signs in to
      Entra with a federated identity credential (the USE side of a FIC backdoor; TRR9013 covers
      the write). Needs an external OIDC token the app's FIC trusts.
      Chokepoint: Entra AADServicePrincipalSignInLogs with properties.federatedCredentialId
      populated (clientCredentialType clientAssertion) on an SP whose baseline is secret/cert.
      Rule: detections/sigma/T1078.004/entra_service_principal_federated_credential_signin.yml
    supported_platforms:
      - iaas:azure
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate_entra_sp_fic_signin.sh a
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1078.004/src
