# Target workload for the TRR9002 emulation tests.
#
# One throwaway pod the tests run commands against. It runs `sleep` as its main
# process so it stays up. stdin/tty are kept open so the attach test
# (Procedure B) has an interactive main process to connect to.
#
# This is a lab target, not a secure example: it exists only to receive the
# benign emulation commands and is deleted with the cluster.
apiVersion: v1
kind: Pod
metadata:
  name: trr9002-target
  namespace: default
  labels:
    app: trr9002-target
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      stdin: true
      tty: true
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: false
        capabilities:
          drop: ["ALL"]
