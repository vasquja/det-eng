# TRR9005 Procedure C — a Job whose Pod template requests host access.
# The container only runs /bin/true (no exploit); the point is the privileged /
# hostPath / hostPID fields in the Request-level audit event. This same batch
# write is also graded by the TRR9007 controller rule.
apiVersion: batch/v1
kind: Job
metadata:
  name: trr9005-hostjob
  namespace: default
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels:
        app: trr9005-hostjob
    spec:
      restartPolicy: Never
      hostPID: true
      volumes:
        - name: host-tmp
          hostPath:
            path: /tmp
            type: Directory
      containers:
        - name: hostjob
          image: busybox:1.36
          command: ["/bin/true"]
          securityContext:
            privileged: true
          volumeMounts:
            - name: host-tmp
              mountPath: /host-tmp
              readOnly: true
