attack_technique: T1068
display_name: Exploitation for Privilege Escalation

atomic_tests:
  - name: CopyFail (CVE-2026-31431) — AF_ALG page-cache write behavioral
    auto_generated_guid: 7b70c48d-e107-4fc6-992b-6a6e5d1eeaf9
    description: |
      Generates the rare Linux syscall pattern characteristic of the CopyFail
      page-cache corruption primitive: AF_ALG socket bound to the
      `authencesn(hmac(sha256),cbc(aes))` AEAD, followed by
      `sendmsg(MSG_MORE)` and `splice()`. The exploit primitive completes
      only when `recv()` triggers AEAD decryption that writes into the
      file-backed page cache; this atomic intentionally stops before
      `recv()`, so no page cache is corrupted. Target file is a throwaway
      under /tmp that this test creates and cleans up.

      Reference: CVE-2026-31431. Behavioral signature only — not a working
      exploit.

      Detection guidance:
        * AF_ALG socket bind() where salg_name == "authencesn(hmac(sha256),cbc(aes))"
        * `splice()` with one end an AF_ALG operation fd
        * `sendmsg(MSG_MORE)` on an AF_ALG operation fd
    supported_platforms:
      - linux
    input_arguments:
      target_file:
        description: Throwaway file to use as splice() target.
        type: string
        default: /tmp/copyfail_atomic_target
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1068/src
    dependency_executor_name: bash
    dependencies:
      - description: gcc must be available
        prereq_command: command -v gcc >/dev/null
        get_prereq_command: |
          echo "Install gcc via your package manager (apt/dnf/pacman)."
          exit 1
      - description: Kernel must expose AF_ALG (CONFIG_CRYPTO_USER_API)
        prereq_command: |
          python3 -c "import socket; socket.socket(socket.AF_ALG, socket.SOCK_SEQPACKET, 0).close()"
        get_prereq_command: |
          echo "Kernel lacks AF_ALG support — rebuild with CONFIG_CRYPTO_USER_API_AEAD."
          exit 1
    executor:
      name: bash
      elevation_required: false
      command: |
        gcc -O0 -Wall -o /tmp/copyfail_behavioral #{source_dir}/copyfail_behavioral.c
        /tmp/copyfail_behavioral #{target_file}
      cleanup_command: |
        rm -f /tmp/copyfail_behavioral #{target_file}

  - name: DirtyFrag xfrm-ESP (CVE-2026-43284) — behavioral
    auto_generated_guid: c1694daf-ce1a-4056-8f2e-ed2652647c3e
    description: |
      Generates the syscall pattern characteristic of the DirtyFrag
      xfrm-ESP page-cache write primitive: user+network namespace unshare
      followed by opening an AF_NETLINK / NETLINK_XFRM socket. Stops
      before transmitting any XFRM SA configuration or ESP packet — well
      short of the kernel path that performs the page-cache write.

      Reference: CVE-2026-43284. Behavioral signature only — not a working
      exploit.

      Detection guidance:
        * unshare(CLONE_NEWUSER | CLONE_NEWNET) by an unprivileged process
          followed shortly by NETLINK_XFRM socket creation
        * Sustained xfrm SA add operations from non-network-management
          processes
    supported_platforms:
      - linux
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1068/src
    dependency_executor_name: bash
    dependencies:
      - description: gcc must be available
        prereq_command: command -v gcc >/dev/null
        get_prereq_command: |
          echo "Install gcc via your package manager (apt/dnf/pacman)."
          exit 1
      - description: Unprivileged user namespaces must be permitted
        prereq_command: |
          test "$(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo 1)" = "1"
        get_prereq_command: |
          echo "Unprivileged user namespaces are disabled on this host."
          echo "Some distros (Ubuntu w/ AppArmor) block this — expected; the atomic will still emit unshare() telemetry."
          exit 0
    executor:
      name: bash
      elevation_required: false
      command: |
        gcc -O0 -Wall -o /tmp/dirtyfrag_xfrm_behavioral #{source_dir}/dirtyfrag_xfrm_behavioral.c
        /tmp/dirtyfrag_xfrm_behavioral
      cleanup_command: |
        rm -f /tmp/dirtyfrag_xfrm_behavioral

  - name: DirtyFrag RxRPC (CVE-2026-43500) — behavioral
    auto_generated_guid: b3e7394f-30d9-4e53-aec2-3fb20b73f752
    description: |
      Generates the high-signal syscall `socket(AF_RXRPC, SOCK_DGRAM, 0)`
      from a non-AFS process. The socket is immediately closed — no bind,
      no sendmsg, none of the operations on the page-cache write path.

      Reference: CVE-2026-43500. Behavioral signature only — not a working
      exploit. The rxrpc kernel module is loaded by default on Ubuntu;
      other distributions may need `modprobe rxrpc`.

      Detection guidance:
        * `socket(AF_RXRPC, ...)` from any process not part of an AFS
          client (kafs/openafs) is a strong indicator on most fleets
        * Combine with rxrpc module load events for higher fidelity
    supported_platforms:
      - linux
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1068/src
    dependency_executor_name: bash
    dependencies:
      - description: gcc must be available
        prereq_command: command -v gcc >/dev/null
        get_prereq_command: |
          echo "Install gcc via your package manager (apt/dnf/pacman)."
          exit 1
      - description: rxrpc kernel module must be available
        prereq_command: |
          python3 -c "import socket; socket.socket(33, socket.SOCK_DGRAM, socket.AF_INET).close()"
        get_prereq_command: |
          modprobe rxrpc || { echo "rxrpc module unavailable"; exit 1; }
    executor:
      name: bash
      elevation_required: false
      command: |
        gcc -O0 -Wall -o /tmp/dirtyfrag_rxrpc_behavioral #{source_dir}/dirtyfrag_rxrpc_behavioral.c
        /tmp/dirtyfrag_rxrpc_behavioral
      cleanup_command: |
        rm -f /tmp/dirtyfrag_rxrpc_behavioral

  - name: DirtyPipe (CVE-2022-0847) — splice read-only precondition behavioral
    auto_generated_guid: 9a7ebf67-fdae-42c8-acfb-fc0bff934c5f
    description: |
      Generates the syscall pattern characteristic of the DirtyPipe
      page-cache write primitive: create a pipe, fill then drain it so its
      buffers retain PIPE_BUF_FLAG_CAN_MERGE, open a file `O_RDONLY`, and
      `splice()` one byte from the read-only file into the pipe. The exploit
      completes only when a following `write()` to the pipe overwrites the
      read-only file's page cache; this atomic intentionally stops before
      that `write()`, and only ever touches a throwaway file it creates under
      /tmp, so nothing is modified.

      Reference: CVE-2022-0847. Behavioral signature only — not a working
      exploit.

      Detection guidance:
        * `pipe()` / `pipe2()` shortly followed by `splice()` from the same
          PID, where `splice` fd_in is a read-only regular file and fd_out is
          a pipe
        * Plain auditd SYSCALL records do not expose fd types; pair with an
          eBPF sensor (Falco, Tetragon) to confirm the read-only source and
          pipe destination
    supported_platforms:
      - linux
    input_arguments:
      target_file:
        description: Throwaway file the test creates, reads, and removes.
        type: string
        default: /tmp/dirtypipe_atomic_target
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1068/src
    dependency_executor_name: bash
    dependencies:
      - description: gcc must be available
        prereq_command: command -v gcc >/dev/null
        get_prereq_command: |
          echo "Install gcc via your package manager (apt/dnf/pacman)."
          exit 1
    executor:
      name: bash
      elevation_required: false
      command: |
        gcc -O0 -Wall -o /tmp/dirtypipe_behavioral #{source_dir}/dirtypipe_behavioral.c
        /tmp/dirtypipe_behavioral #{target_file}
      cleanup_command: |
        rm -f /tmp/dirtypipe_behavioral #{target_file}

  - name: userfaultfd heap-grooming primitive — behavioral
    auto_generated_guid: ecb8124a-1ef2-416b-a402-6973818a3af9
    description: |
      Generates the rare `userfaultfd(2)` syscall plus a UFFDIO_REGISTER
      ioctl. userfaultfd lets userspace pause the kernel mid-copy and is a
      common timing primitive for use-after-free and heap-spray privilege
      escalation. This atomic creates a userfaultfd, registers one anonymous
      page, and STOPS — it never faults the page and never runs a race.

      Reference: userfaultfd(2); vm.unprivileged_userfaultfd sysctl.
      Behavioral signature only — not a working exploit.

      Detection guidance:
        * `userfaultfd` syscall from any process outside a small allowlist
          (CRIU, QEMU post-copy migration, some databases/JITs)
    supported_platforms:
      - linux
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1068/src
    dependency_executor_name: bash
    dependencies:
      - description: gcc must be available
        prereq_command: command -v gcc >/dev/null
        get_prereq_command: |
          echo "Install gcc via your package manager (apt/dnf/pacman)."
          exit 1
    executor:
      name: bash
      elevation_required: false
      command: |
        gcc -O0 -Wall -o /tmp/userfaultfd_behavioral #{source_dir}/userfaultfd_behavioral.c
        /tmp/userfaultfd_behavioral
      cleanup_command: |
        rm -f /tmp/userfaultfd_behavioral

  - name: Kernel keyring stuffing (add_key burst) — behavioral
    auto_generated_guid: 992c42e5-6b88-4769-a492-e1f94fa813d6
    description: |
      Generates a burst of `add_key(2)` syscalls — the setup used by several
      kernel keyring privilege-escalation bugs (CVE-2016-0728, CVE-2022-1998).
      All keys are tiny and harmless and go into the caller's PRIVATE process
      keyring (KEY_SPEC_PROCESS_KEYRING), which is discarded when the process
      exits; the user's session/user keyrings are never touched. The keyring
      is also cleared before exit.

      Reference: add_key(2), keyctl(2); CVE-2016-0728. Behavioral signature
      only — not a working exploit.

      Detection guidance:
        * High volume of `add_key` syscalls from a single PID in a short
          window, from a process outside the keyring-using allowlist
          (gnome-keyring, systemd, sshd, gssproxy, nfsidmap)
    supported_platforms:
      - linux
    input_arguments:
      key_count:
        description: Number of keys to add (1-1000).
        type: string
        default: '100'
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1068/src
    dependency_executor_name: bash
    dependencies:
      - description: gcc must be available
        prereq_command: command -v gcc >/dev/null
        get_prereq_command: |
          echo "Install gcc via your package manager (apt/dnf/pacman)."
          exit 1
    executor:
      name: bash
      elevation_required: false
      command: |
        gcc -O0 -Wall -o /tmp/keyring_stuffing_behavioral #{source_dir}/keyring_stuffing_behavioral.c
        /tmp/keyring_stuffing_behavioral #{key_count}
      cleanup_command: |
        rm -f /tmp/keyring_stuffing_behavioral

  - name: perf_event_open from non-profiler process — behavioral
    auto_generated_guid: c816247b-fac9-4b04-a5fc-3a6101427c25
    description: |
      Generates the `perf_event_open(2)` syscall from a non-profiler process.
      perf_event_open has been a repeated local privilege-escalation surface
      (CVE-2013-2094, perf_swevent). This atomic opens one benign software
      counter (task-clock) that monitors only itself, never enables it, never
      reads samples, and closes it.

      Reference: perf_event_open(2); CVE-2013-2094; kernel.perf_event_paranoid
      sysctl. Behavioral signature only — not a working exploit.

      Detection guidance:
        * `perf_event_open` syscall from a process outside the profiler
          allowlist (perf, sysdig, APM agents, some language runtimes)
    supported_platforms:
      - linux
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1068/src
    dependency_executor_name: bash
    dependencies:
      - description: gcc must be available
        prereq_command: command -v gcc >/dev/null
        get_prereq_command: |
          echo "Install gcc via your package manager (apt/dnf/pacman)."
          exit 1
    executor:
      name: bash
      elevation_required: false
      command: |
        gcc -O0 -Wall -o /tmp/perf_event_open_behavioral #{source_dir}/perf_event_open_behavioral.c
        /tmp/perf_event_open_behavioral
      cleanup_command: |
        rm -f /tmp/perf_event_open_behavioral
