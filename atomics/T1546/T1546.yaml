attack_technique: T1546
display_name: "Event Triggered Execution (Kubernetes Malicious Admission Webhook)"

# Behavioral emulation for TRR9025. Tests A-C INSTALL a harmless, throwaway dynamic
# admission object through the API server (a create); test D REPOINTS harmless installed
# webhooks to a URL (an update or patch) and installs one with a server-side apply (a
# patch answered 201). The API server writes the admissionregistration.k8s.io audit
# events the paired detections key on. Every object is named trr9025-* so a validator
# matches the emulation's own events, and every webhook is a NO-OP: failurePolicy Ignore
# (A, B) or Fail (D, so the repoint carries no neuter marker), a bogus unreachable
# off-cluster clientConfig.url, and an objectSelector matching a label no object carries
# (D also has rules on a bogus API group), so it never intercepts real admission. TRR9008
# (T1685) owns disabling (delete/neuter). These need a reachable cluster with rights to
# write admissionregistration objects and audit logging at Request level for creates and
# at Request or higher for updates and patches (see
# detections/k8s/kind-apiserver-cluster.yaml).

atomic_tests:
  - name: "TRR9025.K8S.A — create a mutating webhook backdoor (off-cluster URL, wildcard rules)"
    auto_generated_guid: c1c58357-00ab-47fb-8fdc-4335ea2d0224
    description: |
      Creates a no-op MutatingWebhookConfiguration (trr9025-mwc) whose clientConfig.url
      points off-cluster and whose rules reach every object (operations CREATE, apiGroups
      ["*"], resources ["*"]). An objectSelector on a label no object carries, plus
      failurePolicy Ignore, make it inert; the audit requestObject still carries the URL
      the grader keys on (the wildcard rules are recorded but not graded).
      Chokepoint: objectRef.apiGroup=admissionregistration.k8s.io, verb=create.
      Rule: detections/sigma/T1546/k8s_admission_webhook_created.yml
      Grader: detections/sigma/T1546/k8s_malicious_admission_webhook_created.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate_k8s.sh a
      cleanup_command: |
        kubectl delete mutatingwebhookconfiguration trr9025-mwc --ignore-not-found
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1546/src

  - name: "TRR9025.K8S.B — create a validating webhook scoped to secrets (off-cluster URL)"
    auto_generated_guid: 3e3c8bb5-eac5-4181-97d1-b8418c9dcb59
    description: |
      Creates a no-op ValidatingWebhookConfiguration (trr9025-vwc) scoped to secrets with
      an off-cluster clientConfig.url, the Secret-exfiltration shape. An objectSelector on
      a label no object carries, plus failurePolicy Ignore, keep it from intercepting a
      real Secret; the audit requestObject carries the URL and the secrets scope.
      Grader: detections/sigma/T1546/k8s_malicious_admission_webhook_created.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate_k8s.sh b
      cleanup_command: |
        kubectl delete validatingwebhookconfiguration trr9025-vwc --ignore-not-found
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1546/src

  - name: "TRR9025.K8S.C — create a CEL ValidatingAdmissionPolicy (chokepoint only)"
    auto_generated_guid: 281d6daf-f45d-435f-bc4f-a8f0ece27dc7
    description: |
      Creates a benign CEL ValidatingAdmissionPolicy (trr9025-vap, always-allow, no
      binding). It cannot call off-cluster, so it fires the chokepoint but is not graded.
      Rule: detections/sigma/T1546/k8s_admission_webhook_created.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate_k8s.sh c
      cleanup_command: |
        kubectl delete validatingadmissionpolicy trr9025-vap --ignore-not-found
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1546/src

  - name: "TRR9025.K8S.D — repoint installed webhooks to a URL (patch, JSON patch, PUT, apply), and a server-side-apply URL-mode install"
    auto_generated_guid: 6f0d2b8e-3a41-4c9e-9b7a-1e5c8d2f4a90
    description: |
      Creates four no-op Service-backed ValidatingWebhookConfigurations
      (trr9025-hijack-smp, -json, -put, -ssa; failurePolicy Fail, rules on a bogus group,
      an objectSelector on a label no object carries), then moves each one to the
      off-cluster clientConfig.url with a different request shape: a strategic merge
      patch, a JSON patch, kubectl replace (PUT) and a server-side apply. Each repoint is
      answered 200 (a modify of an existing object). It also installs one NEW URL-mode
      webhook (trr9025-ssa-create) with kubectl apply --server-side, which the API server
      performs as a PATCH answered 201 (a create; K21). The webhooks are never called.
      The audit policy logs these writes at RequestResponse.
      Chokepoint: detections/sigma/T1685/k8s_admission_webhook_disabled.yml
      Repoint grader: detections/sigma/T1546/k8s_admission_webhook_repointed_to_url.yml
      Create grader: detections/sigma/T1546/k8s_malicious_admission_webhook_created.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate_k8s.sh d
      cleanup_command: |
        kubectl delete validatingwebhookconfiguration trr9025-hijack-smp trr9025-hijack-json trr9025-hijack-put trr9025-hijack-ssa trr9025-ssa-create --ignore-not-found
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1546/src

  - name: "TRR9025.K8S — control-plane etcd bypass (no audit event)"
    auto_generated_guid: 1d3b37fa-9550-490b-a5ae-873b3bfadc3e
    description: |
      Read-only demonstration of the gap: an adversary with control-plane node/etcd access
      can write a webhook configuration straight into etcd, with no API create and no audit
      event, so the chokepoint is blind. Shows the etcd data path on the node; makes no
      change. Needs node access (docker exec on kind) or TRR9025_NODE_EXEC.
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate_k8s.sh gap
      cleanup_command: |
        true
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1546/src

  - name: "TRR9025.K8S — server-side dry-run repoint to a URL (control: must not fire)"
    auto_generated_guid: c231d668-706a-424f-9523-14ddcafc3dda
    description: |
      A control, not a procedure. Installs a no-op Service-backed
      ValidatingWebhookConfiguration trr9025-dryrun-vwc (as Procedure D does), then sends
      Procedure D's strategic merge patch (service -> the off-cluster url) with
      --dry-run=server, and checks that the stored webhook still calls its Service. A
      server-side dry run persists nothing, so the rules below must match none of these
      records (the validator's must-not-match checks).
      Repoint grader: detections/sigma/T1546/k8s_admission_webhook_repointed_to_url.yml
      Chokepoint: detections/sigma/T1685/k8s_admission_webhook_disabled.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate_k8s.sh dryrun
      cleanup_command: |
        kubectl delete validatingwebhookconfiguration trr9025-dryrun-vwc --ignore-not-found
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1546/src
