attack_technique: T1485
display_name: "Data Destruction (Kubernetes Storage: PVC and PV deletes)"

# Behavioral emulation for TRR9028. Each test destroys application storage through the
# API server, so the delete / deletecollection / patch audit events the paired
# detections key on exist. Everything happens in a throwaway namespace trr9028 with
# uniquely named objects (trr9028-*; trr9028-dryrun-ns and trr9028-dryrun-* for the
# dry-run control), so a validator matches the emulation's own events. The objects are
# INERT: each PersistentVolume is a no-provisioner, Retain hostPath reference, so
# deleting a PVC or PV destroys no backing volume and no real data. Each test first
# creates what it deletes (a 404 delete proves nothing), and a failed create fails the
# test. These need a reachable cluster and audit logging (see
# detections/k8s/kind-apiserver-cluster.yaml).

atomic_tests:
  - name: "TRR9028.K8S.A — delete a bound PersistentVolumeClaim"
    auto_generated_guid: 0910a2ca-ee0f-4a94-8b24-2e52cfea4eb2
    description: |
      Creates an inert Retain PersistentVolume and a PersistentVolumeClaim bound to it,
      waits for the bind, then deletes the PVC. Deleting a bound PVC releases its PV; with
      reclaim policy Delete the provisioner would then destroy the backing volume.
      Chokepoint: verb delete, objectRef.resource persistentvolumeclaims, a non-system user.
      Rule: detections/sigma/T1485/k8s_storage_volume_deleted.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate.sh a
      cleanup_command: |
        kubectl delete namespace trr9028 --ignore-not-found
        kubectl delete pv trr9028-pv-a --ignore-not-found
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1485/src

  - name: "TRR9028.K8S.B — delete a PersistentVolume"
    auto_generated_guid: 695f038d-86a4-41fd-b485-ef581c25af6e
    description: |
      Creates an inert Retain PersistentVolume and deletes it directly.
      Chokepoint: verb delete, objectRef.resource persistentvolumes, a non-system user.
      Rule: detections/sigma/T1485/k8s_storage_volume_deleted.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate.sh b
      cleanup_command: |
        kubectl delete pv trr9028-pv-b --ignore-not-found
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1485/src

  - name: "TRR9028.K8S.C — bulk-wipe a namespace's PVCs with deletecollection"
    auto_generated_guid: f8a76524-d388-41b7-a12c-02c0c06cb0a7
    description: |
      Creates two PersistentVolumeClaims in the throwaway namespace, then issues a
      collection DELETE on /api/v1/namespaces/trr9028/persistentvolumeclaims (kubectl
      delete --raw, no body), recorded as verb=deletecollection whatever the count, and
      checks both are gone. kubectl delete pvc --all does not send this request: it lists
      the PVCs and deletes each one by name (verb=delete, as in test A).
      Rule: detections/sigma/T1485/k8s_storage_volume_deleted.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate.sh c
      cleanup_command: |
        kubectl delete namespace trr9028 --ignore-not-found
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1485/src

  - name: "TRR9028.K8S.D — flip a PV reclaim policy Retain -> Delete (destructive step)"
    auto_generated_guid: 8129ee78-2e8d-4faa-8855-450318d8f327
    description: |
      Creates an inert PersistentVolume with reclaim policy Retain, then patches
      spec.persistentVolumeReclaimPolicy to Delete with a strategic-merge patch, so a
      later release would destroy the backing volume. The PV is inert (no provisioner),
      so nothing is destroyed here; the patch record is what the grader keys on.
      Grader: detections/sigma/T1485/k8s_volume_reclaim_set_to_delete.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate.sh d
      cleanup_command: |
        kubectl delete pv trr9028-pv-d --ignore-not-found
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1485/src

  - name: "TRR9028.K8S — server-side dry-run deletes (control: must not fire)"
    auto_generated_guid: 46cf6459-a480-42fd-b040-60068044a08b
    description: |
      A control, not a procedure. Creates a throwaway namespace trr9028-dryrun-ns with two
      PersistentVolumeClaims and a cluster-scoped PersistentVolume trr9028-dryrun-pv, then
      sends kubectl delete --dry-run=server for a PVC and the PV, and a deletecollection of
      the namespace's PVCs (kubectl delete --raw with a DeleteOptions body that holds dryRun
      ["All"]). Then it checks every object is still there. A server-side dry run deletes
      nothing, so the chokepoint rule must match none of these records (the validator's
      must-not-match checks). kubectl sends the dry run in the DeleteOptions body, which the
      shipped audit policy logs at Request level.
      Rule: detections/sigma/T1485/k8s_storage_volume_deleted.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate.sh dryrun
      cleanup_command: |
        kubectl delete namespace trr9028-dryrun-ns --ignore-not-found
        kubectl delete pv trr9028-dryrun-pv --ignore-not-found
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1485/src
