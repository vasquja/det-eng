attack_technique: T1098.006
display_name: "Account Manipulation: Additional Container Cluster Roles (Kubernetes RBAC)"

# Behavioral emulation for TRR9004. Every procedure performs a HARMLESS write to a
# Kubernetes RBAC object through the API server, so the one API-server trace each
# needs (the audit event for the rbac.authorization.k8s.io write) exists for the
# paired detections. Every object is named trr9004-* so a validator matches the
# emulation's own events, not the many bootstrap/reconcile RBAC writes a kubeadm
# cluster makes. Bindings point at the read-only built-in `view` role; the one
# wildcard role is never bound; the group binding uses a throwaway group. Nothing
# gains real power. These need a reachable cluster with RBAC write rights (see
# detections/k8s/kind-apiserver-cluster.yaml).

atomic_tests:
  - name: "TRR9004.K8S.A — ClusterRoleBinding to a built-in ClusterRole"
    auto_generated_guid: 96729d38-53f9-458a-a63d-1c0e9973a3bc
    description: |
      Creates a ClusterRoleBinding that binds a throwaway ServiceAccount to the
      read-only built-in `view` ClusterRole. An adversary would name cluster-admin
      instead; the audit event shape (create clusterrolebindings) is identical.
      Chokepoint (Strategy 1): objectRef.apiGroup=rbac.authorization.k8s.io, a write
      verb. Rule: detections/sigma/T1098.006/k8s_rbac_write.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate.sh a
      cleanup_command: |
        kubectl delete clusterrolebinding trr9004-crb-view --ignore-not-found

  - name: "TRR9004.K8S.B — namespaced RoleBinding to a ClusterRole"
    auto_generated_guid: fdf8f2cd-3f80-4c9c-933e-b4d97ce095f3
    description: |
      Creates a namespaced RoleBinding whose roleRef names a ClusterRole (view).
      The binding lives in one namespace but reaches a cluster-wide role; the tell
      is requestObject.roleRef.kind=ClusterRole (Request level).
      Rule: detections/sigma/T1098.006/k8s_rbac_write.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate.sh b
      cleanup_command: |
        kubectl -n default delete rolebinding trr9004-rb-view --ignore-not-found

  - name: "TRR9004.K8S.C — write a wildcard ClusterRole (never bound)"
    auto_generated_guid: 4829d0ce-0420-4e5b-90f3-0e0ec7986c5f
    description: |
      Creates a read-only role and a wildcard "god" role (verbs/resources '*'). The
      wildcard role is NEVER bound to any subject, so it grants nothing; it exists
      only to emit the dangerous-rule telemetry the severity rule keys on.
      Severity rule: detections/sigma/T1098.006/k8s_rbac_privileged_grant.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate.sh c
      cleanup_command: |
        kubectl delete clusterrole trr9004-cr-benign trr9004-cr-wild --ignore-not-found

  - name: "TRR9004.K8S.D — bind a group subject (mass-grant shape)"
    auto_generated_guid: 70561893-de93-49bd-88d8-7c2f442ac6f3
    description: |
      Creates a ClusterRoleBinding whose subject is a GROUP (trr9004-nogroup, a
      throwaway group no principal belongs to) bound to the read-only view role. An
      adversary would name system:authenticated to grant every authenticated user
      at once -- that is a real grant and is documentation only, never run. The
      group-subject shape is the telemetry.
      Severity rule: detections/sigma/T1098.006/k8s_rbac_privileged_grant.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate.sh d
      cleanup_command: |
        kubectl delete clusterrolebinding trr9004-crb-grp --ignore-not-found

  - name: "TRR9004.K8S.E — patch an existing role to add a rule"
    auto_generated_guid: 45117b94-7651-454e-8d27-0f93af422db1
    description: |
      Patches the benign role from Procedure C to append a read rule (verb=patch,
      not create), the stealthy amend-an-existing-object path that detections
      watching only `create` miss.
      Rule: detections/sigma/T1098.006/k8s_rbac_write.yml
    supported_platforms:
      - containers
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate.sh e
      cleanup_command: |
        kubectl delete clusterrole trr9004-cr-benign trr9004-cr-wild --ignore-not-found
