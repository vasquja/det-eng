attack_technique: T1562.008
display_name: "Impair Defenses: Disable or Modify Cloud Logs (GCP Cloud Logging sink/bucket/exclusion tamper)"

# Behavioral emulation for TRR9038. The live tests tamper with GCP Cloud Logging
# config (disable the _Default sink, delete a throwaway custom log bucket, add an
# exclusion for the audit-log stream) and then run the undo commands that RESTORE it, in
# your own throwaway GCP project (guarded by TRR9038_LIVE=1); NOT run in CI. No live run
# against a project was done (see docs/setup/cloud-gcp.md, "Not verified"). The live run
# creates the exclusion with "disabled": true, so it drops no log; its audit record has
# the method CreateExclusion, which is what the rule reads (the attack leaves "disabled"
# out). The rule reads only the _Default bucket, so the record of the custom bucket of
# procedure b does not fire it, by design. CI validation runs the paired Sigma rule over
# the committed Cloud Audit Log fixtures in detections/cloud/fixtures/trr9038/ via
# detections/validate_cloud_detections.py.
# The _Required sink/bucket is LOCKED (cannot be disabled/deleted) and is never a target.
#
# Live-mode variables and prerequisites (dry mode needs none):
#   * all procedures: TRR9038_PROJECT, a throwaway project you own (no placeholder; the run
#     stops with exit 2 before any change if it is not set).
#   * procedure b: TRR9038_CUSTOM_BUCKET, a throwaway custom log bucket whose name starts
#     with trr9038- (so never _Default or _Required; the run stops with exit 2 before any
#     change if it is not set or if the name does not start with trr9038-).
#   * procedure c: `curl` on PATH and a signed-in gcloud (the exclusion is added through the
#     Cloud Logging REST API; the access token comes from `gcloud auth print-access-token`,
#     is kept off the command line, and is never printed).

atomic_tests:
  - name: "TRR9038.GCP.A — delete or disable the _Default log sink"
    auto_generated_guid: b7d1e2f0-9038-4a1b-9c2d-1e2f3a4b5c81
    description: |
      Disables the project _Default log sink (and, live, re-enables it). Deleting,
      disabling or re-diverting the _Default sink stops new logs flowing to the
      _Default bucket.
      Chokepoint: Cloud Audit Log google.logging.v2.ConfigServiceV2.DeleteSink /
      UpdateSink on resourceName .../sinks/_Default (or request.sink.disabled true).
      Rule: detections/sigma/T1562.008/gcp_logging_sink_tampered.yml
    supported_platforms:
      - iaas:gcp
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate_gcp_log_sink.sh a
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1562.008/src

  - name: "TRR9038.GCP.B — delete a log bucket"
    auto_generated_guid: b7d1e2f0-9038-4b2c-8d3e-2f3a4b5c6d92
    description: |
      Deletes a throwaway CUSTOM log bucket (and, live, undeletes it). Deleting the
      _Default bucket drops the logs stored there; the test uses a custom bucket so it
      is reversible.
      Chokepoint: Cloud Audit Log google.logging.v2.ConfigServiceV2.DeleteBucket /
      UpdateBucket on resourceName .../buckets/_Default.
      Rule: detections/sigma/T1562.008/gcp_logging_sink_tampered.yml
    supported_platforms:
      - iaas:gcp
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate_gcp_log_sink.sh b
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1562.008/src

  - name: "TRR9038.GCP.C — add an audit-dropping log exclusion"
    auto_generated_guid: b7d1e2f0-9038-4c3d-7e4f-3a4b5c6d7e03
    description: |
      Adds a project-level log exclusion that matches the audit-log stream (and, live,
      removes it). A project exclusion reduces what reaches the _Default bucket.
      Chokepoint: Cloud Audit Log
      google.logging.v2.ConfigServiceV2.CreateExclusion / UpdateExclusion.
      Rule: detections/sigma/T1562.008/gcp_logging_sink_tampered.yml
    supported_platforms:
      - iaas:gcp
    executor:
      name: bash
      elevation_required: false
      command: |
        bash #{source_dir}/emulate_gcp_log_sink.sh c
    input_arguments:
      source_dir:
        description: Path to the atomic source directory.
        type: string
        default: PathToAtomicsFolder/T1562.008/src
