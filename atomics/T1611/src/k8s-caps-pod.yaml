# TRR9007.K8S.D — added dangerous Linux capabilities. Granted but never exercised.
apiVersion: v1
kind: Pod
metadata:
  name: trr9007-caps
  namespace: default
  labels: {app: trr9007}
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        capabilities:
          add: ["SYS_ADMIN", "SYS_PTRACE"]
