# TRR9007.K8S.E — confinement removed: a pod-level seccompProfile of type Unconfined, so
# the runtime applies no syscall filter to any container of the pod. No host access; the
# container only sleeps. Admitted on a namespace with no restrictive Pod Security
# Admission (the kind default namespace). The container AppArmor half is a separate pod
# (k8s-unconfined-apparmor-pod.yaml), so each validator row proves its own record.
apiVersion: v1
kind: Pod
metadata:
  name: trr9007-unconfined
  namespace: default
  labels: {app: trr9007}
spec:
  securityContext:
    seccompProfile:
      type: Unconfined
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "3600"]
