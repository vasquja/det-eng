# TRR9007.K8S.E through a controller: the Deployment template sets seccomp Unconfined.
# No host access; one replica that only sleeps. The confinement-removed template is the
# adversary's own controller write (explicit name, real identity).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trr9007-unconfined-depl
  namespace: default
  labels: {app: trr9007}
spec:
  replicas: 1
  selector:
    matchLabels: {app: trr9007-unconfined-depl}
  template:
    metadata:
      labels: {app: trr9007-unconfined-depl}
    spec:
      securityContext:
        seccompProfile:
          type: Unconfined
      containers:
        - name: c
          image: busybox:1.36
          command: ["sleep", "3600"]
