# TRR9007.K8S.B — hostPath mount of the node root. Mounted read-only and never
# read; the spec telemetry is the point.
apiVersion: v1
kind: Pod
metadata:
  name: trr9007-hostpath
  namespace: default
  labels: {app: trr9007}
spec:
  volumes:
    - name: hostroot
      hostPath:
        path: /
        type: ""
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: hostroot
          mountPath: /host
          readOnly: true
