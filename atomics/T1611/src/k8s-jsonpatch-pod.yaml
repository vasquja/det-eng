# TRR9007 K18 (JSON-patch grading) base object. A plain pod that the emulation then adds
# a privileged ephemeral container to, with a kubectl patch --subresource=ephemeralcontainers
# --type=json. The JSON patch proves the pod rule's requestObject|re JSON-patch branches
# live. Both containers only sleep.
apiVersion: v1
kind: Pod
metadata:
  name: trr9007-jp-pod
  namespace: default
  labels: {app: trr9007}
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "3600"]
