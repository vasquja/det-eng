# TRR9007.K8S.A — privileged container. The container only sleeps; the point is
# the privileged field in the Request-level audit event.
apiVersion: v1
kind: Pod
metadata:
  name: trr9007-priv
  namespace: default
  labels: {app: trr9007}
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        privileged: true
