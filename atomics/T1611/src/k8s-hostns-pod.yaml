# TRR9007.K8S.C — host namespaces. Shares host PID and IPC but only sleeps.
# hostNetwork is omitted so the single-node kind lab keeps its ports free.
apiVersion: v1
kind: Pod
metadata:
  name: trr9007-hostns
  namespace: default
  labels: {app: trr9007}
spec:
  hostPID: true
  hostIPC: true
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "3600"]
