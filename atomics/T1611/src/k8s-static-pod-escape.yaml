# TRR9007 static-pod delivery — a dangerous STATIC POD. The kubelet runs this
# straight from a node-local manifest, then registers a mirror pod; the node
# runtime sees the running container and the mirror create is audited as
# system:node (links to TRR9003). The container only sleeps.
apiVersion: v1
kind: Pod
metadata:
  name: trr9007-escape-static
  namespace: default
  labels: {app: trr9007}
spec:
  hostPID: true
  volumes:
    - name: hostroot
      hostPath:
        path: /
        type: ""
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        privileged: true
      volumeMounts:
        - name: hostroot
          mountPath: /host
          readOnly: true
