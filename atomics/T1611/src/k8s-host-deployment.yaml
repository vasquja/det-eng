# TRR9007 controller delivery — the same host access requested through a workload
# controller. The adversary's real create is this Deployment (explicit name, real
# identity); the pod the controller later creates carries the same spec. The
# container only sleeps.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trr9007-depl
  namespace: default
  labels: {app: trr9007}
spec:
  replicas: 1
  selector:
    matchLabels: {app: trr9007-depl}
  template:
    metadata:
      labels: {app: trr9007-depl}
    spec:
      containers:
        - name: c
          image: busybox:1.36
          command: ["sleep", "3600"]
          securityContext:
            privileged: true
