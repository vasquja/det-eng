# TRR9007.K8S.E — confinement removed: a container appArmorProfile of type Unconfined
# (the field is GA since v1.30), so the runtime applies no AppArmor profile to the
# container. No pod-level profile is set, so the rule can match only the container field.
# No host access; the container only sleeps. Admitted on a namespace with no restrictive
# Pod Security Admission (the kind default namespace).
apiVersion: v1
kind: Pod
metadata:
  name: trr9007-unconfined-aa
  namespace: default
  labels: {app: trr9007}
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        appArmorProfile:
          type: Unconfined
