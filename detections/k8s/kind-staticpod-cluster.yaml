# kind cluster for the TRR9003 (static pod) lab, with API server audit logging on.
#
# kind ("Kubernetes in Docker") runs a whole cluster as Docker containers. Each
# node is one container. This config follows the kind auditing guide
# (https://kind.sigs.k8s.io/docs/user/auditing/): it mounts the audit policy into
# the control-plane node and passes the two audit flags to the API server.
#
# The control-plane node runs its control plane as static pods (kubeadm writes
# them to /etc/kubernetes/manifests), so the static-pod mechanism is present:
# Procedure A writes one more manifest to that directory on the control-plane node.
# A worker node is added for Procedure B's LIVE path (TRR9003_RECONFIGURE=1): B
# reconfigures the kubelet static source (staticPodURL) and restarts the kubelet,
# which would wedge the control plane if it ran there, so B runs on the worker.
#
# Create it (from the repo root, so the relative extraMounts path resolves):
#
#   kind create cluster --name trr9003 \
#     --image kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed \
#     --config detections/k8s/kind-staticpod-cluster.yaml
#
# (--image is the node image CI pins: KIND_NODE_IMAGE in the validate-*-detections
# workflows. Update it here when that pin moves.)
#
# Read the audit log afterward:
#
#   docker exec trr9003-control-plane \
#     cat /var/log/kubernetes/kube-apiserver-audit.log
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            audit-log-path: /var/log/kubernetes/kube-apiserver-audit.log
            audit-policy-file: /etc/kubernetes/policies/audit-policy.yaml
            # Keep the whole log for the run; rotation would hide early events.
            audit-log-maxbackup: "1"
            audit-log-maxsize: "100"
          extraVolumes:
            - name: audit-policies
              hostPath: /etc/kubernetes/policies
              mountPath: /etc/kubernetes/policies
              readOnly: true
              pathType: DirectoryOrCreate
            - name: audit-logs
              hostPath: /var/log/kubernetes
              mountPath: /var/log/kubernetes
              readOnly: false
              pathType: DirectoryOrCreate
    extraMounts:
      # Path is relative to the working directory of `kind create cluster`.
      - hostPath: ./detections/k8s/audit-policy-staticpod.yaml
        containerPath: /etc/kubernetes/policies/audit-policy.yaml
        readOnly: true
      # Node file-event sensor (C2-7): bind the kubelet static-pod directory to a
      # known host path so the runner's auditd can watch it for writes. kubeadm still
      # writes the control-plane static pods here (a plain directory on the host). The
      # validate-staticpod workflow creates /tmp/trr9003-manifests and adds the auditd
      # watch before cluster create, so kubeadm's writes are recorded too.
      - hostPath: /tmp/trr9003-manifests
        containerPath: /etc/kubernetes/manifests
        readOnly: false
  # A worker node for Procedure B's live staticPodURL reconfiguration (the kubelet
  # restart stays off the control plane). B runs on it only when CI sets
  # TRR9003_RECONFIGURE=1; otherwise the worker is idle.
  - role: worker
