# kind cluster for the TRR9004-9010, 9025-9027 lab (RBAC, Jobs/CronJobs, Secrets, dangerous
# pod specs), with API server audit logging turned on at the levels those
# techniques need.
#
# kind ("Kubernetes in Docker") runs a whole cluster as Docker containers. Each
# node is one container. This config follows the kind auditing guide
# (https://kind.sigs.k8s.io/docs/user/auditing/): it mounts the audit policy into
# the control-plane node and passes the two audit flags to the API server.
#
# Create it (from the repo root, so the relative extraMounts path resolves):
#
#   kind create cluster --name apiserver \
#     --image kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed \
#     --config detections/k8s/kind-apiserver-cluster.yaml
#
# (--image is the node image CI pins: KIND_NODE_IMAGE in the validate-*-detections
# workflows. Update it here when that pin moves.)
#
# The control-plane node container is then `apiserver-control-plane`, which is the
# default node name the TRR9006 and TRR9007 node-access tests look for. Read the
# audit log afterward:
#
#   docker exec apiserver-control-plane \
#     cat /var/log/kubernetes/kube-apiserver-audit.log
#
# A single control-plane node is enough. Every procedure in TRR9004-9010, 9025-9027 is
# visible on it (RBAC, batch, Secrets, and pod admission all go through the one API
# server), and it is also the node for the TRR9007 static-pod gap demonstration.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            audit-log-path: /var/log/kubernetes/kube-apiserver-audit.log
            audit-policy-file: /etc/kubernetes/policies/audit-policy.yaml
            # Keep the whole log for the run; rotation would hide early events.
            audit-log-maxbackup: "1"
            audit-log-maxsize: "100"
          extraVolumes:
            - name: audit-policies
              hostPath: /etc/kubernetes/policies
              mountPath: /etc/kubernetes/policies
              readOnly: true
              pathType: DirectoryOrCreate
            - name: audit-logs
              hostPath: /var/log/kubernetes
              mountPath: /var/log/kubernetes
              readOnly: false
              pathType: DirectoryOrCreate
    extraMounts:
      # Path is relative to the working directory of `kind create cluster`.
      - hostPath: ./detections/k8s/audit-policy-apiserver.yaml
        containerPath: /etc/kubernetes/policies/audit-policy.yaml
        readOnly: true
