title: Kubernetes Pod or Job Deleted (Evidence Removal)
id: 88d1a6c2-828a-44f0-98a7-2fb824f97ada
status: experimental
description: |
  Detects deletion of a Pod or a Job through the API server: an audit event whose
  verb is delete or deletecollection and whose objectRef.resource is pods or jobs.
  This is the TRR9010 Strategy 2 fallback, covering Procedure D. After running a
  malicious workload, an adversary deletes the Pod (and the Job that spawned it) to
  remove the record of what ran. A DELETE on the collection URL (client-go DeleteCollection, or a raw
  DELETE with a label selector) removes many Pods or Jobs in one request and is
  recorded as verb deletecollection, so the rule matches it too. It leaves out one
  deletecollection: the namespace controller's sweep of a namespace being deleted
  (system:serviceaccount:kube-system:namespace-controller), which empties every
  namespace on teardown. The namespace delete itself is a separate event, made by
  the actor, that this rule does not match.

  This is LOW fidelity by design: deleting pods and jobs is routine teardown. Do not
  alert on it standalone. Use it only for correlation -- the same identity that also
  deleted Events in a short window, a deletion in a sensitive namespace, or the
  deletion of a Job whose creation the same identity made (the inverse of TRR9005,
  which detects Job creation for execution). Suppress controller and GitOps
  identities. Metadata level is enough.
references:
  - https://attack.mitre.org/techniques/T1070/
  - https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
author: det-eng
date: 2026/10/12
tags:
  - attack.stealth
  - attack.t1070
logsource:
  product: kubernetes
  service: audit
detection:
  select_workload_delete:
    verb:
      - 'delete'
      - 'deletecollection'
    objectRef.resource:
      - 'pods'
      - 'jobs'
  filter_namespace_teardown:
    user.username: 'system:serviceaccount:kube-system:namespace-controller'
    verb: 'deletecollection'
  # Server-side dry run: kubectl delete --dry-run=server sends dryRun ["All"] in the
  # DeleteOptions body, which only a Request-level (or higher) record holds. The
  # query form (?dryRun=All) is not filtered: with a body present the API server
  # ignores the query.
  filter_dry_run_delete_body:
    requestObject.dryRun|contains: 'All'
  condition: select_workload_delete and not filter_namespace_teardown and not filter_dry_run_delete_body
falsepositives:
  - Routine teardown of pods and jobs by operators, controllers, and GitOps. This
    rule is a correlation anchor only; do not alert standalone. Baseline the
    controller and automation identities.
  - A server-side dry run (kubectl delete --dry-run=server). It is filtered only when
    the record holds the DeleteOptions body (Request level or higher). The shipped lab
    policy logs Job deletes at Request (filtered), but pod deletes and every
    deletecollection at Metadata, so there a dry run still fires.
level: low
