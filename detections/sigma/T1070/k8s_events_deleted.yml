title: Kubernetes Events Deleted
id: 67c14a73-a9fe-49d6-97ae-611d1c3ce88b
status: experimental
description: |
  Detects deletion of Kubernetes Events through the API server: an audit event
  whose objectRef.resource is events and whose verb is delete or deletecollection.
  This is the TRR9010 chokepoint, covering Procedure A (delete one Event in the core
  group), B (bulk-wipe with deletecollection in the core group), C (delete an
  Event in the events.k8s.io group) and G (bulk-wipe with deletecollection in
  events.k8s.io).
  Kubernetes Events record what happened in the cluster -- a
  pod scheduled, an image pulled, a policy denied -- so deleting them destroys
  evidence of an intrusion.

  Two things make this broader than the upstream SigmaHQ rule. It matches
  deletecollection, not just delete, so it catches the bulk cover-up (the SigmaHQ
  rule matches verb=delete only and misses the mass wipe). And it does not pin
  objectRef.apiGroup, so it catches both the core group and events.k8s.io, which
  record the same objectRef.resource=events.

  Metadata level is enough to fire (verb, resource, namespace, name, and identity are
  all present; no requestObject needed). The dry-run filter needs the DeleteOptions
  body, which only Request level (or higher) holds; the shipped lab policy logs Event
  deletes at Request. Routine event turnover is not a false positive:
  Events expire at the etcd storage layer via the API server event-ttl, which is not
  an API delete and writes no audit event. Namespace deletion is: the namespace
  controller (system:serviceaccount:kube-system:namespace-controller) empties a
  namespace being deleted with one deletecollection of core Events and one of
  events.k8s.io Events. The rule filters that identity's deletecollection only, so
  the same identity deleting a single Event still fires. The filter reads only the
  identity and the verb, so a deletecollection sent with a credential of that service
  account is filtered too, from any client and in a namespace that nobody deletes
  (detections/RULE_DEFECTS.md KTBD-E1). The namespace delete itself
  is a separate event, made by the actor (verb delete, objectRef.resource
  namespaces), and this rule does not match it. The low-level hunting rule
  k8s_namespace_deleted.yml matches that accepted namespace delete (TRR9010
  Procedure F); k8s_security_tool_workload_removed.yml also matches the delete of
  the gatekeeper-system, kyverno and falco namespaces. A namespace delete is routine
  (CI preview environments, tenant teardown), and its record does not show why the
  namespace was deleted, so that rule is for hunting by actor and namespace, and for
  correlation with this identity's other writes. Baseline the system identities and
  any known event-exporter service accounts by user.username.

  Managed platforms: the rule sees only what the platform's audit policy records.
  detections/k8s_policy_coverage.py replays the positives of this rule as each
  published policy records them (detections/k8s/policy_coverage.json has the counts; a
  published policy is not a capture, so each line is unverified on a live cluster).
  The EKS policy (EKS Best Practices Guide), the GCE kube-up policy (the EKS user guide
  links it, and the GKE audit-policy page names it) and OpenShift 4.17 and earlier log
  no request on core-group Events (level None): a core delete or collection DELETE
  (Procedures A and B, plain kubectl delete event, and kubectl delete events --all,
  which sends one DELETE per Event) leaves no record there, and only a delete or
  deletecollection in the events.k8s.io group fires. The AKS policy logs an Events
  delete at Metadata and drops a collection DELETE in either group: a single delete,
  and so kubectl delete events --all, fires, but a collection DELETE in either group
  (Procedure B in the core group: a raw API call or client-go DeleteCollection)
  leaves no record. OpenShift 4.18 and
  later and the k3s hardening-guide starter policy log Events deletes. On AKS and under
  the k3s starter policy a delete also writes a RequestReceived record, so one delete
  fires twice (deduplicate by auditID). No rule change can see a request that is not
  recorded: copy Events out of the cluster as they happen (an event exporter), so a
  delete does not remove the only copy. The namespace delete (Procedure F,
  k8s_namespace_deleted.yml) is logged under every one of these policies; where it is
  logged at Metadata (OpenShift Default, the k3s starter policy), a real namespace
  delete that carries ?dryRun=All next to its body is filtered there
  (detections/RULE_DEFECTS.md KTBD-A1, K14).
references:
  - https://attack.mitre.org/techniques/T1070/
  - https://attack.mitre.org/techniques/T1070/004/
  - https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
author: det-eng
date: 2026/10/12
tags:
  - attack.stealth
  - attack.t1070
logsource:
  product: kubernetes
  service: audit
detection:
  select_event_delete:
    objectRef.resource: 'events'
    verb:
      - 'delete'
      - 'deletecollection'
  filter_namespace_teardown:
    user.username: 'system:serviceaccount:kube-system:namespace-controller'
    verb: 'deletecollection'
  # Server-side dry run: kubectl delete --dry-run=server sends dryRun ["All"] in the
  # DeleteOptions body, which only a Request-level (or higher) record holds. The
  # query form (?dryRun=All) is not filtered: with a body present the API server
  # ignores the query.
  filter_dry_run_delete_body:
    requestObject.dryRun|contains: 'All'
  condition: select_event_delete and not filter_namespace_teardown and not filter_dry_run_delete_body
falsepositives:
  - Operators or event-exporter tools that deliberately prune Events. Baseline the
    known identities by user.username.
  - Namespace teardown in a cluster whose kube-controller-manager does not use
    per-controller credentials. The namespace controller then deletes Events as
    system:kube-controller-manager, which the filter does not cover; baseline that
    identity's deletecollection there. With per-controller credentials (the kubeadm
    and kind default) the filter removes the teardown; the benign corpus holds no
    other controller that deletes Events through the API.
  - A server-side dry run (kubectl delete --dry-run=server). It is filtered only when
    the record holds the DeleteOptions body (Request level or higher). The shipped lab
    policy logs Event deletes and deletecollections at Request, so there a dry run is
    filtered; under a policy that logs them at Metadata a dry run still fires. A
    delete with no body whose query holds ?dryRun=All is a dry run too, and fires,
    because the filter reads only the body. The official Python client
    (kubernetes-client/python) sends that shape for dry_run="All" with no body, and so
    does kubectl delete --raw with a ?dryRun=All URI and no -f; kubectl delete
    --dry-run=server and client-go send the dry run in the body
    (detections/RULE_DEFECTS.md K36).
  - A server-side dry run on a managed platform whose published policy logs Event
    deletes at Metadata, so that the record holds no DeleteOptions body. That is the
    AKS policy, OpenShift 4.18 and later with the Default profile and the k3s
    hardening-guide starter policy (both groups), and the events.k8s.io group under
    the EKS and GCE kube-up policies and on OpenShift 4.17 and earlier with the Default
    profile (detections/RULE_DEFECTS.md KTBD-A2).
level: medium
