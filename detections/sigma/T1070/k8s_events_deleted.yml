title: Kubernetes Events Deleted
id: 67c14a73-a9fe-49d6-97ae-611d1c3ce88b
status: experimental
description: |
  Detects deletion of Kubernetes Events through the API server: an audit event
  whose objectRef.resource is events and whose verb is delete or deletecollection.
  This is the TRR9010 chokepoint, covering Procedure A (delete one Event in the core
  group), B (bulk-wipe with deletecollection), and C (delete an Event in the
  events.k8s.io group). Kubernetes Events record what happened in the cluster -- a
  pod scheduled, an image pulled, a policy denied -- so deleting them destroys
  evidence of an intrusion.

  Two things make this broader than the upstream SigmaHQ rule. It matches
  deletecollection, not just delete, so it catches the bulk cover-up (the SigmaHQ
  rule matches verb=delete only and misses the mass wipe). And it does not pin
  objectRef.apiGroup, so it catches both the core group and events.k8s.io, which
  record the same objectRef.resource=events.

  Metadata level is enough (verb, resource, namespace, name, and identity are all
  present; no requestObject needed). Routine event turnover is not a false positive:
  Events expire at the etcd storage layer via the API server event-ttl, which is not
  an API delete and writes no audit event. Namespace deletion is: the namespace
  controller (system:serviceaccount:kube-system:namespace-controller) empties a
  namespace being deleted with one deletecollection of core Events and one of
  events.k8s.io Events. The rule filters that identity's deletecollection only, so
  the same identity deleting a single Event still fires. The namespace delete itself
  is a separate event, made by the actor (verb delete, objectRef.resource
  namespaces), and this rule does not match it. The low-level hunting rule
  k8s_namespace_deleted.yml matches that accepted namespace delete (TRR9010
  Procedure F); k8s_security_tool_workload_removed.yml also matches the delete of
  the gatekeeper-system, kyverno and falco namespaces. A namespace delete is routine
  (CI preview environments, tenant teardown), and its record does not show why the
  namespace was deleted, so that rule is for hunting by actor and namespace, and for
  correlation with this identity's other writes. Baseline the system identities and
  any known event-exporter service accounts by user.username.
references:
  - https://attack.mitre.org/techniques/T1070/
  - https://attack.mitre.org/techniques/T1070/004/
  - https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
author: det-eng
date: 2026/10/12
tags:
  - attack.stealth
  - attack.t1070
logsource:
  product: kubernetes
  service: audit
detection:
  select_event_delete:
    objectRef.resource: 'events'
    verb:
      - 'delete'
      - 'deletecollection'
  filter_namespace_teardown:
    user.username: 'system:serviceaccount:kube-system:namespace-controller'
    verb: 'deletecollection'
  # Server-side dry run: kubectl delete --dry-run=server sends dryRun ["All"] in the
  # DeleteOptions body, which only a Request-level (or higher) record holds. The
  # query form (?dryRun=All) is not filtered: with a body present the API server
  # ignores the query.
  filter_dry_run_delete_body:
    requestObject.dryRun|contains: 'All'
  condition: select_event_delete and not filter_namespace_teardown and not filter_dry_run_delete_body
falsepositives:
  - Operators or event-exporter tools that deliberately prune Events. Baseline the
    known identities by user.username.
  - Namespace teardown in a cluster whose kube-controller-manager does not use
    per-controller credentials. The namespace controller then deletes Events as
    system:kube-controller-manager, which the filter does not cover; baseline that
    identity's deletecollection there. With per-controller credentials (the kubeadm
    and kind default) the filter removes the teardown; the benign corpus holds no
    other controller that deletes Events through the API.
  - A server-side dry run (kubectl delete --dry-run=server). It is filtered only when
    the record holds the DeleteOptions body (Request level or higher). The shipped lab
    policy logs Event deletes at Metadata, so there a dry run still fires.
level: medium
