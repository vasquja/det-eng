title: Kubernetes CoreDNS Corefile Poisoned
id: 8aee81f7-1028-4c86-a2e9-ad2b24333a3b
status: experimental
description: |
  Detects a cluster DNS edit that injects a redirect into the CoreDNS Corefile, by
  inspecting the request body (requestObject, which needs audit level Request or
  higher). This is the TRR9027 severity layer on top of the chokepoint
  (k8s_coredns_configmap_modified.yml): the chokepoint fires on every write to the
  coredns/kube-dns/coredns-custom ConfigMap, this rule picks out the writes that
  poison resolution. It fires when the submitted Corefile carries a redirecting plugin
  -- rewrite, template, or hosts (none is in a default Corefile) -- or when the root
  server block (the one that serves the zone '.', so every name) forwards to an
  explicit IP address, IPv4 or IPv6 (a default Corefile forwards to
  /etc/resolv.conf, not to a literal IP), i.e. all resolution redirected to an
  attacker-controlled target.

  The plugin match uses |re anchored to a directive position (the start of the
  Corefile or a line break, then blanks: '^\s*(rewrite|template|hosts)\s' and
  '[^\S ]\s*(rewrite|template|hosts)\s'), so it tolerates tab-separated directives
  and does not fire on a line commented as '# rewrite ...' (a space after the '#').
  A comment with a tab after the '#' ('#<TAB>rewrite ...') does fire: the portable
  subset cannot say "line break only", and the class '[^\S ]' also matches a tab. The
  forward-to-IP match reads the Corefile from its top with a simplified form of
  CoreDNS's Caddyfile grammar (in the comment above sel_rogue_forward), written in
  portable regex only (no lookaround, no possessive quantifiers). It skips the server
  blocks before the root block, finds the block whose address list holds the root
  zone ('.', '.:53', 'dns://.:53'), and then a 'forward' directive in that block whose
  FROM is the root and one of whose targets is an IPv4 or IPv6 literal. These layouts
  match: the brace on the key line or a later line, no braces at all (a single-block
  Corefile), a comma-separated key list continued onto the next line, the forward on
  the brace line, and a comment that holds a brace. An IP that appears only in a
  comment does not match. The simplified grammar misses a root-block forward when a
  brace sits inside a quoted token or inside a longer token before it (rewrite's
  '{1}' and template's '{{ .Name }}' are such tokens, but those plugins fire the plugin
  clause anyway), when a '#' inside a token or (full-object form only) a tab inside a
  comment followed by a brace shifts the brace count, or when the root block's keys
  are separated by tabs. A forward in any
  other server block -- a stub zone such as a 'corp.example.com:53' block with
  'forward . 10.10.0.53' -- or a forward of one domain inside the root block does
  not fire this rule: a private stub zone to a corporate resolver is routine, and
  its audit record does not differ from a targeted redirect of one domain to an
  attacker resolver. The chokepoint still sees every
  such write; triage it there. The grader also does not follow an 'import' (a
  forward that comes from a snippet or a file), reads only three nested brace
  levels; such a Corefile is seen by the chokepoint only. A full-object or strategic-merge patch carries the
  Corefile at requestObject.data.Corefile (a string), matched directly; a JSON patch
  (kubectl patch --type=json) submits an ops array, so requestObject is one JSON text
  field in which a line break is the two characters backslash-n -- the rule matches
  that raw form too, so the json-patch encoding does not evade the grader. This
  grades Procedure A (poison the base coredns Corefile). Procedure B (kube-dns) stores
  its redirect as JSON stubDomains/upstreamNameservers rather than a Corefile, and
  Procedure C (coredns-custom) stores snippets under arbitrary data keys, so both are
  covered at the chokepoint and triaged there; this grader is the high-confidence
  Corefile case.

  Metadata level cannot feed this rule: the Corefile lives only in requestObject.
  Without Request level a poisoning edit and a benign Corefile change are
  indistinguishable. The shipped audit policy logs updates, patches and deletes of
  the three DNS ConfigMaps at Request, by resourceNames; a create names no object
  when the policy is evaluated, so it is logged at Metadata, with no body. The
  create verb here therefore grades only under a policy that logs ConfigMap creates
  at Request; under the shipped policy a delete-and-recreate of coredns is seen by
  the chokepoint alone. A cluster whose legitimate Corefile already forwards the root
  zone to an explicit upstream IP (a VPC resolver, a corporate DNS) will match the
  forward-to-IP clause; baseline your own Corefile and treat this as a triage signal,
  not a standalone alert.
references:
  - https://attack.mitre.org/techniques/T1565/001/
  - https://coredns.io/plugins/rewrite/
  - https://coredns.io/plugins/forward/
author: det-eng
date: 2026/10/14
tags:
  - attack.impact
  - attack.t1565.001
logsource:
  product: kubernetes
  service: audit
detection:
  select_dns_configmap_write:
    objectRef.resource: 'configmaps'
    objectRef.namespace: 'kube-system'
    objectRef.name:
      - 'coredns'
      - 'kube-dns'
      - 'coredns-custom'
    verb:
      - 'update'
      - 'patch'
      - 'create'
  # Strategic-merge / full-object write: the Corefile is a dotted string field.
  # A plugin directive at the start of a line: at the start of the Corefile, or after
  # a line break ('[^\S ]' is whitespace other than a space). A '#' comment that
  # mentions the word does not match.
  sel_poison_plugin:
    requestObject.data.Corefile|re:
      - '^\s*(rewrite|template|hosts)\s'
      - '[^\S ]\s*(rewrite|template|hosts)\s'
  # The forward-to-IP clause reads the Corefile with a simplified form of CoreDNS's
  # Caddyfile grammar (github.com/coredns/caddy, caddyfile/lexer.go and parse.go), so
  # that a forward in any other server block cannot pass for one in the root block.
  # Portable regex only (no lookaround, no possessive quantifiers, no \A or \n): a
  # line break is '[^\S ]' (whitespace other than a space). The parts, in order:
  #   start    '^': the scan starts at the top of the Corefile, not at any line.
  #   skip     blank lines, '#' comments (to the end of the line) and top-level
  #            'import X' lines, and whole server blocks before the root block (key
  #            text, '{', a body nested up to three brace levels, '}').
  #   keys     the root block's address list: tokens separated by spaces, or by a ','
  #            that continues the list (also onto the next line); one key is the root
  #            zone '.', '.:PORT' or 'dns://.:PORT' (quoted too).
  #   open     value 1: '{' on the key line or on a later line. Value 2: no brace at
  #            all (a single, braceless block, whose directives start on the next
  #            line; its first directive is not '{').
  #   body     directives up to the forward: text, '#' comments and whole nested
  #            blocks, never the root block's own closing '}'.
  #   forward  at a directive position: right after '{', or after a line break at the
  #            body's top level. FROM is the root ('.', '.:PORT', 'dns://.'); the
  #            targets before the IP are paths or URLs (a token with a '/'); then a
  #            target that starts with an IPv4 or IPv6 literal (optionally
  #            'scheme://' or '['). A '#' ends the target list, so an IP in a comment
  #            does not count.
  # Simpler than CoreDNS (see the description): a brace inside a quoted token or
  # inside a longer token counts as a brace, a '#' inside a token starts a comment, a
  # tab inside a comment ends the comment, and root keys must be separated by spaces
  # or commas, not tabs.
  sel_rogue_forward:
    requestObject.data.Corefile|re:
      - '^(\s|\#(\S| )*[^\S ]|import\s+[^\s{}#]+)*([^\s{}#][^{}#]*\{([^{}#]|\#(\S| )*[^\S ]|\{([^{}#]|\#(\S| )*[^\S ]|\{([^{}#]|\#(\S| )*[^\S ])*\})*\})*\}(\s|\#(\S| )*[^\S ]|import\s+[^\s{}#]+)*)*([^\s{}#,]+(,\s*| +))*\"?(dns://)?\.(:[0-9]+)?\"?((,\s*| +)[^\s{}#,]+)*\s*\{(([^{}#]|\#(\S| )*[^\S ]|\{([^{}#]|\#(\S| )*[^\S ]|\{([^{}#]|\#(\S| )*[^\S ])*\})*\})*([^\S ]|\#(\S| )*[^\S ]))?\s*\"?forward\"?\s+\"?([a-z0-9]+://)?\.(:[0-9]+)?\"?(\s+[^\s#{}/]*/[^\s#{}]*)*\s+\"?([a-z0-9]+://)?\[?([0-9]{1,3}(\.[0-9]{1,3}){3}|[0-9A-Fa-f]{0,4}:[0-9A-Fa-f]{0,4}:)'
      - '^(\s|\#(\S| )*[^\S ]|import\s+[^\s{}#]+)*([^\s{}#,]+(,\s*| +))*\"?(dns://)?\.(:[0-9]+)?\"?((,\s*| +)[^\s{}#,]+)* *(\#(\S| )*[^\S ]|[^\S ])(\s|\#(\S| )*[^\S ]|import\s+[^\s{}#]+)*([^{}#\s]([^{}#]|\#(\S| )*[^\S ]|\{([^{}#]|\#(\S| )*[^\S ]|\{([^{}#]|\#(\S| )*[^\S ])*\})*\})*([^\S ]|\#(\S| )*[^\S ]))?\s*\"?forward\"?\s+\"?([a-z0-9]+://)?\.(:[0-9]+)?\"?(\s+[^\s#{}/]*/[^\s#{}]*)*\s+\"?([a-z0-9]+://)?\[?([0-9]{1,3}(\.[0-9]{1,3}){3}|[0-9A-Fa-f]{0,4}:[0-9A-Fa-f]{0,4}:)'
  # JSON patch (kubectl patch --type=json): requestObject is an ops array flattened to
  # one text field, so the Corefile is not at .data.Corefile -- match the raw form too.
  sel_poison_plugin_raw:
    requestObject|contains:
      - 'rewrite '
      - 'template '
      - 'hosts '
  # The same grammar on the JSON text: the scan starts at a JSON string value
  # (':' then '"'), a line break is backslash-n, a blank is a space or backslash
  # r/t/f, a quote is backslash-quote, and an unescaped '"' ends the Corefile. Here a
  # comment runs to the next backslash-n, so a tab inside it does not end it.
  sel_rogue_forward_raw:
    requestObject|re:
      - ':\s*\"(( |\\[nrtf])|\#([^"\\]|\\[^n])*\\n|import( |\\[rtf])+(\\\"[^"\\]*\\\"|[^\s{}#"\\]+))*([^\s{}#"\\]([^{}#"\\]|\\.)*\{([^{}#"\\]|\\.|\#([^"\\]|\\[^n])*\\n|\{([^{}#"\\]|\\.|\#([^"\\]|\\[^n])*\\n|\{([^{}#"\\]|\\.|\#([^"\\]|\\[^n])*\\n)*\})*\})*\}(( |\\[nrtf])|\#([^"\\]|\\[^n])*\\n|import( |\\[rtf])+(\\\"[^"\\]*\\\"|[^\s{}#"\\]+))*)*([^\s{}#,"\\]+(,( |\\[nrtf])*| +))*(\\\")?(dns://)?\.(:[0-9]+)?(\\\")?((,( |\\[nrtf])*| +)[^\s{}#,"\\]+)*( |\\[nrtf])*\{(([^{}#"\\]|\\.|\#([^"\\]|\\[^n])*\\n|\{([^{}#"\\]|\\.|\#([^"\\]|\\[^n])*\\n|\{([^{}#"\\]|\\.|\#([^"\\]|\\[^n])*\\n)*\})*\})*(\\[nrtf]|\#([^"\\]|\\[^n])*\\n))?( |\\[nrtf])*(\\\")?forward(\\\")?( |\\[nrtf])+(\\\")?([a-z0-9]+://)?\.(:[0-9]+)?(\\\")?(( |\\[nrtf])+[^\s#{}/"\\]*/[^\s#{}"\\]*)*( |\\[nrtf])+(\\\")?([a-z0-9]+://)?\[?([0-9]{1,3}(\.[0-9]{1,3}){3}|[0-9A-Fa-f]{0,4}:[0-9A-Fa-f]{0,4}:)'
      - ':\s*\"(( |\\[nrtf])|\#([^"\\]|\\[^n])*\\n|import( |\\[rtf])+(\\\"[^"\\]*\\\"|[^\s{}#"\\]+))*([^\s{}#,"\\]+(,( |\\[nrtf])*| +))*(\\\")?(dns://)?\.(:[0-9]+)?(\\\")?((,( |\\[nrtf])*| +)[^\s{}#,"\\]+)* *(\#([^"\\]|\\[^n])*\\n|\\[nrtf])(( |\\[nrtf])|\#([^"\\]|\\[^n])*\\n|import( |\\[rtf])+(\\\"[^"\\]*\\\"|[^\s{}#"\\]+))*([^{}#\s"\\]([^{}#"\\]|\\.|\#([^"\\]|\\[^n])*\\n|\{([^{}#"\\]|\\.|\#([^"\\]|\\[^n])*\\n|\{([^{}#"\\]|\\.|\#([^"\\]|\\[^n])*\\n)*\})*\})*(\\[nrtf]|\#([^"\\]|\\[^n])*\\n))?( |\\[nrtf])*(\\\")?forward(\\\")?( |\\[nrtf])+(\\\")?([a-z0-9]+://)?\.(:[0-9]+)?(\\\")?(( |\\[nrtf])+[^\s#{}/"\\]*/[^\s#{}"\\]*)*( |\\[nrtf])+(\\\")?([a-z0-9]+://)?\[?([0-9]{1,3}(\.[0-9]{1,3}){3}|[0-9A-Fa-f]{0,4}:[0-9A-Fa-f]{0,4}:)'
  condition: select_dns_configmap_write and (sel_poison_plugin or sel_rogue_forward or sel_poison_plugin_raw or sel_rogue_forward_raw)
falsepositives:
  - A commented-out rewrite, template or hosts line written as '#<TAB>directive'
    fires the plugin clause (see the description).
  - A cluster whose legitimate Corefile forwards the root zone to an explicit
    upstream IP (a VPC resolver, a corporate DNS) matches the forward-to-IP clause.
    Baseline your own Corefile and the known DNS operators, and triage the diff.
  - A legitimate rewrite/template/hosts customization (for example a split-horizon or
    alias). Triage against the actor and the injected target.
level: high
