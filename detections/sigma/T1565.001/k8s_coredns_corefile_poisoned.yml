falsepositives:
  - A commented-out rewrite, template or hosts line written as '#<TAB>directive'
    in the Corefile string fires the plugin clause (see the description).
  - A stub zone that forwards to a public resolver by design (a split-horizon zone
    sent to a provider's public DNS) matches the public-forward clause.
  - Any write to a DNS ConfigMap whose stored Corefile already holds one of these
    (responseObject is graded, not the change).
  - A cluster whose legitimate Corefile forwards the root zone to an explicit
    upstream IP (a VPC resolver, a corporate DNS) matches the forward-to-IP clause.
    Baseline your own Corefile and the known DNS operators, and triage the diff.
  - A legitimate rewrite/template/hosts customization (for example a split-horizon or
    alias), and a hosts block of a distribution default other than the k3s and
    minikube ones excluded here. Triage against the actor and the injected target.
  - A deliberate forward of the cluster zone (or a zone under it) to an IP, for
    example to a multi-cluster DNS service.
level: high
