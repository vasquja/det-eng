title: Kubernetes User Impersonation
id: 564e67ba-b2a4-4ced-9e30-a977c4b2e040
status: experimental
description: |
  Detects a Kubernetes API request made under impersonation: any audit event that
  carries an impersonatedUser. This is the TRR9009 chokepoint, covering Procedure A
  (impersonate a user), B (impersonate a group), C (impersonate a service account),
  and D (impersonate a uid or extra attributes). The API server authenticates the
  real caller, checks the caller's RBAC impersonate permission, then runs the
  request AS the impersonated identity and stamps impersonatedUser onto the audit
  record. Impersonation lets a subject act as another identity -- up to
  system:masters or cluster-admin -- and the downstream action is attributed to the
  borrowed identity, which both escalates privilege and evades attribution.

  The anchor is the PRESENCE of impersonatedUser, regardless of the verb, resource,
  or outcome that follows: Impersonate-User is mandatory for every variant (group,
  uid, and extra all require it). This is stronger than the upstream Elastic rule,
  which matches only a hard-coded list of privileged impersonated identities and
  only when the request was allowed: that misses impersonation of an arbitrary user
  or an unlisted-but-powerful service account, and misses a denied impersonation
  probe. This rule fires on all impersonation; the companion
  (k8s_impersonation_privileged.yml) raises severity on powerful targets.

  A DENIED probe (the caller lacks the impersonate verb) carries no
  impersonatedUser: the impersonation filter refuses the request before it swaps
  the identity. The audit filter runs outside the impersonation filter, so the
  refusal is still recorded under the real caller, with code 403 and a Status
  message that the audit event keeps at Metadata level. The rule matches that too
  (second selection). The message depends on the impersonation filter:
  - legacy impersonation (v1.32; later minors with ConstrainedImpersonation off):
    "... cannot impersonate resource ...";
  - constrained impersonation (beta and on by default from v1.36): the first mode
    the server tries answers, so "... cannot impersonate:<mode> resource ..." or
    "... cannot impersonate-on:<mode>:<verb> resource ...".
  Impersonate-Group, -Uid or -Extra headers without Impersonate-User are refused
  too: on v1.35 and later with a 400 Status whose message says "without
  impersonating a user" (third selection); on v1.34 and earlier with a plain-text
  500 that no field names (RULE_DEFECTS K16). Source: kubernetes v1.32, v1.34,
  v1.35 and v1.36.4 apiserver
  filters/impersonation.go and filters/impersonation/constrained_impersonation.go
  and mode.go (the first mode's error is returned), responsewriters/errors.go
  (forbiddenMessage), audit/request.go (LogResponseObject copies the Status message
  at every level) and server/config.go (WithAudit wraps WithImpersonation). Not yet
  recorded on a live cluster.

  Metadata level is enough: impersonatedUser is a top-level audit event field.
  Request/RequestResponse are not needed. There is no node-sensor fallback:
  impersonation is implemented wholly inside the API server, so the audit log is the
  sole sensor -- if audit is off or at level None, coverage is zero.
references:
  - https://attack.mitre.org/techniques/T1134/
  - https://kubernetes.io/docs/reference/access-authn-authz/user-impersonation/
  - https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
author: det-eng
date: 2026/10/12
tags:
  - attack.stealth
  - attack.privilege-escalation
  - attack.t1134
logsource:
  product: kubernetes
  service: audit
detection:
  select_impersonation:
    impersonatedUser.username: '*'
  # A caller without the impersonate verb is refused by the impersonation filter
  # before the identity is swapped, so no impersonatedUser is stamped. The audit
  # filter wraps the impersonation filter, so the refusal is still recorded, with
  # the 403 Status message "<resource> \"<name>\" is forbidden: User \"<caller>\"
  # cannot <verb> resource ...". The verb is impersonate (legacy impersonation),
  # impersonate:<mode> or impersonate-on:<mode>:<verb> (constrained impersonation,
  # on by default from v1.36).
  select_denied_impersonation:
    responseStatus.code: 403
    responseStatus.message|contains:
      - 'cannot impersonate resource'
      - 'cannot impersonate:'
      - 'cannot impersonate-on:'
  # Impersonate-Group, -Uid or -Extra without Impersonate-User: v1.35 and later
  # answer 400 BadRequest "requested ... without impersonating a user[ name]".
  select_headers_without_user:
    responseStatus.code: 400
    responseStatus.message|contains: 'without impersonating a user'
  condition: select_impersonation or select_denied_impersonation or select_headers_without_user
falsepositives:
  - Tools that legitimately impersonate the logged-in user, such as the Kubernetes
    Dashboard and other UIs, kubectl-sudo, oauth2-proxy gateways, and GitOps or CI
    that impersonates a target service account. Baseline by the REAL actor
    (user.username and user.groups), never by the impersonated identity.
  - Cloud break-glass and admin tooling. Baseline the known callers per cluster.
  - A denied impersonation is also a misconfigured tool or a user who typed --as
    by mistake. Triage the real caller and the borrowed identity in the message.
level: medium
