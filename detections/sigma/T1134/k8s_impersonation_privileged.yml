title: Kubernetes Impersonation of a Privileged Identity
id: 76f0e919-65d7-4a8f-9101-38abda9e3012
status: experimental
description: |
  Detects a Kubernetes impersonated request where the borrowed identity is
  powerful. This is the TRR9009 severity layer on top of the chokepoint
  (k8s_impersonation.yml): the chokepoint fires on every impersonated request, this
  rule raises priority when the impersonated identity is a privileged group
  (system:masters, cluster-admin, system:cluster-admins), a powerful built-in user
  (system:admin, cluster-admin, system:kube-controller-manager), or a kube-system
  service account. Impersonating any of these is an identity-swap straight to
  cluster control, attributed to the borrowed identity.

  impersonatedUser.groups is a list. A store can keep it as JSON text, or give the
  field one value for each group. So sel_priv_groups has two |re values for the
  same group names: one value with the JSON quotes of an element (the list as
  text), and one value anchored with ^ and $ (one value for each element). Each
  value holds for one of the two forms. Neither value matches a longer group name
  that has no quote and no line break in it (SEMANTICS.md section 4). A group name
  that holds a listed name in quotes matches the value with the quotes: on a
  multi-valued field (x"system:masters"y), and in the list text when the listed
  name follows a quote inside the group name and ends it (x"cluster-admin). A |re
  value compares letter case; the comment of sel_priv_groups says why that is
  right for a group name. The privileged-user matches are split into
  separate selections (an exact-name list and a kube-system service-account
  prefix) and OR-ed, because two keys in one selection would be AND-ed and never
  match.

  This is an add-on, not a replacement: an unlisted but powerful target is still
  caught by the base chokepoint rule. Metadata level is enough.
references:
  - https://attack.mitre.org/techniques/T1134/
  - https://kubernetes.io/docs/reference/access-authn-authz/user-impersonation/
author: det-eng
date: 2026/10/12
tags:
  - attack.stealth
  - attack.privilege-escalation
  - attack.t1134
logsource:
  product: kubernetes
  service: audit
detection:
  select_impersonation:
    impersonatedUser.username: '*'
  sel_priv_groups:
    # Value 1 reads the list as JSON text (an element in its quotes). Value 2
    # reads one value of a multi-valued field (the whole value).
    # Letter case: the API server keeps each Impersonate-Group value as the
    # client sent it, and its authorizers compare a group name with Go string
    # equality (==). Source, kubernetes/kubernetes v1.36.4:
    #   staging/src/k8s.io/apiserver/pkg/endpoints/filters/impersonation/
    #   impersonation.go L97-99 and L229-231 (each header value is a group of
    #   the impersonated user; L170 writes that user to the audit event);
    #   staging/src/k8s.io/apiserver/pkg/authorization/authorizerfactory/
    #   builtin.go L82 (system:masters: priv_group == attr_group);
    #   pkg/registry/rbac/validation/rule.go L272-287 (a Group subject of a
    #   binding: has(), s == ele).
    # So a group name in another letter case does not get the access of a group
    # that this item names, and a match that compares letter case is correct.
    # A webhook authorizer can compare names in another way: not verified.
    impersonatedUser.groups|re:
      - '\"(system:masters|cluster-admin|system:cluster-admins)\"'
      - '^(system:masters|cluster-admin|system:cluster-admins)$'
  sel_priv_users:
    impersonatedUser.username:
      - 'system:admin'
      - 'cluster-admin'
      - 'system:kube-controller-manager'
  sel_priv_sa:
    impersonatedUser.username|startswith: 'system:serviceaccount:kube-system:'
  condition: select_impersonation and (sel_priv_groups or sel_priv_users or sel_priv_sa)
falsepositives:
  - Break-glass or admin tooling that legitimately impersonates a powerful identity.
    Triage every hit; baseline the known callers by the real actor (user.username).
level: high
