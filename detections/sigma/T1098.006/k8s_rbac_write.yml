title: Kubernetes RBAC Object Written
id: a333aae1-9e88-401c-9258-dc7ae6327485
status: experimental
description: |
  Detects any write (create, update, patch, delete, deletecollection) to a
  Kubernetes RBAC object in the rbac.authorization.k8s.io API group: roles,
  clusterroles, rolebindings, and clusterrolebindings. This is the TRR9004
  Strategy 1 chokepoint. Every RBAC-object grant (a path that grants, widens, or
  persists a permission through a Role, ClusterRole, RoleBinding or
  ClusterRoleBinding) has to pass through the API server as an rbac write to take
  effect, so one rule covers Procedures A to E and G: binding a powerful
  ClusterRole (A), a namespaced RoleBinding that references a ClusterRole (B),
  writing a wildcard or escalate/bind role (C), binding a built-in group for a mass
  grant (D), patching an existing binding or role (E), and writing a sensitive
  (non-wildcard) role that grants pod exec or attach, token minting or cluster-wide
  Secret reads (G).

  The EKS aws-auth mapping (Procedure F) does not pass through an rbac write: it maps
  an IAM principal to a Kubernetes user and groups through the kube-system/aws-auth
  ConfigMap, and no RBAC object changes. k8s_eks_aws_auth_configmap_modified.yml
  covers Procedure F.

  The verb is the ordinary create/update/patch/delete/deletecollection. The
  special RBAC authorization verbs escalate and bind are NOT the audit verb: they are
  authorization checks on the write, and they appear in the written role's rules
  (requestObject) or in the event annotations, not in the verb field. There is no
  separate `replace` audit verb: an HTTP PUT (kubectl replace, or apply sent as
  PUT) is recorded as verb=update. A DELETE on a collection URL (client-go
  DeleteCollection, or a raw DELETE with a label selector) is recorded as
  verb=deletecollection and removes many roles or bindings in one request, so the
  rule matches it too. The one deletecollection it leaves out is the namespace
  controller's sweep of a namespace being deleted
  (system:serviceaccount:kube-system:namespace-controller); the namespace delete
  itself names the actor.

  This is noisy by design: a kubeadm cluster writes dozens of RBAC objects at
  bootstrap, and kube-controller-manager reconciles the default roles and
  bindings continuously. Baseline the actor, not the object: suppress
  system:kube-controller-manager, system:apiserver, the kubeadm and
  system:bootstrappers identities, and known GitOps or CI service accounts by
  user.username and user.groups, then let the two companion rules raise severity:
  k8s_rbac_privileged_grant.yml (high) on the dangerous grants (a wildcard,
  escalate, bind, impersonate, nodes/proxy, a powerful roleRef or a group subject),
  and k8s_rbac_sensitive_permission_grant.yml (medium) on a role that grants pod
  exec or attach, token minting or cluster-wide Secret reads.
references:
  - https://attack.mitre.org/techniques/T1098/006/
  - https://kubernetes.io/docs/reference/access-authn-authz/rbac/
  - https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
author: det-eng
date: 2026/10/12
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098.006
logsource:
  product: kubernetes
  service: audit
detection:
  select_rbac_write:
    objectRef.apiGroup: 'rbac.authorization.k8s.io'
    verb:
      - 'create'
      - 'update'
      - 'patch'
      - 'delete'
      - 'deletecollection'
  filter_namespace_teardown:
    user.username: 'system:serviceaccount:kube-system:namespace-controller'
    verb: 'deletecollection'
  condition: select_rbac_write and not filter_namespace_teardown
falsepositives:
  - Cluster bootstrap and reconcile. kubeadm and the API server create and
    reconcile the default roles and bindings at start; kube-controller-manager
    rewrites them continuously. Baseline these identities by user.username and
    user.groups.
  - GitOps and CI (Argo CD, Flux, Terraform, Helm) that manage RBAC as part of a
    deploy. Baseline the known automation identities per cluster.
  - Operators and platform teams granting access as normal administration.
    Correlate with the companion severity rule and triage the grant.
level: medium
