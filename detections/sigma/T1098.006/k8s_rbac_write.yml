title: Kubernetes RBAC Object Written
id: a333aae1-9e88-401c-9258-dc7ae6327485
status: experimental
description: |
  Detects any write (create, update, patch, delete) to a Kubernetes RBAC object
  in the rbac.authorization.k8s.io API group: roles, clusterroles, rolebindings,
  and clusterrolebindings. This is the TRR9004 Strategy 1 chokepoint. Every path
  that grants, widens, or persists a permission has to pass through the API
  server as an rbac write to take effect, so one rule covers all five procedures:
  binding a powerful ClusterRole (A), a namespaced RoleBinding that references a
  ClusterRole (B), writing a wildcard or escalate/bind role (C), binding a
  built-in group for a mass grant (D), and patching an existing binding or role
  (E).

  The verb is the ordinary create/update/patch/delete. The special RBAC
  authorization verbs escalate and bind are NOT the audit verb: they are
  authorization checks on the write, and they appear in the written role's rules
  (requestObject) or in the event annotations, not in the verb field. There is no
  separate `replace` audit verb: an HTTP PUT (kubectl replace, or apply sent as
  PUT) is recorded as verb=update, so the four verbs here are complete.

  This is noisy by design: a kubeadm cluster writes dozens of RBAC objects at
  bootstrap, and kube-controller-manager reconciles the default roles and
  bindings continuously. Baseline the actor, not the object: suppress
  system:kube-controller-manager, system:apiserver, the kubeadm and
  system:bootstrappers identities, and known GitOps or CI service accounts by
  user.username and user.groups, then let the companion rule
  (k8s_rbac_privileged_grant.yml) raise severity on the dangerous grants.
references:
  - https://attack.mitre.org/techniques/T1098/006/
  - https://kubernetes.io/docs/reference/access-authn-authz/rbac/
  - https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
author: det-eng
date: 2026/10/12
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098.006
logsource:
  product: kubernetes
  service: audit
detection:
  select_rbac_write:
    objectRef.apiGroup: 'rbac.authorization.k8s.io'
    verb:
      - 'create'
      - 'update'
      - 'patch'
      - 'delete'
  condition: select_rbac_write
falsepositives:
  - Cluster bootstrap and reconcile. kubeadm and the API server create and
    reconcile the default roles and bindings at start; kube-controller-manager
    rewrites them continuously. Baseline these identities by user.username and
    user.groups.
  - GitOps and CI (Argo CD, Flux, Terraform, Helm) that manage RBAC as part of a
    deploy. Baseline the known automation identities per cluster.
  - Operators and platform teams granting access as normal administration.
    Correlate with the companion severity rule and triage the grant.
level: medium
