title: Kubernetes Job or CronJob Written
id: cf252566-a5d1-4d01-a44a-25d7731695ad
status: experimental
description: |
  Detects a write (create, update, patch, delete, deletecollection) to a
  Kubernetes batch workload object: a Job or a CronJob in the batch API group.
  This is the TRR9005 Strategy 1 chokepoint, covering all four procedures: a
  recurring CronJob (A), a one-shot Job (B), a privileged or host-mounting
  Job/CronJob (C), and a modification of an existing one (D). Every one is an
  authenticated write to a batch/v1 object that the API server records; the
  technique has no API-server bypass (that is what separates it from static pods,
  T1543.005), so one rule covers it.

  The rule excludes the built-in controllers that write batch objects on their own:
  the cronjob controller (creates a Job for each scheduled run, and deletes old Jobs
  past the history limit), the job controller (Job status), the
  ttl-after-finished controller (deletes a finished Job that sets
  ttlSecondsAfterFinished), and the garbage collector (deletes the Jobs of a deleted
  CronJob). It also excludes the namespace controller's deletecollection, the sweep
  that empties a namespace being deleted. Without these filters the rule alerts on
  every scheduled run and every cleanup of every legitimate Job. Excluding the
  controllers keeps the rule on the human or service identity that set the schedule
  up, or that deleted the CronJob or the namespace -- the adversary's own entry. The
  cost is that the recurring executions themselves are not seen here; the node
  runtime fallback (k8s_cri_job_pod.yml) covers those.

  The filters assume that kube-controller-manager runs each controller with its own
  service-account credentials (--use-service-account-credentials=true, the kubeadm
  and kind default). Where the controllers act as system:kube-controller-manager
  instead, the filters match nothing, and every scheduled CronJob run fires; add
  that identity to the baseline there.

  There is no separate replace audit verb: an HTTP PUT is recorded as
  verb=update. A DELETE on the collection URL (client-go DeleteCollection, or a
  raw DELETE with a label selector) is recorded as verb=deletecollection, which
  removes many Jobs in one request, so the rule matches it too.

  A privileged or host-mounting batch object (Procedure C) also matches the TRR9007
  controller rule (k8s_podspec_controller_host_access.yml), which grades the
  embedded Pod template -- the same write, two lenses; dedup by auditID.
references:
  - https://attack.mitre.org/techniques/T1053/007/
  - https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
  - https://kubernetes.io/docs/concepts/workloads/controllers/job/
  - https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
author: det-eng
date: 2026/10/12
tags:
  - attack.execution
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1053.007
logsource:
  product: kubernetes
  service: audit
detection:
  select_batch_write:
    objectRef.apiGroup: 'batch'
    objectRef.resource:
      - 'jobs'
      - 'cronjobs'
    verb:
      - 'create'
      - 'update'
      - 'patch'
      - 'delete'
      - 'deletecollection'
  filter_controllers:
    user.username:
      - 'system:serviceaccount:kube-system:cronjob-controller'
      - 'system:serviceaccount:kube-system:job-controller'
      - 'system:serviceaccount:kube-system:ttl-after-finished-controller'
      - 'system:serviceaccount:kube-system:generic-garbage-collector'
  # The namespace controller empties a namespace being deleted with one
  # deletecollection per resource type; the namespace delete itself names the actor.
  filter_namespace_teardown:
    user.username: 'system:serviceaccount:kube-system:namespace-controller'
    verb: 'deletecollection'
  # Null-safe negation: a backend with three-valued logic (ES|QL and other SQL
  # backends) reads NOT of a test on a missing field as NULL and drops the record. The
  # record of a request that fails authentication (401) has no user.username (apiserver
  # v1.36.4 WithFailedAuthenticationAudit and audit.LogRequestMetadata), so each filter
  # on the user name is ORed with a test that the field is absent.
  sel_no_username:
    user.username: null
  condition: >-
    select_batch_write and (sel_no_username or not filter_controllers)
    and (sel_no_username or not filter_namespace_teardown)
falsepositives:
  - Legitimate batch work. Backups, report generation, and batch processing run
    as Jobs and CronJobs all the time. Baseline the identities (users and service
    accounts) that legitimately create batch objects, and the known schedules.
  - GitOps and CI (Argo CD, Flux, Helm) that deploy Jobs or CronJobs. Baseline the
    automation identities per cluster.
  - Clusters whose kube-controller-manager does not use per-controller credentials.
    The controllers then write as system:kube-controller-manager, which the filters
    do not cover. Baseline that identity there.
level: medium
