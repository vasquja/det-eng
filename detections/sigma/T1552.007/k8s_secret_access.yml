title: Kubernetes Secret Read
id: d0ee9764-bfe1-4aaa-9413-f4f8a3da2a59
status: experimental
description: |
  Detects a read of a Kubernetes Secret through the API server: an audit event
  whose objectRef.resource is secrets and whose verb is get, list, or watch. This
  is the TRR9006 Strategy 1 chokepoint, covering Procedure A (list a namespace or
  the whole cluster), Procedure B (get one Secret by name), and Procedure C (watch
  Secrets). Every API read of a Secret produces exactly one such event, written
  before the data is returned, so one verb-agnostic rule covers all three.

  Matching get, list, AND watch is the point. The SigmaHQ rule
  kubernetes_audit_secrets_enumeration.yml matches verb=list only, so it misses a
  targeted get and a streaming watch. Both are real credential-access paths.

  This is Metadata-level telemetry by design and by necessity: Metadata records
  the verb, resource, namespace, name, identity, source, client, and response
  code. It does NOT record the Secret's data. Do not raise secrets to Request or
  RequestResponse level: RequestResponse copies the Secret's base64 data into the
  audit log and turns the log itself into a credential store.

  It is noisy without baselining: controllers and the kubelet read Secrets
  continuously. Baseline the actor (suppress system:kube-controller-manager, the
  kubelet, the garbage collector, the token cleaner, and known workloads by
  user.username), then triage on who, from where, with which client, and against
  which namespace. A cluster-wide list, a read from a pod source IP, a non-kubectl
  client, or a burst of 403s (permission probing) are high-signal.
references:
  - https://attack.mitre.org/techniques/T1552/007/
  - https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
  - https://microsoft.github.io/Threat-Matrix-for-Kubernetes/techniques/List%20K8S%20secrets/
author: det-eng
date: 2026/10/12
tags:
  - attack.credential-access
  - attack.t1552.007
logsource:
  product: kubernetes
  service: audit
detection:
  select_secret_read:
    objectRef.resource: 'secrets'
    verb:
      - 'get'
      - 'list'
      - 'watch'
  condition: select_secret_read
falsepositives:
  - Controllers and the kubelet read Secrets continuously
    (system:kube-controller-manager, the token and root-CA controllers, the
    kube-system token cleaner, the garbage collector, system:node:*). Baseline
    these identities by user.username.
  - Applications that read their own Secrets, and operators and GitOps that read
    Secrets as part of normal work. Baseline the known workloads and namespaces.
level: medium
