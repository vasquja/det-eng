title: Kubernetes Service Account Token Minted via TokenRequest
id: 6c4f601d-e642-4dca-b9f4-cf98ef9c18f4
status: experimental
description: |
  Detects a service-account token minted through the TokenRequest API: an audit
  event whose objectRef.resource is serviceaccounts, subresource is token, and
  verb is create. This is the TRR9006 Strategy 2 fallback, covering Procedure D.
  It is a different resource and edge than a Secret read, so the chokepoint rule
  (k8s_secret_access.yml) does not see it. An adversary with permission on the
  serviceaccounts/token subresource can mint a fresh, valid token for a more
  powerful service account and impersonate it.

  The rule excludes the identities that mint pod and component tokens routinely:
  system:kube-controller-manager, system:kube-scheduler, every system:node:*
  (the kubelet mints projected pod tokens constantly), and every
  system:serviceaccount:kube-system:* . Without these exclusions the rule is pure
  noise. What remains is a token mint by a human or a non-system service account,
  which is unusual and worth triage.

  Metadata level fires this rule and is safe. Do not use RequestResponse: the
  response body carries the signed token. Request level is optional, to enrich on
  requestObject.spec.audiences and spec.boundObjectRef (a token minted with no
  boundObjectRef, or for an unusual audience, by a non-system identity is higher
  signal).
references:
  - https://attack.mitre.org/techniques/T1552/007/
  - https://kubernetes.io/docs/reference/kubernetes-api/authentication-resources/token-request-v1/
  - https://securitylabs.datadoghq.com/articles/kubernetes-tokenrequest-api/
author: det-eng
date: 2026/10/12
tags:
  - attack.credential-access
  - attack.t1552.007
logsource:
  product: kubernetes
  service: audit
detection:
  select_token_create:
    objectRef.resource: 'serviceaccounts'
    objectRef.subresource: 'token'
    verb: 'create'
  filter_system_minters:
    user.username:
      - 'system:kube-controller-manager'
      - 'system:kube-scheduler'
  filter_node:
    user.username|startswith: 'system:node:'
  filter_kubesystem_sa:
    user.username|startswith: 'system:serviceaccount:kube-system:'
  # Null-safe negation: a backend with three-valued logic (ES|QL and other SQL
  # backends) reads NOT of a test on a missing field as NULL and drops the record. The
  # record of a request that fails authentication (401) has no user.username (apiserver
  # v1.36.4 WithFailedAuthenticationAudit and audit.LogRequestMetadata), so the filters
  # on the user name are ORed with a test that the field is absent.
  sel_no_username:
    user.username: null
  condition: >-
    select_token_create and
    (sel_no_username or not (filter_system_minters or filter_node or filter_kubesystem_sa))
falsepositives:
  - CI/CD and operators that mint tokens deliberately (for example to authenticate
    to a cluster from a pipeline). Baseline the known automation identities.
  - Workloads outside kube-system that use the TokenRequest API for their own
    projected tokens. Baseline them per namespace.
level: medium
