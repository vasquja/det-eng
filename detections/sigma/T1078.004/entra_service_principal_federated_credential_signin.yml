title: Entra Service Principal Sign-In Using a Federated Identity Credential
id: 4d0e53ad-8f67-4c58-9ace-d114b2377e49
status: experimental
description: |
  Detects a Microsoft Entra service principal that signs in using a FEDERATED IDENTITY CREDENTIAL
  (workload identity federation token exchange) rather than a client secret or certificate --
  properties.federatedCredentialId is populated in the Entra service-principal sign-in log. This is
  the TRR9023 chokepoint and the USE side of a federated-credential backdoor: TRR9013 detects the
  FIC being WRITTEN to the app (audit log); this detects the planted FIC being USED to mint an
  application access token (sign-in log).

  It keys on the service-principal sign-in stream (diagnostic category ServicePrincipalSignInLogs ->
  AADServicePrincipalSignInLogs) on a successful sign-in (resultType 0) whose
  properties.federatedCredentialId carries a non-empty value (present only when a federated
  credential was used; empty for secret/certificate sign-ins). The hard discriminator is that
  federated-credential id: a service principal whose baseline is secret/certificate authentication
  suddenly signing in federated is the strong signal. For a workload that legitimately federates
  (GitHub Actions, AKS), federated sign-in is normal and this is a funnel -- pair it with a
  first-seen overlay (new federatedCredentialId / IP / AutonomousSystemNumber / resource) per SP.

  Field-model note: the sign-in log carries the credential id but NOT the external issuer/subject,
  so the "untrusted issuer" signal that TRR9013 keys on is unavailable here -- this is a
  credential-type / anomaly signal, not a trust signal. Managed-identity FIC use lands in a
  different table (AADManagedIdentitySignInLogs), a companion surface, not this one.
references:
  - https://attack.mitre.org/techniques/T1078/004/
  - https://attack.mitre.org/techniques/T1550/001/
  - https://learn.microsoft.com/azure/azure-monitor/reference/tables/aadserviceprincipalsigninlogs
  - https://learn.microsoft.com/entra/workload-id/workload-identity-federation
author: det-eng
date: 2026/10/13
tags:
  - attack.defense-evasion
  - attack.persistence
  - attack.privilege-escalation
  - attack.initial-access
  - attack.t1078.004
  - attack.lateral-movement
  - attack.t1550.001
logsource:
  product: azure
  service: signinlogs
detection:
  selection:
    category: 'ServicePrincipalSignInLogs'
    properties.resultType: 0
  selection_federated:
    properties.federatedCredentialId|re: '.+'
  condition: selection and selection_federated
falsepositives:
  - Service principals that legitimately authenticate with workload identity federation
    (GitHub Actions, GitLab, AKS workload identity, another cloud's OIDC) sign in federated every
    run. On its own this fires on each such sign-in -- baseline per app/SP and alert on a new
    federatedCredentialId, a new source IP / ASN / location, or a new target resource.
  - The sign-in log carries no issuer/subject, so a federated sign-in from an attacker-added FIC on
    an SP that ALREADY federates is only distinguishable by the first-seen overlay above.
level: medium
