title: AWS IAM Role Trusts GitHub OIDC With a Ref Wildcard on a Pinned Repository
id: 00a7140b-c3d9-466e-b88e-3065acf5b5af
related:
  - id: 0269a7bb-c5f0-4279-a1c5-aec6998bac5a
    type: similar
status: experimental
description: |
  Detects an IAM role trust-policy write that trusts the GitHub Actions OIDC provider
  (token.actions.githubusercontent.com) with a subject (sub) condition that pins the
  owner and the repository but has a wildcard ('*', encoded %2A) after them, in the ref
  or event part: for example repo:org/app:* or repo:org/app:ref:refs/tags/v*. This is
  the lower-severity half of the TRR9015 over-broad-sub check (Procedures A and C). No
  fork and no other repository can match such a sub, but any branch, tag, environment
  or pull-request workflow of that one repository can assume the role, so a user with
  push access to the repository can bypass the branch or environment protection the
  role relied on.

  A wildcard in the owner/repo segment (repo:org/*, repo:*, *), or in a customized
  subject-claim template before any repository pin (repository_owner_id:1234567:*), is
  the high-level rule aws_github_oidc_role_trust_abuse.yml, and so is a trust with no
  GitHub-OIDC scoping claim at all. This rule excludes those, so one write fires one of
  the two rules. A customized template that pins repository_id and then has a wildcard
  (repository_owner_id:1:repository_id:9:*) is graded here.

  It reads the URL-encoded trust policy in requestParameters.policyDocument
  (iam:UpdateAssumeRolePolicy) or requestParameters.assumeRolePolicyDocument
  (iam:CreateRole), as the sibling rule does, with the same limits: a production
  pipeline should URL-decode and JSON-parse the policy. A trust with two or more GitHub
  sub conditions, or a list of sub values, is graded per sub value: it is left to the
  high-level rule when any one value has a wildcard that no repository pin precedes, and
  graded here when every wildcard follows a pinned repository.
references:
  - https://attack.mitre.org/techniques/T1098/001/
  - https://docs.github.com/actions/reference/security/oidc
  - https://docs.github.com/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_create_for-idp_oidc.html
author: det-eng
date: 2026/10/16
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098.001
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_grant:
    eventName:
      - 'UpdateAssumeRolePolicy'
      - 'CreateRole'
  oidc_update:
    requestParameters.policyDocument|contains: 'token.actions.githubusercontent.com'
  oidc_create:
    requestParameters.assumeRolePolicyDocument|contains: 'token.actions.githubusercontent.com'
  # The trust policy is URL-encoded (':' is %3A, '"' is %22, '*' is %2A). Portable regex
  # only (no lookaround): each regex reads the text a token at a time ('[^%]' or '%' and
  # two characters), so '%22' (end of the sub value), '%2A' and '%3A' are never split.
  #
  # A wildcard anywhere inside a sub value: a string value, or an element of a list value
  # (IAM policy grammar: a condition value is a string or a list of strings).
  sub_wildcard_update:
    requestParameters.policyDocument|re: 'githubusercontent\.com%3Asub%22%3A(%5B(%22([^%]|%([^2%]|2[^2%]))*%22%2C)*)?%22([^%]|%([^2%]|2[^2A%]))*%2A'
  sub_wildcard_create:
    requestParameters.assumeRolePolicyDocument|re: 'githubusercontent\.com%3Asub%22%3A(%5B(%22([^%]|%([^2%]|2[^2%]))*%22%2C)*)?%22([^%]|%([^2%]|2[^2A%]))*%2A'
  # The high-level sibling rule takes a wildcard that no repository pin precedes
  # ('repo:<value>:' or 'repository_id:<value>:' with no '*', at a segment start), in
  # the default or a customized subject-claim template. With one string sub value that
  # is owner_repo_wildcard_* with no pin first (the block in the condition); with two or
  # more sub conditions or a list of sub values (sub_multi_*) it is any one value that
  # sub_high_* grades high. So one write fires one of the two rules, and a trust whose
  # every wildcard follows a pinned repository stays here (C16).
  owner_repo_wildcard_update:
    requestParameters.policyDocument|re: 'githubusercontent\.com%3Asub%22%3A%22([^%]|%([^2%]|2[^2%]))*%2A'
  owner_repo_wildcard_create:
    requestParameters.assumeRolePolicyDocument|re: 'githubusercontent\.com%3Asub%22%3A%22([^%]|%([^2%]|2[^2%]))*%2A'
  # A repository pin before the first wildcard of a sub value.
  sub_pinned_update:
    requestParameters.policyDocument|re: 'githubusercontent\.com%3Asub%22%3A%22(([^%]|%([^2%]|2[^2A%]))*%3A)?repo(sitory_id)?%3A([^%]|%([^23%]|2[^2A%]|3[^A%]))+%3A'
  sub_pinned_create:
    requestParameters.assumeRolePolicyDocument|re: 'githubusercontent\.com%3Asub%22%3A%22(([^%]|%([^2%]|2[^2A%]))*%3A)?repo(sitory_id)?%3A([^%]|%([^23%]|2[^2A%]|3[^A%]))+%3A'
  # Two or more GitHub sub conditions in one policy, or a list-valued sub condition.
  sub_multi_update:
    requestParameters.policyDocument|re:
      - 'githubusercontent\.com%3Asub%22.*githubusercontent\.com%3Asub%22'
      - 'githubusercontent\.com%3Asub%22%3A%5B'
  sub_multi_create:
    requestParameters.assumeRolePolicyDocument|re:
      - 'githubusercontent\.com%3Asub%22.*githubusercontent\.com%3Asub%22'
      - 'githubusercontent\.com%3Asub%22%3A%5B'
  # Per sub value: a wildcard that no repository pin precedes (the same value as the
  # high-level sibling rule's sub_high_*; see its comment).
  sub_high_update:
    requestParameters.policyDocument|re: 'githubusercontent\.com%3Asub%22%3A(%5B(%22([^%]|%([^2%]|2[^2%]))*%22%2C)*)?%22((([^r%]|%([^23%]|2[^2A%]|3[^A%])|r([^e%]|e([^p%]|p([^o%]|o([^s%]|s([^i%]|i([^t%]|t([^o%]|o([^r%]|r([^y%]|y([^_%]|_([^i%]|i(d([^%]|%([^23%]|2[^2A%]|3[^A%]))|[^d%])))))))))))))([^%]|%([^23%]|2[^2A%]|3[^A%]))*|(r(e(p(os(i(t(o(r(y(_(i)?)?)?)?)?)?)?)?)?)?)?)%3A|repo(sitory_id)?%3A%3A)*(repo(sitory_id)?%3A)?([^%]|%([^23%]|2[^2A%]|3[^A%]))*%2A'
  sub_high_create:
    requestParameters.assumeRolePolicyDocument|re: 'githubusercontent\.com%3Asub%22%3A(%5B(%22([^%]|%([^2%]|2[^2%]))*%22%2C)*)?%22((([^r%]|%([^23%]|2[^2A%]|3[^A%])|r([^e%]|e([^p%]|p([^o%]|o([^s%]|s([^i%]|i([^t%]|t([^o%]|o([^r%]|r([^y%]|y([^_%]|_([^i%]|i(d([^%]|%([^23%]|2[^2A%]|3[^A%]))|[^d%])))))))))))))([^%]|%([^23%]|2[^2A%]|3[^A%]))*|(r(e(p(os(i(t(o(r(y(_(i)?)?)?)?)?)?)?)?)?)?)?)%3A|repo(sitory_id)?%3A%3A)*(repo(sitory_id)?%3A)?([^%]|%([^23%]|2[^2A%]|3[^A%]))*%2A'
  condition: >
    selection_grant and (oidc_update or oidc_create) and
    (sub_wildcard_update or sub_wildcard_create) and
    not (((owner_repo_wildcard_update or owner_repo_wildcard_create) and
          not (sub_pinned_update or sub_pinned_create) and
          not (sub_multi_update or sub_multi_create))
         or ((sub_multi_update or sub_multi_create) and (sub_high_update or sub_high_create)))
falsepositives:
  - Release workflows that trust every tag of one repository (repo:org/app:ref:refs/tags/v*)
    and roles shared by every workflow of one repository (repo:org/app:*) are common and
    usually deliberate. Review whether the role needs branch or environment pinning;
    allowlist by role name.
level: low
