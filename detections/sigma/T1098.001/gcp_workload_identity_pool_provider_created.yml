title: GCP Workload Identity Pool Provider Created or Updated Without an Attribute Condition
id: df0f3701-52aa-42ff-8848-dcdaddea8143
status: experimental
description: |
  Detects creation or modification of a GCP Workload Identity Pool PROVIDER that trusts
  an external OIDC/AWS/SAML issuer with NO attribute condition restricting which external
  tokens are accepted. This is the TRR9018 companion chokepoint (Procedures A/B): the
  external-trust half of a workload-identity-federation backdoor, where an attribute
  condition is the guardrail that limits who can federate in, and an empty/absent one
  (CEL "" = no restriction) admits any token the attribute mapping matches.

  It keys on a Cloud Audit Log (Admin Activity, always on)
  google.iam.v1.WorkloadIdentityPools.CreateWorkloadIdentityPoolProvider or
  UpdateWorkloadIdentityPoolProvider under serviceName iam.googleapis.com, suppressed
  when protoPayload.request.workloadIdentityPoolProvider.attributeCondition carries a
  real CEL guard (it references assertion.*). Legitimate CI/CD onboarding creates real
  providers, so pair with the issuerUri (an unexpected external issuer), the actor, and
  whether a principalSet from this pool is bound to a privileged SA (the companion
  binding rule). Provider create/update are long-running operations that emit two Admin
  Activity entries -- read the operation.first entry, which carries the request body.
references:
  - https://attack.mitre.org/techniques/T1098/001/
  - https://cloud.google.com/iam/docs/workload-identity-federation
  - https://cloud.google.com/iam/docs/audit-logging
  - https://github.com/panther-labs/panther-analysis/blob/develop/rules/gcp_audit_rules/gcp_workload_identity_pool_created_or_updated.yml
author: det-eng
date: 2026/10/12
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098.001
  - attack.t1199
logsource:
  product: gcp
  service: gcp.audit
detection:
  selection_provider_write:
    protoPayload.serviceName: 'iam.googleapis.com'
    protoPayload.methodName:
      - 'google.iam.v1.WorkloadIdentityPools.CreateWorkloadIdentityPoolProvider'
      - 'google.iam.v1.WorkloadIdentityPools.UpdateWorkloadIdentityPoolProvider'
    # Provider create/update is a long-running operation that emits TWO Admin Activity
    # entries. Only the begin entry (operation.first) carries the request body; keying
    # on it alone stops the rule double-firing and stops the end entry (no request body,
    # so no attributeCondition -> the "no condition" branch would wrongly fire) misfiring
    # on every benign provider.
    operation.first: true
  selection_request_trust:
    # Require the external-trust definition to be present in THIS entry (the request
    # body). This both anchors to the begin entry and ignores updates that touch only
    # unrelated fields.
    - protoPayload.request.workloadIdentityPoolProvider.oidc.issuerUri|contains: '://'
    - protoPayload.request.workloadIdentityPoolProvider.aws.accountId: '*'
    - protoPayload.request.workloadIdentityPoolProvider.saml.idpMetadataXml: '*'
  filter_has_attribute_condition:
    # Suppress when ANY non-empty attribute condition is present. A substring test
    # ('assertion') both misses a restrictive condition written with attribute.* /
    # google.* (false positive) and is satisfied by a tautological condition that
    # mentions 'assertion' (false negative). A non-empty test removes the former; the
    # latter is an inherent limit of not evaluating CEL (see falsepositives).
    protoPayload.request.workloadIdentityPoolProvider.attributeCondition|re: '.+'
  condition: selection_provider_write and selection_request_trust and not filter_has_attribute_condition
falsepositives:
  - Legitimate federation onboarding that intentionally uses a broad or no attribute
    condition (rare but valid). Confirm the issuerUri and that pool principals are only
    bound to appropriately-scoped service accounts.
  - Known limitation, a false negative -- the suppressor tests only that SOME attribute
    condition is present, not that it is actually restrictive. A tautological CEL guard
    (for example "assertion.sub != empty") is non-empty and so is suppressed. Catching a
    vacuous condition needs CEL evaluation in the pipeline, which a stateless Sigma rule
    cannot do.
level: medium
