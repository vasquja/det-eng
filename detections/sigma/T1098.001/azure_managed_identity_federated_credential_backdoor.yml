title: Azure Managed Identity Federated Identity Credential Added
id: c7b05313-ae74-4758-8abb-c0c49c360c0c
status: experimental
description: |
  Detects a federated identity credential (FIC) added to (or changed on) a
  user-assigned managed identity through Azure Resource Manager, recorded in the
  Azure Activity Log as the Administrative operation
  Microsoft.ManagedIdentity/userAssignedIdentities/federatedIdentityCredentials/write.
  The operationName is matched in any casing (the ARM form and the UPPERCASE export
  form), and only the record that completes the write (resultType Success or
  Failure) fires, not the Start record that ARM logs first.
  This is the TRR9013 companion rule for Procedure C: the managed-identity FIC path
  never appears in the Entra ID audit log (the application-FIC chokepoint rule is
  blind to it), so it needs this Activity-Log rule.

  It is the variant Stratus Red Team emulates
  (azure.persistence.backdoor-managed-identity-fic). A FIC on a managed identity lets
  an external OIDC workload obtain tokens as that identity. The Activity-Log record
  does not carry the issuer/subject, so this rule fires on any FIC write to a managed
  identity; triage by correlating with the actor (identity.claims) and reviewing the
  resulting credential's issuer out of band. Baseline the IaC/service principals that
  legitimately manage workload federation.
references:
  - https://attack.mitre.org/techniques/T1098/001/
  - https://learn.microsoft.com/azure/azure-monitor/platform/activity-log-schema
  - https://learn.microsoft.com/azure/azure-monitor/fundamentals/activity-log
  - https://github.com/elastic/integrations/blob/main/packages/azure/data_stream/activitylogs/_dev/test/pipeline/test-activitylogs-raw.log
  - https://github.com/DataDog/stratus-red-team/blob/main/v2/internal/attacktechniques/azure/persistence/backdoor-managed-identity-fic/main.go
  - https://learn.microsoft.com/entra/workload-id/workload-identity-federation
author: det-eng
date: 2026/10/12
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098.001
logsource:
  product: azure
  service: activitylogs
detection:
  # Case-insensitive: exported records do not keep one casing. The Event Hub and
  # storage export can carry the operationName UPPERCASE (Elastic's captured record:
  # 'MICROSOFT.EVENTHUB/NAMESPACES/AUTHORIZATIONRULES/LISTKEYS/ACTION'), and MS Learn
  # ('Activity log in Azure Monitor') warns that Activity Log values "might have
  # different case from otherwise equivalent values".
  # Category: MS Learn's mapping table says the exported category is "Always
  # Administrative", but its own Event Hub example record and Elastic's captured record
  # carry the operation type there ('Write' for a write, 'Action' for an action). A FIC
  # write is a write, so both values are accepted, in any casing.
  selection:
    category|re|i: '^(administrative|write)$'
    operationName|re|i: '^microsoft\.managedidentity/userassignedidentities/federatedidentitycredentials/write$'
  # ARM logs each write twice: a Start record when the request arrives and a
  # Success (or Failure) record when it completes. Count the completion only, so
  # one operation raises one alert. A Failure still fires: a refused FIC write is
  # an attempted backdoor.
  filter_start:
    resultType|re|i: '^start'
  condition: selection and not filter_start
falsepositives:
  - Legitimate workload-identity-federation setup on a managed identity by IaC
    (Terraform/Bicep), AKS workload identity onboarding, or platform teams; baseline
    the managing principals.
level: medium
