title: AWS IAM Role Trust Policy Grants Over-Broad GitHub Actions OIDC Access
id: 0269a7bb-c5f0-4279-a1c5-aec6998bac5a
status: experimental
description: |
  Detects an IAM role trust-policy write that trusts the GitHub Actions OIDC provider
  (token.actions.githubusercontent.com) for sts:AssumeRoleWithWebIdentity with an
  over-broad or absent subject (sub) condition -- so a fork, an unexpected branch, or
  any repository can assume the role from a GitHub Actions workflow outside the
  organisation. This is the TRR9015 chokepoint (Procedures A, B, C): the grant is the
  strongest signal because installing the backdoor is an unavoidable, default-logged
  management event, readable before any use.

  It keys on CloudTrail management events eventName iam:UpdateAssumeRolePolicy
  (edit) or iam:CreateRole (create). The trust policy is a URL-encoded JSON string in
  requestParameters.policyDocument (UpdateAssumeRolePolicy) or
  requestParameters.assumeRolePolicyDocument (CreateRole). The rule anchors on the
  issuer host, which is percent-encoding-invariant (letters and dots are not encoded),
  then flags over-broad trust: a wildcard ('%2A') in the sub value before any segment
  that pins one repository (repo:org/*, repo:*, *, or a customized template such as
  repository_owner_id:1234567:*; scoped by regex to the sub, so a wildcard on another
  claim does not trigger it), OR no GitHub-OIDC scoping claim at all (no sub,
  repository, environment, ...). A trust scoped by an exact sub, or by :repository /
  :environment, is suppressed. A wildcard only inside the ref of a pinned owner/repo
  (repo:org/app:ref:refs/tags/v*, repo:org/app:*) lets no fork or other repository
  assume the role; it is graded low by the sibling rule
  aws_github_oidc_role_trust_ref_wildcard.yml, not here.

  Implementation note: this is the substring/regex approximation the research
  recommends when a pipeline cannot decode the policy; it operates on the URL-encoded
  text and is NOT serialization-independent (added whitespace, or a key order it does
  not anticipate, can change the match; a list-valued sub is read per element). A production pipeline should
  URL-decode and JSON-parse the trust policy and judge the sub precisely. The aud pin
  is intentionally NOT tested here -- the absence of a literal `aud":"sts` substring is
  not evidence of an unpinned audience (aud is commonly a JSON array), so an aud test
  belongs only in a decode-and-parse pipeline. The regexes are portable (no lookaround):
  the per-segment test is split into the items below for a trust with one GitHub sub
  condition, and a trust with two or more sub conditions or a list of sub values is
  graded per sub value (sub_high_*): it is high when any one value has a wildcard that no
  repository pin precedes, so a pinned sub cannot hide an org-wide one, and a trust whose
  every wildcard follows a pinned repository is graded low by the sibling rule (exact on
  well-formed percent-encoding, which CloudTrail always writes).

  Blind spots (see the TRR): exploiting a PRE-EXISTING over-broad trust emits only the
  use event (sts:AssumeRoleWithWebIdentity) and no grant -- catchable only with a
  per-role sub allowlist; a sub pinned to a repo the attacker actually controls is not
  wildcard-shaped and is not flagged here; iam:CreateOpenIDConnectProvider is an
  informational precursor, not abuse on its own.
references:
  - https://attack.mitre.org/techniques/T1098/001/
  - https://docs.github.com/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services
  - https://docs.github.com/actions/reference/security/oidc
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_create_for-idp_oidc.html
  - https://github.com/DataDog/stratus-red-team/blob/main/v2/internal/attacktechniques/aws/persistence/iam-backdoor-role/main.go
author: det-eng
date: 2026/10/12
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098.001
  - attack.t1199
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_grant:
    eventName:
      - 'UpdateAssumeRolePolicy'
      - 'CreateRole'
  oidc_update:
    requestParameters.policyDocument|contains: 'token.actions.githubusercontent.com'
  oidc_create:
    requestParameters.assumeRolePolicyDocument|contains: 'token.actions.githubusercontent.com'
  # The trust policy is URL-encoded, so ':' is %3A, '"' is %22 and '*' is %2A, and the
  # sub value runs from 'githubusercontent.com:sub":"' to the next %22. A sub is graded
  # high when it has a wildcard before any segment that pins one repository. A pin is
  # 'repo:<value>:' or 'repository_id:<value>:' at a segment start (the value start or
  # after a ':'), with a value that has no '*'. So with the default template
  # 'repo:org/*', 'repo:*', 'repo:org/*:*' and '*' are high, and so are customized
  # subject-claim templates that pin no repository ('repository_owner_id:1234567:*',
  # 'repository_owner:org:*', a wildcard job_workflow_ref): any repository of the owner,
  # or any caller, can match those. A wildcard after a pinned repository
  # ('repo:org/app:ref:refs/tags/v*', 'repo:org/app:*', 'repo:org@1/app@2:*',
  # 'repository_owner_id:1:repository_id:9:*') is not: no fork or other repository can
  # match it. That case is the low-level sibling rule
  # aws_github_oidc_role_trust_ref_wildcard.yml. Template formats: GitHub Docs, 'OpenID
  # Connect reference' (example subject claims, immutable subject claims, customizing the
  # subject claims). A wildcard on a claim other than sub is not a broad sub.
  #
  # Portable regex only (no lookaround). Each regex reads percent-encoded text a token at a
  # time ('[^%]' or '%' and two characters), so '%22' (end of the sub value), '%2A' and
  # '%3A' are never split. A trust with ONE string sub value is graded by the items
  # sub_any_wildcard, sub_wildcard and sub_pinned, combined in the condition. A trust with
  # two or more sub conditions, or a list of sub values (sub_multi_*), is graded per sub
  # value by sub_high_*: high when ANY one value has a wildcard that no repository pin
  # precedes, so a pinned sub cannot hide an org-wide one, and a trust whose every
  # wildcard follows a pinned repository is the low sibling rule's case (C16). On one sub
  # value the two tests give the same grade.
  #
  # A wildcard anywhere in a sub value.
  sub_any_wildcard_update:
    requestParameters.policyDocument|re: 'githubusercontent\.com%3Asub%22%3A%22([^%]|%([^2%]|2[^2%]))*%2A'
  sub_any_wildcard_create:
    requestParameters.assumeRolePolicyDocument|re: 'githubusercontent\.com%3Asub%22%3A%22([^%]|%([^2%]|2[^2%]))*%2A'
  # A wildcard in the owner/repo part of the default template: in the first segment
  # ('*', 'org/*') or right after 'repo:' ('repo:org/*', 'repo:*'), before any ':'.
  sub_wildcard_update:
    requestParameters.policyDocument|re: 'githubusercontent\.com%3Asub%22%3A%22(repo%3A)?([^%]|%([^23%]|2[^2%]|3[^A%]))*%2A'
  sub_wildcard_create:
    requestParameters.assumeRolePolicyDocument|re: 'githubusercontent\.com%3Asub%22%3A%22(repo%3A)?([^%]|%([^23%]|2[^2%]|3[^A%]))*%2A'
  # A repository pin ('repo:<value>:' or 'repository_id:<value>:' at a segment start)
  # before the first wildcard of a sub value.
  sub_pinned_update:
    requestParameters.policyDocument|re: 'githubusercontent\.com%3Asub%22%3A%22(([^%]|%([^2%]|2[^2A%]))*%3A)?repo(sitory_id)?%3A([^%]|%([^23%]|2[^2A%]|3[^A%]))+%3A'
  sub_pinned_create:
    requestParameters.assumeRolePolicyDocument|re: 'githubusercontent\.com%3Asub%22%3A%22(([^%]|%([^2%]|2[^2A%]))*%3A)?repo(sitory_id)?%3A([^%]|%([^23%]|2[^2A%]|3[^A%]))+%3A'
  # Two or more GitHub sub conditions in one policy, or a sub condition whose value is a
  # list (IAM policy grammar: a condition value is a string or a list of strings).
  sub_multi_update:
    requestParameters.policyDocument|re:
      - 'githubusercontent\.com%3Asub%22.*githubusercontent\.com%3Asub%22'
      - 'githubusercontent\.com%3Asub%22%3A%5B'
  sub_multi_create:
    requestParameters.assumeRolePolicyDocument|re:
      - 'githubusercontent\.com%3Asub%22.*githubusercontent\.com%3Asub%22'
      - 'githubusercontent\.com%3Asub%22%3A%5B'
  # Per sub value (a string value, or each element of a list value): a wildcard that no
  # repository pin precedes. The value is read segment by segment (':' is %3A): a segment
  # that is not 'repo' or 'repository_id' may be followed by any segment; 'repo' or
  # 'repository_id' must be followed by an empty segment (a non-empty one is a pin), or by
  # the '*' that ends the match. 'repo' and 'repository_id' are matched exactly: a longer
  # segment ('repository_owner_id', 'repos') is not a pin key.
  sub_high_update:
    requestParameters.policyDocument|re: 'githubusercontent\.com%3Asub%22%3A(%5B(%22([^%]|%([^2%]|2[^2%]))*%22%2C)*)?%22((([^r%]|%([^23%]|2[^2A%]|3[^A%])|r([^e%]|e([^p%]|p([^o%]|o([^s%]|s([^i%]|i([^t%]|t([^o%]|o([^r%]|r([^y%]|y([^_%]|_([^i%]|i(d([^%]|%([^23%]|2[^2A%]|3[^A%]))|[^d%])))))))))))))([^%]|%([^23%]|2[^2A%]|3[^A%]))*|(r(e(p(os(i(t(o(r(y(_(i)?)?)?)?)?)?)?)?)?)?)?)%3A|repo(sitory_id)?%3A%3A)*(repo(sitory_id)?%3A)?([^%]|%([^23%]|2[^2A%]|3[^A%]))*%2A'
  sub_high_create:
    requestParameters.assumeRolePolicyDocument|re: 'githubusercontent\.com%3Asub%22%3A(%5B(%22([^%]|%([^2%]|2[^2%]))*%22%2C)*)?%22((([^r%]|%([^23%]|2[^2A%]|3[^A%])|r([^e%]|e([^p%]|p([^o%]|o([^s%]|s([^i%]|i([^t%]|t([^o%]|o([^r%]|r([^y%]|y([^_%]|_([^i%]|i(d([^%]|%([^23%]|2[^2A%]|3[^A%]))|[^d%])))))))))))))([^%]|%([^23%]|2[^2A%]|3[^A%]))*|(r(e(p(os(i(t(o(r(y(_(i)?)?)?)?)?)?)?)?)?)?)?)%3A|repo(sitory_id)?%3A%3A)*(repo(sitory_id)?%3A)?([^%]|%([^23%]|2[^2A%]|3[^A%]))*%2A'
  # ANY GitHub-OIDC scoping claim present (sub, repository, environment, ...), so a
  # trust scoped by :repository or :environment without a :sub is NOT "worldwide".
  scoping_claim_update:
    requestParameters.policyDocument|re: 'githubusercontent\.com%3A(sub|repository|repository_owner|repository_id|environment|actor|ref|workflow_ref|job_workflow_ref)%22'
  scoping_claim_create:
    requestParameters.assumeRolePolicyDocument|re: 'githubusercontent\.com%3A(sub|repository|repository_owner|repository_id|environment|actor|ref|workflow_ref|job_workflow_ref)%22'
  # Null-safe negations: a backend with three-valued logic (ES|QL and other SQL
  # backends) reads NOT of a test on a missing field as NULL and drops the record. An
  # UpdateAssumeRolePolicy record has policyDocument and no assumeRolePolicyDocument,
  # and a CreateRole record has the reverse. So the condition applies each `not` to one
  # block (De Morgan's laws), and ORs it with a test that the block's field is absent.
  sel_no_policy_document:
    requestParameters.policyDocument: null
  sel_no_assume_role_policy_document:
    requestParameters.assumeRolePolicyDocument: null
  # The condition is, in two-valued logic:
  #   selection_grant and (oidc_update or oidc_create) and
  #   ((sub_any_wildcard and not sub_multi and not (sub_pinned and not sub_wildcard))
  #    or (sub_multi and sub_high) or not scoping_claim)
  # where each name X stands for (X_update or X_create).
  condition: >
    selection_grant and (oidc_update or oidc_create) and
    (((sub_any_wildcard_update or sub_any_wildcard_create) and
      (sel_no_policy_document or not sub_multi_update) and
      (sel_no_assume_role_policy_document or not sub_multi_create) and
      (((sel_no_policy_document or not sub_pinned_update) and
        (sel_no_assume_role_policy_document or not sub_pinned_create))
       or sub_wildcard_update or sub_wildcard_create))
     or ((sub_multi_update or sub_multi_create) and (sub_high_update or sub_high_create))
     or ((sel_no_policy_document or not scoping_claim_update) and
         (sel_no_assume_role_policy_document or not scoping_claim_create)))
falsepositives:
  - Orgs that deliberately use an org-wide StringLike repo:org/* for shared or
    self-hosted runners or monorepos -- a policy-hygiene finding to review, not
    necessarily compromise.
  - A legitimately scoped multi-pattern StringLike list can look wildcard-shaped over
    the encoded string; decode-then-parse to confirm before alerting.
  - A customized subject-claim template is graded by whether a 'repo:' or
    'repository_id:' segment with a fixed value comes before the wildcard. A template
    that pins the repository through another claim (a repo_property_* custom property,
    for example) and then uses a wildcard is graded high.
  - A '?' (the StringLike single-character wildcard) is not graded as a wildcard; only '*'
    is.
level: high
