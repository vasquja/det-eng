title: AWS IAM Role Trust Policy Grants Over-Broad GitHub Actions OIDC Access
id: 0269a7bb-c5f0-4279-a1c5-aec6998bac5a
status: experimental
description: |
  Detects an IAM role trust-policy write that trusts the GitHub Actions OIDC provider
  (token.actions.githubusercontent.com) for sts:AssumeRoleWithWebIdentity with an
  over-broad or absent subject (sub) condition -- so a fork, an unexpected branch, or
  any repository can assume the role from a GitHub Actions workflow outside the
  organisation. This is the TRR9015 chokepoint (Procedures A, B, C): the grant is the
  strongest signal because installing the backdoor is an unavoidable, default-logged
  management event, readable before any use.

  It keys on CloudTrail management events eventName iam:UpdateAssumeRolePolicy
  (edit) or iam:CreateRole (create). The trust policy is a URL-encoded JSON string in
  requestParameters.policyDocument (UpdateAssumeRolePolicy) or
  requestParameters.assumeRolePolicyDocument (CreateRole). The rule anchors on the
  issuer host, which is percent-encoding-invariant (letters and dots are not encoded),
  then flags over-broad trust: a wildcard ('%2A') WITHIN the sub value (scoped by regex
  to the sub, so a wildcard on another claim does not trigger it), OR no GitHub-OIDC
  scoping claim at all (no sub, repository, environment, ...). A trust scoped by an
  exact sub, or by :repository / :environment, is suppressed.

  Implementation note: this is the substring/regex approximation the research
  recommends when a pipeline cannot decode the policy; it operates on the URL-encoded
  text and is NOT serialization-independent (a JSON array, added whitespace, or a key
  order it does not anticipate can change the match). A production pipeline should
  URL-decode and JSON-parse the trust policy and judge the sub precisely. The aud pin
  is intentionally NOT tested here -- the absence of a literal `aud":"sts` substring is
  not evidence of an unpinned audience (aud is commonly a JSON array), so an aud test
  belongs only in a decode-and-parse pipeline.

  Blind spots (see the TRR): exploiting a PRE-EXISTING over-broad trust emits only the
  use event (sts:AssumeRoleWithWebIdentity) and no grant -- catchable only with a
  per-role sub allowlist; a sub pinned to a repo the attacker actually controls is not
  wildcard-shaped and is not flagged here; iam:CreateOpenIDConnectProvider is an
  informational precursor, not abuse on its own.
references:
  - https://attack.mitre.org/techniques/T1098/001/
  - https://docs.github.com/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_create_for-idp_oidc.html
  - https://github.com/DataDog/stratus-red-team/blob/main/v2/internal/attacktechniques/aws/persistence/iam-backdoor-role/main.go
author: det-eng
date: 2026/10/12
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098.001
  - attack.t1199
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_grant:
    eventName:
      - 'UpdateAssumeRolePolicy'
      - 'CreateRole'
  oidc_update:
    requestParameters.policyDocument|contains: 'token.actions.githubusercontent.com'
  oidc_create:
    requestParameters.assumeRolePolicyDocument|contains: 'token.actions.githubusercontent.com'
  # Wildcard '*' (encoded %2A) INSIDE the sub value only -- not anywhere else in the
  # policy (a wildcard on job_workflow_ref etc. is not a broad sub).
  sub_wildcard_update:
    requestParameters.policyDocument|re: 'githubusercontent\.com%3Asub%22%3A%22(?:(?!%22).)*?%2A'
  sub_wildcard_create:
    requestParameters.assumeRolePolicyDocument|re: 'githubusercontent\.com%3Asub%22%3A%22(?:(?!%22).)*?%2A'
  # ANY GitHub-OIDC scoping claim present (sub, repository, environment, ...), so a
  # trust scoped by :repository or :environment without a :sub is NOT "worldwide".
  scoping_claim_update:
    requestParameters.policyDocument|re: 'githubusercontent\.com%3A(?:sub|repository|repository_owner|repository_id|environment|actor|ref|workflow_ref|job_workflow_ref)%22'
  scoping_claim_create:
    requestParameters.assumeRolePolicyDocument|re: 'githubusercontent\.com%3A(?:sub|repository|repository_owner|repository_id|environment|actor|ref|workflow_ref|job_workflow_ref)%22'
  condition: >
    selection_grant and (oidc_update or oidc_create) and
    (sub_wildcard_update or sub_wildcard_create
     or not (scoping_claim_update or scoping_claim_create))
falsepositives:
  - Orgs that deliberately use an org-wide StringLike repo:org/* for shared or
    self-hosted runners or monorepos -- a policy-hygiene finding to review, not
    necessarily compromise.
  - A legitimately scoped multi-pattern StringLike list can look wildcard-shaped over
    the encoded string; decode-then-parse to confirm before alerting.
level: high
