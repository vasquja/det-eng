title: Entra Application Federated Identity Credential From Unapproved Issuer
id: f1b5715e-2af2-4d3c-bade-6da66fef45aa
status: experimental
description: |
  Detects a federated identity credential (FIC) added to or repointed on a Microsoft
  Entra application (or service principal) that trusts an OIDC issuer outside the
  organisation's approved set -- a passwordless backdoor that lets an external
  workload (e.g. an attacker-controlled CI issuer) obtain tokens as the app, and
  survives secret rotation. This is the TRR9013 chokepoint (Procedures A and B).

  The structural invariant is one Entra audit event: properties.category
  ApplicationManagement, properties.loggedByService Core Directory, result success,
  and at least one targetResources[].modifiedProperties[] with displayName
  FederatedIdentityCredentials (adding a client secret or certificate instead is a
  different activity -- "Update application - Certificates and secrets management" --
  so this cleanly isolates the FIC variant). That structural event fires on benign
  CI onboarding too, so the discriminator is semantic: the FIC's Issuer (inside the
  JSON-encoded modifiedProperties.newValue) is not on the approved-issuer allowlist.

  Implementation note: this rule targets a normalised event model where
  properties.targetResources is searchable as text (the modifiedProperties.newValue
  is a JSON-encoded string with PascalCase keys Id/Name/Audiences/Issuer/Subject). It
  fires when an FIC Issuer value whose host is NOT on the approved-issuer allowlist
  appears in the newValue of the modifiedProperties element whose displayName is
  FederatedIdentityCredentials (so that element is required by the issuer test itself,
  whatever the order of its displayName, oldValue and newValue keys) -- a regex over the
  (quote-escaped) `Issuer: "https://<host>` token that matches any host other than the
  approved one. The regex uses no lookahead (it must run on RE2 and
  Lucene backends too): it spells out the complement of the approved host one character
  at a time, so `token.actions.githubusercontent.com` followed by '\', '"', '/', ':' or a
  blank is the approved issuer, and any other character at any position
  (`token.actions.githubusercontent.com.attacker.example.com`, `...com@host`,
  `toke.n...`) is not. This is deliberately "an unapproved issuer is present after the
  change", not "no approved issuer is present anywhere": the latter fails open on any app
  that already holds a legitimate FIC. Because only newValue is read, removing or
  repointing away from an unapproved issuer (it is then only in oldValue) does not fire;
  any update of an application whose credentials still include an unapproved issuer
  after the change fires, because newValue holds the whole credential array. A
  production pipeline should JSON-decode newValue, check each issuer, and also alert on
  a wildcarded/over-broad Subject. To approve another host, rebuild the regex below from
  that host the same way (see the comment above it).

  Blind spots (see the TRR): a FIC on a user-assigned MANAGED IDENTITY is an Azure
  Activity Log event, not an Entra audit event, and is covered by the companion rule
  azure_managed_identity_federated_credential_backdoor.yml; USE of the backdoor
  (token exchange) appears only in service-principal sign-in logs.
references:
  - https://attack.mitre.org/techniques/T1098/001/
  - https://learn.microsoft.com/graph/api/resources/federatedidentitycredential?view=graph-rest-1.0
  - https://learn.microsoft.com/entra/workload-id/workload-identity-federation-create-trust
  - https://github.com/elastic/detection-rules/blob/main/rules/integrations/azure/persistence_entra_id_federated_identity_credential_modified.toml
author: det-eng
date: 2026/10/12
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098.001
logsource:
  product: azure
  service: auditlogs
detection:
  selection_fic_write:
    properties.category: 'ApplicationManagement'
    properties.loggedByService: 'Core Directory'
    properties.result: 'success'
  selection_unapproved_issuer:
    # An FIC Issuer, in the NEW value of the FederatedIdentityCredentials modified
    # property, whose host is not the approved one, token.actions.githubusercontent.com.
    # The first two values find the modifiedProperties element whose displayName is
    # FederatedIdentityCredentials, skip its other string keys (oldValue, in the order
    # Microsoft documents: displayName, oldValue, newValue; or none, in sorted order:
    # displayName, newValue, oldValue), then read inside that element's newValue string
    # only (whole escapes, never past its closing quote). The third value covers the
    # orders where displayName comes AFTER newValue (oldValue, newValue, displayName;
    # newValue, displayName, oldValue; newValue, oldValue, displayName): it starts at a
    # newValue key (after '{' or ',', so not inside a string), reads that string only,
    # finds the issuer, reads on to the string's closing quote, skips the element's other
    # string or null keys and requires displayName FederatedIdentityCredentials in the
    # same element (C13). So an issuer that is only in oldValue (a credential removed or
    # repointed away, C13) does not fire in any key order, and neither does an
    # Issuer-like text in another property. Graph modifiedProperty: oldValue is "the
    # previous value (before the update)", newValue "the updated value"; the
    # FederatedIdentityCredentials values are JSON-encoded credential arrays.
    # Portable regex (no lookaround): after 'https://', each position either holds a
    # character other than the approved host's next one ('[^t]', then '[^o]' after 't',
    # ...), or the same character and the test goes on; after the whole approved host,
    # one more character that does not end a host ('\', '"', '/', ':', blank) means a
    # longer, different host. In the third value each position also takes a whole escape
    # ('\\.') and never half of one ('[^t\\]'), so the read stays aligned on JSON escapes
    # up to the closing quote. To approve another host, build the same nested pattern
    # from it. The second value catches an issuer cut off inside the approved host at the
    # end of the text. The character class tolerates the JSON-escaped quotes flatten()
    # produces. Each value stays inside Lucene's default determinization budget.
    properties.targetResources|re:
      - '\"displayName\"\s*:\s*\"FederatedIdentityCredentials\"\s*,\s*(\"([^\"\\]|\\.)*\"\s*:\s*(\"([^\"\\]|\\.)*\"|null)\s*,\s*)*\"newValue\"\s*:\s*\"([^\"\\]|\\.)*Issuer[\\":\s]+https://([^t]|t([^o]|o([^k]|k([^e]|e([^n]|n([^.]|\.([^a]|a([^c]|c([^t]|t([^i]|i([^o]|o([^n]|n([^s]|s([^.]|\.([^g]|g([^i]|i([^t]|t([^h]|h([^u]|u([^b]|b([^u]|u([^s]|s([^e]|e([^r]|r([^c]|c([^o]|o([^n]|n([^t]|t([^e]|e([^n]|n([^t]|t([^.]|\.([^c]|c([^o]|o([^m]|m[^\\"/:\s])))))))))))))))))))))))))))))))))))'
      - '\"displayName\"\s*:\s*\"FederatedIdentityCredentials\"\s*,\s*(\"([^\"\\]|\\.)*\"\s*:\s*(\"([^\"\\]|\\.)*\"|null)\s*,\s*)*\"newValue\"\s*:\s*\"([^\"\\]|\\.)*Issuer[\\":\s]+https://(t(o(k(e(n(\.(a(c(t(i(o(n(s(\.(g(i(t(h(u(b(u(s(e(r(c(o(n(t(e(n(t(\.(c(o)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?)?$'
      - '[{,]\s*\"newValue\"\s*:\s*\"([^\"\\]|\\.)*Issuer[\\":\s]+https://([^t\\]|\\.|t([^o\\]|\\.|o([^k\\]|\\.|k([^e\\]|\\.|e([^n\\]|\\.|n([^.\\]|\\.|\.([^a\\]|\\.|a([^c\\]|\\.|c([^t\\]|\\.|t([^i\\]|\\.|i([^o\\]|\\.|o([^n\\]|\\.|n([^s\\]|\\.|s([^.\\]|\\.|\.([^g\\]|\\.|g([^i\\]|\\.|i([^t\\]|\\.|t([^h\\]|\\.|h([^u\\]|\\.|u([^b\\]|\\.|b([^u\\]|\\.|u([^s\\]|\\.|s([^e\\]|\\.|e([^r\\]|\\.|r([^c\\]|\\.|c([^o\\]|\\.|o([^n\\]|\\.|n([^t\\]|\\.|t([^e\\]|\\.|e([^n\\]|\\.|n([^t\\]|\\.|t([^.\\]|\\.|\.([^c\\]|\\.|c([^o\\]|\\.|o([^m\\]|\\.|m[^\\"/:\s])))))))))))))))))))))))))))))))))))([^\"\\]|\\.)*\"\s*,\s*(\"([^\"\\]|\\.)*\"\s*:\s*(\"([^\"\\]|\\.)*\"|null)\s*,\s*)*\"displayName\"\s*:\s*\"FederatedIdentityCredentials\"'
  condition: selection_fic_write and selection_unapproved_issuer
falsepositives:
  - First-time workload-identity-federation onboarding with a new but approved issuer;
    add it to the allowlist.
  - IdP migrations (e.g. GitHub to GitLab) that change the issuer on an existing
    credential; confirm the change is sanctioned.
level: high
