title: AWS S3 Bucket ACL Grants Public Access
id: 9e63bc86-fb69-4771-8192-b6e90683333d
status: experimental
description: |
  Detects an S3 bucket ACL write that grants the public AllUsers group (anyone on the internet)
  or the AuthenticatedUsers group (any authenticated AWS principal, effectively public) read or
  write on a bucket. This is the ACL path to public S3 exposure -- distinct from a bucket POLICY
  grant (TRR9019) -- and realises TRR9019's documented-but-unbuilt Procedure D.

  It keys on the default-logged CloudTrail management event s3.amazonaws.com / PutBucketAcl in
  either of the two shapes AWS records: the canned-ACL header
  requestParameters.x-amz-acl = public-read / public-read-write, OR an explicit grant list
  requestParameters.AccessControlPolicy.AccessControlList.Grant naming a Grantee group URI
  http://acs.amazonaws.com/groups/global/AllUsers or .../AuthenticatedUsers. Grant is an array
  when the ACL has two or more grants and a single object when it has one (CloudTrail converts
  the request XML), so both forms are matched. It requires success
  (no errorCode) because, under S3 Object-Ownership "bucket owner enforced", ACLs are disabled and
  a PutBucketAcl fails with AccessControlListNotSupported -- a failed attempt changes nothing.
references:
  - https://attack.mitre.org/techniques/T1537/
  - https://docs.aws.amazon.com/AmazonS3/latest/userguide/cloudtrail-logging-understanding-s3-entries.html
  - https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketAcl.html
  - https://docs.aws.amazon.com/AmazonS3/latest/userguide/acl-overview.html
  - https://github.com/elastic/detection-rules/blob/main/rules/integrations/aws/collection_s3_bucket_acl_public_access_new_identity.toml
author: det-eng
date: 2026/10/13
tags:
  - attack.exfiltration
  - attack.t1537
  - attack.persistence
  - attack.t1098
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_acl_write:
    eventSource: 's3.amazonaws.com'
    eventName: 'PutBucketAcl'
  selection_public_grant:
    # Canned ACL header (public-read / public-read-write; authenticated-read grants the
    # AuthenticatedUsers group = any AWS account = effectively public).
    - requestParameters.x-amz-acl:
        - 'public-read'
        - 'public-read-write'
        - 'authenticated-read'
    # Explicit grant list (AccessControlPolicy) with two or more grants: CloudTrail logs
    # Grant as a JSON array, which flattens to one text field.
    - requestParameters.AccessControlPolicy.AccessControlList.Grant|contains:
        - 'http://acs.amazonaws.com/groups/global/AllUsers'
        - 'http://acs.amazonaws.com/groups/global/AuthenticatedUsers'
    # Explicit grant-header form (x-amz-grant-* carrying the public/authenticated group URI).
    - requestParameters.x-amz-grant-read|contains: ['global/AllUsers', 'global/AuthenticatedUsers']
    - requestParameters.x-amz-grant-write|contains: ['global/AllUsers', 'global/AuthenticatedUsers']
    - requestParameters.x-amz-grant-full-control|contains: ['global/AllUsers', 'global/AuthenticatedUsers']
    - requestParameters.x-amz-grant-read-acp|contains: ['global/AllUsers', 'global/AuthenticatedUsers']
    - requestParameters.x-amz-grant-write-acp|contains: ['global/AllUsers', 'global/AuthenticatedUsers']
    # Explicit grant list with a single grant: CloudTrail converts the request XML to
    # JSON, so one <Grant> element is logged as an object, not a one-element array (the
    # PutBucketAcl example in the S3 User Guide, 'CloudTrail log file entries for Amazon
    # S3'), and flattens to ...Grant.Grantee.URI.
    - requestParameters.AccessControlPolicy.AccessControlList.Grant.Grantee.URI:
        - 'http://acs.amazonaws.com/groups/global/AllUsers'
        - 'http://acs.amazonaws.com/groups/global/AuthenticatedUsers'
  filter_failed:
    errorCode: '*'
  # Null-safe negation: a backend with three-valued logic (ES|QL and other SQL
  # backends) reads NOT of a test on a missing field as NULL and drops the record.
  # CloudTrail writes errorCode only when the call returns an error, so the filter is
  # ORed with a test that the field is absent.
  sel_no_error_code:
    errorCode: null
  condition: selection_acl_write and selection_public_grant and (sel_no_error_code or not filter_failed)
falsepositives:
  - Intentionally public static-website buckets and public datasets; allowlist by bucket name.
  - A grant to a specific CanonicalUser (a named account) or a private / bucket-owner-full-control
    canned ACL is not public and is excluded.
  - Buckets under Object-Ownership "bucket owner enforced" cannot receive a public ACL (the call
    fails), so the real-world blast radius is reduced to ACL-enabled / legacy buckets.
level: high
