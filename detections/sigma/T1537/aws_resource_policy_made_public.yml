title: AWS Resource-Based Policy Grants Public Access
id: f7805e3e-eb2a-4e83-b4ae-8317be891f1c
status: experimental
description: |
  Detects a resource-based policy write that grants access to the public principal
  ("*" / {"AWS":"*"}) with no scoping condition -- exposing an AWS resource to the whole
  internet. This is the TRR9019 Family-A chokepoint, unified across the services that
  carry a resource policy: S3 (PutBucketPolicy), ECR (SetRepositoryPolicy), KMS
  (PutKeyPolicy), Secrets Manager (PutResourcePolicy), SNS (SetTopicAttributes),
  SQS (SetQueueAttributes), and Lambda (AddPermission*, whose principal is a top-level
  field). All are default-logged management events.

  It fires when one statement of the policy document both Allows and names Principal
  "*" (string, {"AWS":"*"} or "*" in a list of AWS principals) AND that same statement
  carries no scoping condition key (aws:PrincipalOrgID / aws:PrincipalAccount /
  aws:SourceArn / aws:SourceAccount / aws:SourceOwner / aws:SourceVpc(e) /
  kms:CallerAccount) -- that condition is what separates a truly public wildcard from a
  safely-scoped one (the negative control). Scope is judged per statement, as S3 and EFS
  judge "public": every public Allow statement is tested on its own Condition, so a scoped
  statement (the SNS default AWS:SourceOwner statement, the EBS kms:CallerAccount
  statement) does not hide a second, unconditioned public Allow, and a policy whose public
  Allow statements are all scoped (an SQS queue subscribed to several SNS topics) is quiet.
  A Deny statement with Principal "*" (for example the enforce-TLS statement) next to an
  Allow for a named principal is not public. For Lambda, public = requestParameters.principal
  "*" with no sourceArn.

  Encoding note (see the TRR): S3 requestParameters.bucketPolicy is a nested JSON object,
  while the KMS/SQS/SNS/ECR/Secrets policies are JSON-encoded strings; this rule reads the
  S3 Statement list and the policy strings as JSON text (compact and spaced). The
  statement test is a portable regex (no lookaround) anchored at the start of the policy:
  it reads whole JSON tokens (strings with their escapes, nested objects two levels deep),
  skips N-1 statements and tests statement N, for N = 1 to 5; a public Allow at statement 6
  or later fires without a scope test. An S3 policy whose Statement is one object, not a
  list, flattens to Statement.Effect / Statement.Principal / Statement.Condition.<op>.<key>
  fields, which the rule reads too. The scope test checks that a scoping key is a key of an
  operator block of the statement's Condition, not its value or operator, so a production
  pipeline should still JSON-decode the policies and evaluate each condition. It does not
  cover object-level ACLs (an S3 data event) -- see the Block-Public-Access and
  bucket-ACL paths and the TRR gaps. Every value stays inside Lucene's default
  determinization budget (RULE_DEFECTS.md S1).
references:
  - https://attack.mitre.org/techniques/T1537/
  - https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-policy-language-overview.html
  - https://docs.aws.amazon.com/lambda/latest/api/API_AddPermission.html
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html
  - https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html#access-control-block-public-access-policy-status
  - https://docs.aws.amazon.com/securityhub/latest/userguide/s3-controls.html#s3-5
  - https://docs.aws.amazon.com/sns/latest/dg/sns-access-policy-use-cases.html
  - https://docs.aws.amazon.com/kms/latest/developerguide/conditions-kms.html#conditions-kms-caller-account
author: det-eng
date: 2026/10/12
tags:
  - attack.exfiltration
  - attack.t1537
  - attack.persistence
  - attack.t1098
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_policy_write:
    eventName:
      - 'PutBucketPolicy'
      - 'SetRepositoryPolicy'
      - 'PutKeyPolicy'
      - 'PutResourcePolicy'
      - 'SetTopicAttributes'
      - 'SetQueueAttributes'
  # Per-statement test, in portable regex (no lookaround). Each value is anchored at the
  # start of the policy text ('^'): the S3 bucketPolicy.Statement list, or the JSON-string
  # policy of the other services, read past its top-level keys to "Statement". The value
  # then skips N-1 whole statements and tests statement N. A statement is read as JSON
  # tokens: a whole string ("..." with its escapes), a character that is not a brace or a
  # quote, or a whole nested object (two levels: Principal, Condition and its operator
  # blocks), so a brace or a key name inside a string value is never read as structure.
  # public_principal[_N]: statement N Allows the public principal ("*", {"AWS":"*"} or "*"
  # in a list of AWS principals), keys in any order. filter_scoped[_N]: statement N has a
  # scoping condition key as a key of an operator block of its own Condition. The
  # condition pairs them per statement, so every public Allow statement is tested on its
  # own scope (C15). Statements 1 to 5 are tested one by one; a public Allow statement at
  # position 6 or later fires without the scope test (public_principal_beyond), a false
  # positive on purpose. '\[?' reads a Statement that is one object, not a list (C14).
  # Keys of the scope test: aws:PrincipalOrgID, aws:PrincipalAccount, aws:SourceArn,
  # aws:SourceAccount, aws:SourceOwner (the SNS default topic policy writes
  # 'AWS:SourceOwner'), aws:SourceVpc and aws:SourceVpce, and kms:CallerAccount (the EBS
  # default-encryption key policy); every letter matches in either case (condition keys
  # are case-insensitive). 'kms:ViaService' alone is not here: it limits the path, not the
  # account. The key's value and operator are not checked.
  public_principal:
    - requestParameters.bucketPolicy.Statement|re: &public_allow_statement_1
        - '^(\[|\s*\{([^{}\"]|\"([^\"\\]|\\.)*\")*\"Statement\"\s*:\s*\[?)\s*\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\})*\})*(\"Effect\"\s*:\s*\"Allow\"([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\})*\})*\"Principal\"\s*:\s*(\"\*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\"AWS\"\s*:\s*(\"\*\"|\[\s*(\"([^\"\\]|\\.)*\"\s*,\s*)*\"\*\")([^{}\"]|\"([^\"\\]|\\.)*\")*\})|\"Principal\"\s*:\s*(\"\*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\"AWS\"\s*:\s*(\"\*\"|\[\s*(\"([^\"\\]|\\.)*\"\s*,\s*)*\"\*\")([^{}\"]|\"([^\"\\]|\\.)*\")*\})([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\})*\})*\"Effect\"\s*:\s*\"Allow\")'
    - requestParameters.policy|re: *public_allow_statement_1
    - requestParameters.policyText|re: *public_allow_statement_1
    - requestParameters.resourcePolicy|re: *public_allow_statement_1
    - requestParameters.attributeValue|re: *public_allow_statement_1
    - requestParameters.attributes.Policy|re: *public_allow_statement_1
  public_principal_2:
    - requestParameters.bucketPolicy.Statement|re: &public_allow_statement_2
        - '^(\[|\s*\{([^{}\"]|\"([^\"\\]|\\.)*\")*\"Statement\"\s*:\s*\[?)\s*(\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\})*\})*\}\s*,\s*){1}\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\})*\})*(\"Effect\"\s*:\s*\"Allow\"([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\})*\})*\"Principal\"\s*:\s*(\"\*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\"AWS\"\s*:\s*(\"\*\"|\[\s*(\"([^\"\\]|\\.)*\"\s*,\s*)*\"\*\")([^{}\"]|\"([^\"\\]|\\.)*\")*\})|\"Principal\"\s*:\s*(\"\*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\"AWS\"\s*:\s*(\"\*\"|\[\s*(\"([^\"\\]|\\.)*\"\s*,\s*)*\"\*\")([^{}\"]|\"([^\"\\]|\\.)*\")*\})([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\})*\})*\"Effect\"\s*:\s*\"Allow\")'
    - requestParameters.policy|re: *public_allow_statement_2
    - requestParameters.policyText|re: *public_allow_statement_2
    - requestParameters.resourcePolicy|re: *public_allow_statement_2
    - requestParameters.attributeValue|re: *public_allow_statement_2
    - requestParameters.attributes.Policy|re: *public_allow_statement_2
  public_principal_3:
    - requestParameters.bucketPolicy.Statement|re: &public_allow_statement_3
        - '^(\[|\s*\{([^{}\"]|\"([^\"\\]|\\.)*\")*\"Statement\"\s*:\s*\[?)\s*(\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\})*\})*\}\s*,\s*){2}\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\})*\})*(\"Effect\"\s*:\s*\"Allow\"([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\})*\})*\"Principal\"\s*:\s*(\"\*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\"AWS\"\s*:\s*(\"\*\"|\[\s*(\"([^\"\\]|\\.)*\"\s*,\s*)*\"\*\")([^{}\"]|\"([^\"\\]|\\.)*\")*\})|\"Principal\"\s*:\s*(\"\*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\"AWS\"\s*:\s*(\"\*\"|\[\s*(\"([^\"\\]|\\.)*\"\s*,\s*)*\"\*\")([^{}\"]|\"([^\"\\]|\\.)*\")*\})([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\})*\})*\"Effect\"\s*:\s*\"Allow\")'
    - requestParameters.policy|re: *public_allow_statement_3
    - requestParameters.policyText|re: *public_allow_statement_3
    - requestParameters.resourcePolicy|re: *public_allow_statement_3
