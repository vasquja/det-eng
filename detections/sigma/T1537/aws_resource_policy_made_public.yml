title: AWS Resource-Based Policy Grants Public Access
id: f7805e3e-eb2a-4e83-b4ae-8317be891f1c
status: experimental
description: |
  Detects a resource-based policy write that grants access to the public principal
  ("*" / {"AWS":"*"}) with no scoping condition -- exposing an AWS resource to the whole
  internet. This is the TRR9019 Family-A chokepoint, unified across the services that
  carry a resource policy: S3 (PutBucketPolicy), ECR (SetRepositoryPolicy), KMS
  (PutKeyPolicy), Secrets Manager (PutResourcePolicy), SNS (SetTopicAttributes),
  SQS (SetQueueAttributes), and Lambda (AddPermission*, whose principal is a top-level
  field). All are default-logged management events.

  It fires when one statement of the policy document both Allows and names Principal
  "*" (string, {"AWS":"*"} or "*" in a list of AWS principals) AND that same statement
  carries no scoping condition key (aws:PrincipalOrgID / aws:PrincipalAccount /
  aws:SourceArn / aws:SourceAccount / aws:SourceOwner / aws:SourceVpce / aws:SourceVpc /
  kms:CallerAccount) -- that condition is what separates a truly public wildcard from a
  safely-scoped one (the negative control). Scope is judged per statement, as S3 and EFS
  judge "public": a scoped statement (the SNS default AWS:SourceOwner statement, the EBS
  kms:CallerAccount statement) does not hide a second, unconditioned public Allow in the
  same policy. A Deny statement with Principal "*" (for example the enforce-TLS
  statement) next to an Allow for a named principal is not public.
  For Lambda, public = requestParameters.principal "*" with no sourceArn.

  Encoding note (see the TRR): S3 requestParameters.bucketPolicy is a nested JSON object,
  while the KMS/SQS/SNS/ECR/Secrets policies are JSON-encoded strings; this rule matches
  the public-principal and the scoping-condition tokens as text across both
  representations (compact and spaced). The statement test is a bounded, portable regex
  (no lookahead; whole nested objects up to two levels below a statement, which covers
  Principal and Condition); it checks that a scoping key is present in the statement's
  Condition, not its value or operator, so a production pipeline should still JSON-decode
  the policies and evaluate each condition. A portable regex cannot test that EVERY
  public statement is scoped, so the scoping filter applies only to a policy with one
  public Allow statement: a policy with two or more public Allow statements fires even
  when each one is scoped (see falsepositives). It does not
  cover object-level ACLs (an S3 data event) -- see the Block-Public-Access and
  bucket-ACL paths and the TRR gaps.
references:
  - https://attack.mitre.org/techniques/T1537/
  - https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-policy-language-overview.html
  - https://docs.aws.amazon.com/lambda/latest/api/API_AddPermission.html
  - https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html
  - https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html#access-control-block-public-access-policy-status
  - https://docs.aws.amazon.com/securityhub/latest/userguide/s3-controls.html#s3-5
  - https://docs.aws.amazon.com/sns/latest/dg/sns-access-policy-use-cases.html
  - https://docs.aws.amazon.com/kms/latest/developerguide/conditions-kms.html#conditions-kms-caller-account
author: det-eng
date: 2026/10/12
tags:
  - attack.exfiltration
  - attack.t1537
  - attack.persistence
  - attack.t1098
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_policy_write:
    eventName:
      - 'PutBucketPolicy'
      - 'SetRepositoryPolicy'
      - 'PutKeyPolicy'
      - 'PutResourcePolicy'
      - 'SetTopicAttributes'
      - 'SetQueueAttributes'
  public_principal:
    # One statement that both Allows and names the public principal ("*" or
    # {"AWS": "*"}, also inside a list of AWS principals). Portable regex (no
    # lookahead): "Effect": "Allow" and the public "Principal", in either order, with
    # only whole nested objects between them (up to two levels: a Principal object, a
    # Condition block), so both sit in the same statement and the walk never crosses a
    # statement's closing brace. So a named-principal Allow next to a Deny with Principal
    # "*" (the DenyInsecureTransport statement that Security Hub S3.5 recommends on every
    # bucket) is not public. The '*' stays a LITERAL (a |contains '"AWS":"*"' would be a
    # Sigma wildcard that also matches named principals). Optional whitespace covers the
    # nested-object (S3 bucketPolicy) and the JSON-string (KMS/ECR/SNS/SQS/Secrets, compact
    # or spaced) encodings. The same values apply to each service's policy field (YAML
    # anchor and aliases).
    - requestParameters.bucketPolicy.Statement|re: &public_allow_statement
        - '\"Effect\"\s*:\s*\"Allow\"([^{}]|\{([^{}]|\{[^{}]*\})*\})*\"Principal\"\s*:\s*(\"\*\"|\{[^{}]*\"AWS\"\s*:\s*(\"\*\"|\[[^\]]*\"\*\"))'
        - '\"Principal\"\s*:\s*(\"\*\"|\{[^{}]*\"AWS\"\s*:\s*(\"\*\"|\[[^\]]*\"\*\")[^{}]*\})([^{}]|\{([^{}]|\{[^{}]*\})*\})*\"Effect\"\s*:\s*\"Allow\"'
    - requestParameters.policy|re: *public_allow_statement
    - requestParameters.policyText|re: *public_allow_statement
    - requestParameters.resourcePolicy|re: *public_allow_statement
    - requestParameters.attributeValue|re: *public_allow_statement
    - requestParameters.attributes.Policy|re: *public_allow_statement
  filter_scoped:
    # A public Allow statement (as above) that carries a scoping condition key IN THAT
    # SAME STATEMENT, inside an operator block of its Condition, in any order of Effect,
    # Principal and Condition (one value per order). S3 and EFS judge "public" per grant:
    # one unscoped public statement makes the whole policy public (S3 User Guide, 'Blocking
    # public access' > 'The meaning of "public"': "if you add a public statement to the
    # policy, RestrictPublicBuckets takes effect"). The condition therefore applies this
    # filter only when the policy holds ONE public Allow statement
    # (public_principal_second_statement is false): then that statement is the one this
    # filter found scoped. With two or more public Allow statements the rule fires even when
    # every one is scoped (a documented false positive; a portable regex cannot test
    # "every statement"), so an attacker who appends an unconditioned public Allow next to
    # the SNS default statement (AWS:SourceOwner) or the EBS key-policy statement
    # (kms:CallerAccount) is NOT filtered. Keys: aws:PrincipalOrgID, aws:PrincipalAccount,
    # aws:SourceArn, aws:SourceAccount, aws:SourceOwner (the SNS default topic policy writes
    # 'AWS:SourceOwner'; every letter is matched in either case), aws:SourceVpc (a prefix
    # of aws:SourceVpce, so it covers both) and kms:CallerAccount (the KMS key policy that
    # lets every principal of one account use a key through a service, the EBS
    # default-encryption pattern). 'kms:ViaService' alone is not here: it limits the path,
    # not the account. Text match only: a key's VALUE is not checked (a wildcard value, which
    # S3 still counts as public, is filtered), a key outside the Condition block (in a Sid,
    # say) does not scope the statement, and a key in a Deny statement does not scope an
    # Allow.
    - requestParameters.bucketPolicy.Statement|re: &scoped_public_allow_statement
        - '\"Effect\"\s*:\s*\"Allow\"([^{}]|\{([^{}]|\{[^{}]*\})*\})*\"Principal\"\s*:\s*(\"\*\"|\{[^{}]*\"AWS\"\s*:\s*(\"\*\"|\[[^\]]*\"\*\")[^{}]*\})([^{}]|\{([^{}]|\{[^{}]*\})*\})*\"Condition\"\s*:\s*\{([^{}]|\{[^{}]*\})*\{[^{}]*([Aa][Ww][Ss]:([Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll]([Oo][Rr][Gg][Ii][Dd]|[Aa][Cc][Cc][Oo][Uu][Nn][Tt])|[Ss][Oo][Uu][Rr][Cc][Ee]([Aa][Rr][Nn]|[Aa][Cc][Cc][Oo][Uu][Nn][Tt]|[Oo][Ww][Nn][Ee][Rr]|[Vv][Pp][Cc]))|[Kk][Mm][Ss]:[Cc][Aa][Ll][Ll][Ee][Rr][Aa][Cc][Cc][Oo][Uu][Nn][Tt])'
        - '\"Effect\"\s*:\s*\"Allow\"([^{}]|\{([^{}]|\{[^{}]*\})*\})*\"Condition\"\s*:\s*\{([^{}]|\{[^{}]*\})*\{[^{}]*([Aa][Ww][Ss]:([Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll]([Oo][Rr][Gg][Ii][Dd]|[Aa][Cc][Cc][Oo][Uu][Nn][Tt])|[Ss][Oo][Uu][Rr][Cc][Ee]([Aa][Rr][Nn]|[Aa][Cc][Cc][Oo][Uu][Nn][Tt]|[Oo][Ww][Nn][Ee][Rr]|[Vv][Pp][Cc]))|[Kk][Mm][Ss]:[Cc][Aa][Ll][Ll][Ee][Rr][Aa][Cc][Cc][Oo][Uu][Nn][Tt])[^{}]*\}([^{}]|\{[^{}]*\})*\}([^{}]|\{([^{}]|\{[^{}]*\})*\})*\"Principal\"\s*:\s*(\"\*\"|\{[^{}]*\"AWS\"\s*:\s*(\"\*\"|\[[^\]]*\"\*\"))'
        - '\"Principal\"\s*:\s*(\"\*\"|\{[^{}]*\"AWS\"\s*:\s*(\"\*\"|\[[^\]]*\"\*\")[^{}]*\})([^{}]|\{([^{}]|\{[^{}]*\})*\})*\"Effect\"\s*:\s*\"Allow\"([^{}]|\{([^{}]|\{[^{}]*\})*\})*\"Condition\"\s*:\s*\{([^{}]|\{[^{}]*\})*\{[^{}]*([Aa][Ww][Ss]:([Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll]([Oo][Rr][Gg][Ii][Dd]|[Aa][Cc][Cc][Oo][Uu][Nn][Tt])|[Ss][Oo][Uu][Rr][Cc][Ee]([Aa][Rr][Nn]|[Aa][Cc][Cc][Oo][Uu][Nn][Tt]|[Oo][Ww][Nn][Ee][Rr]|[Vv][Pp][Cc]))|[Kk][Mm][Ss]:[Cc][Aa][Ll][Ll][Ee][Rr][Aa][Cc][Cc][Oo][Uu][Nn][Tt])'
        - '\"Principal\"\s*:\s*(\"\*\"|\{[^{}]*\"AWS\"\s*:\s*(\"\*\"|\[[^\]]*\"\*\")[^{}]*\})([^{}]|\{([^{}]|\{[^{}]*\})*\})*\"Condition\"\s*:\s*\{([^{}]|\{[^{}]*\})*\{[^{}]*([Aa][Ww][Ss]:([Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll]([Oo][Rr][Gg][Ii][Dd]|[Aa][Cc][Cc][Oo][Uu][Nn][Tt])|[Ss][Oo][Uu][Rr][Cc][Ee]([Aa][Rr][Nn]|[Aa][Cc][Cc][Oo][Uu][Nn][Tt]|[Oo][Ww][Nn][Ee][Rr]|[Vv][Pp][Cc]))|[Kk][Mm][Ss]:[Cc][Aa][Ll][Ll][Ee][Rr][Aa][Cc][Cc][Oo][Uu][Nn][Tt])[^{}]*\}([^{}]|\{[^{}]*\})*\}([^{}]|\{([^{}]|\{[^{}]*\})*\})*\"Effect\"\s*:\s*\"Allow\"'
        - '\"Condition\"\s*:\s*\{([^{}]|\{[^{}]*\})*\{[^{}]*([Aa][Ww][Ss]:([Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll]([Oo][Rr][Gg][Ii][Dd]|[Aa][Cc][Cc][Oo][Uu][Nn][Tt])|[Ss][Oo][Uu][Rr][Cc][Ee]([Aa][Rr][Nn]|[Aa][Cc][Cc][Oo][Uu][Nn][Tt]|[Oo][Ww][Nn][Ee][Rr]|[Vv][Pp][Cc]))|[Kk][Mm][Ss]:[Cc][Aa][Ll][Ll][Ee][Rr][Aa][Cc][Cc][Oo][Uu][Nn][Tt])[^{}]*\}([^{}]|\{[^{}]*\})*\}([^{}]|\{([^{}]|\{[^{}]*\})*\})*\"Effect\"\s*:\s*\"Allow\"([^{}]|\{([^{}]|\{[^{}]*\})*\})*\"Principal\"\s*:\s*(\"\*\"|\{[^{}]*\"AWS\"\s*:\s*(\"\*\"|\[[^\]]*\"\*\"))'
        - '\"Condition\"\s*:\s*\{([^{}]|\{[^{}]*\})*\{[^{}]*([Aa][Ww][Ss]:([Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll]([Oo][Rr][Gg][Ii][Dd]|[Aa][Cc][Cc][Oo][Uu][Nn][Tt])|[Ss][Oo][Uu][Rr][Cc][Ee]([Aa][Rr][Nn]|[Aa][Cc][Cc][Oo][Uu][Nn][Tt]|[Oo][Ww][Nn][Ee][Rr]|[Vv][Pp][Cc]))|[Kk][Mm][Ss]:[Cc][Aa][Ll][Ll][Ee][Rr][Aa][Cc][Cc][Oo][Uu][Nn][Tt])[^{}]*\}([^{}]|\{[^{}]*\})*\}([^{}]|\{([^{}]|\{[^{}]*\})*\})*\"Principal\"\s*:\s*(\"\*\"|\{[^{}]*\"AWS\"\s*:\s*(\"\*\"|\[[^\]]*\"\*\")[^{}]*\})([^{}]|\{([^{}]|\{[^{}]*\})*\})*\"Effect\"\s*:\s*\"Allow\"'
    - requestParameters.policy|re: *scoped_public_allow_statement
    - requestParameters.policyText|re: *scoped_public_allow_statement
    - requestParameters.resourcePolicy|re: *scoped_public_allow_statement
    - requestParameters.attributeValue|re: *scoped_public_allow_statement
    - requestParameters.attributes.Policy|re: *scoped_public_allow_statement
  public_principal_second_statement:
    # Two public Allow statements (as in public_principal) in one policy.
    - requestParameters.bucketPolicy.Statement|re: &two_public_allow_statements
        - '\"Effect\"\s*:\s*\"Allow\"([^{}]|\{([^{}]|\{[^{}]*\})*\})*\"Principal\"\s*:\s*(\"\*\"|\{[^{}]*\"AWS\"\s*:\s*(\"\*\"|\[[^\]]*\"\*\"))[\s\S]*\"Effect\"\s*:\s*\"Allow\"([^{}]|\{([^{}]|\{[^{}]*\})*\})*\"Principal\"\s*:\s*(\"\*\"|\{[^{}]*\"AWS\"\s*:\s*(\"\*\"|\[[^\]]*\"\*\"))'
        - '\"Effect\"\s*:\s*\"Allow\"([^{}]|\{([^{}]|\{[^{}]*\})*\})*\"Principal\"\s*:\s*(\"\*\"|\{[^{}]*\"AWS\"\s*:\s*(\"\*\"|\[[^\]]*\"\*\"))[\s\S]*\"Principal\"\s*:\s*(\"\*\"|\{[^{}]*\"AWS\"\s*:\s*(\"\*\"|\[[^\]]*\"\*\")[^{}]*\})([^{}]|\{([^{}]|\{[^{}]*\})*\})*\"Effect\"\s*:\s*\"Allow\"'
        - '\"Principal\"\s*:\s*(\"\*\"|\{[^{}]*\"AWS\"\s*:\s*(\"\*\"|\[[^\]]*\"\*\")[^{}]*\})([^{}]|\{([^{}]|\{[^{}]*\})*\})*\"Effect\"\s*:\s*\"Allow\"[\s\S]*\"Effect\"\s*:\s*\"Allow\"([^{}]|\{([^{}]|\{[^{}]*\})*\})*\"Principal\"\s*:\s*(\"\*\"|\{[^{}]*\"AWS\"\s*:\s*(\"\*\"|\[[^\]]*\"\*\"))'
        - '\"Principal\"\s*:\s*(\"\*\"|\{[^{}]*\"AWS\"\s*:\s*(\"\*\"|\[[^\]]*\"\*\")[^{}]*\})([^{}]|\{([^{}]|\{[^{}]*\})*\})*\"Effect\"\s*:\s*\"Allow\"[\s\S]*\"Principal\"\s*:\s*(\"\*\"|\{[^{}]*\"AWS\"\s*:\s*(\"\*\"|\[[^\]]*\"\*\")[^{}]*\})([^{}]|\{([^{}]|\{[^{}]*\})*\})*\"Effect\"\s*:\s*\"Allow\"'
    - requestParameters.policy|re: *two_public_allow_statements
    - requestParameters.policyText|re: *two_public_allow_statements
    - requestParameters.resourcePolicy|re: *two_public_allow_statements
    - requestParameters.attributeValue|re: *two_public_allow_statements
    - requestParameters.attributes.Policy|re: *two_public_allow_statements
  selection_lambda:
    eventName|startswith: 'AddPermission'
    requestParameters.principal|re: '^\*$'
  filter_lambda_scoped:
    # A Lambda wildcard grant scoped by an org ID or a source ARN is not public.
    - requestParameters.sourceArn: '*'
    - requestParameters.principalOrgID: '*'
  filter_failed:
    # Denied / failed mutating calls carry an errorCode and did not change state.
    errorCode: '*'
  condition: ((selection_policy_write and public_principal and not (filter_scoped and not public_principal_second_statement)) or (selection_lambda and not filter_lambda_scoped)) and not filter_failed
falsepositives:
  - Intentionally public static-website buckets, public datasets, and public container
    images; allowlist by resource name.
  - A wildcard Principal scoped by aws:PrincipalOrgID / aws:PrincipalAccount /
    aws:SourceArn / aws:SourceAccount / aws:SourceOwner / kms:CallerAccount (the SNS
    default topic policy, the KMS key policy for EBS default encryption), or a grant to
    an AWS service principal, is not public and is excluded.
  - CloudFront OAC/OAI bucket policies (service principal cloudfront.amazonaws.com).
  - An Allow+Deny pair both naming "*" where the Deny negates the exposure (for example
    a public Allow with a Deny for every source outside a VPC) fires, because the scope
    key sits in the Deny, not in the Allow. S3 Block Public Access judges the grant the
    same way; clearing it needs evaluation of the Deny's condition.
  - A scoping key whose value is a wildcard (StringLike aws:SourceVpc "vpc-*"), which S3
    still counts as public, is filtered, because the rule checks that the key is present
    in the statement, not its value.
  - A policy with two or more public Allow statements fires even when every one is scoped
    (an SQS queue subscribed to two SNS topics, one aws:SourceArn statement each), because a
    portable regex cannot test "every statement". Decode the policy to clear it.
  - A scoping key named outside the statement's Condition block (in its Sid, say) does
    not scope the statement, so such a public Allow fires.
level: high
