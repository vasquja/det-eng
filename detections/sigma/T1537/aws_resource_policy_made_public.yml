  filter_scoped_5:
    - requestParameters.bucketPolicy.Statement|re: &scoped_statement_5
        - '^(\[|\s*\{([^{}\"]|\"([^\"\\]|\\.)*\")*\"Statement\"\s*:\s*\[?)\s*(\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\})*\})*\}\s*,\s*){4}\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\})*\})*\"Condition\"\s*:\s*\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\})*\{([^{}\"]|\"([^\"\\]|\\.)*\")*\"([Aa][Ww][Ss]\:([Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll][Oo][Rr][Gg][Ii][Dd]|[Pp][Rr][Ii][Nn][Cc][Ii][Pp][Aa][Ll][Aa][Cc][Cc][Oo][Uu][Nn][Tt]|[Ss][Oo][Uu][Rr][Cc][Ee][Aa][Rr][Nn]|[Ss][Oo][Uu][Rr][Cc][Ee][Aa][Cc][Cc][Oo][Uu][Nn][Tt]|[Ss][Oo][Uu][Rr][Cc][Ee][Oo][Ww][Nn][Ee][Rr]|[Ss][Oo][Uu][Rr][Cc][Ee][Vv][Pp][Cc][Ee]?)|[Kk][Mm][Ss]\:[Cc][Aa][Ll][Ll][Ee][Rr][Aa][Cc][Cc][Oo][Uu][Nn][Tt])\"\s*:'
    - requestParameters.policy|re: *scoped_statement_5
    - requestParameters.policyText|re: *scoped_statement_5
    - requestParameters.resourcePolicy|re: *scoped_statement_5
    - requestParameters.attributeValue|re: *scoped_statement_5
    - requestParameters.attributes.Policy|re: *scoped_statement_5

  # C14: an S3 bucket policy whose Statement is one object, not a list. CloudTrail logs
  # bucketPolicy as a nested object, so its fields flatten to Statement.Effect,
  # Statement.Principal(.AWS) and Statement.Condition.<operator>.<key>; the regex
  # values above never see them. (A JSON-string policy with one statement object is read
  # by the values above.)
  s3_single_statement_allow:
    requestParameters.bucketPolicy.Statement.Effect: 'Allow'
  s3_single_statement_public:
    - requestParameters.bucketPolicy.Statement.Principal|re: '^\*$'
    - requestParameters.bucketPolicy.Statement.Principal.AWS|re:
        - '^\*$'
        - '\"\*\"'
  # A field name holds the operator and the key, so the scope test of a single statement
  # object lists spellings: StringEquals with each S3 scope key, StringLike with the keys
  # whose values take a wildcard, and ArnLike / ArnEquals with aws:SourceArn, each key as
  # AWS writes it. Another spelling (an IfExists or ForAnyValue operator, a key in other
  # letter case) is not filtered, so such a policy fires (a false positive, not a miss).
  filter_s3_single_statement_scoped:
    - requestParameters.bucketPolicy.Statement.Condition.StringEquals.aws:PrincipalOrgID: '*'
    - requestParameters.bucketPolicy.Statement.Condition.StringEquals.aws:PrincipalAccount: '*'
    - requestParameters.bucketPolicy.Statement.Condition.StringEquals.aws:SourceAccount: '*'
    - requestParameters.bucketPolicy.Statement.Condition.StringEquals.aws:SourceArn: '*'
    - requestParameters.bucketPolicy.Statement.Condition.StringEquals.aws:SourceVpc: '*'
    - requestParameters.bucketPolicy.Statement.Condition.StringEquals.aws:SourceVpce: '*'
    - requestParameters.bucketPolicy.Statement.Condition.StringLike.aws:PrincipalOrgID: '*'
    - requestParameters.bucketPolicy.Statement.Condition.StringLike.aws:SourceArn: '*'
    - requestParameters.bucketPolicy.Statement.Condition.StringLike.aws:SourceVpc: '*'
    - requestParameters.bucketPolicy.Statement.Condition.StringLike.aws:SourceVpce: '*'
    - requestParameters.bucketPolicy.Statement.Condition.ArnLike.aws:SourceArn: '*'
    - requestParameters.bucketPolicy.Statement.Condition.ArnEquals.aws:SourceArn: '*'
  selection_lambda:
    eventName|startswith: 'AddPermission'
    requestParameters.principal|re: '^\*$'
  filter_lambda_scoped:
    # A Lambda wildcard grant scoped by an org ID or a source ARN is not public.
    - requestParameters.sourceArn: '*'
    - requestParameters.principalOrgID: '*'
  filter_failed:
    # Denied / failed mutating calls carry an errorCode and did not change state.
    errorCode: '*'
  condition: >
    ((selection_policy_write and
      ((public_principal and not filter_scoped) or
       (public_principal_2 and not filter_scoped_2) or
       (public_principal_3 and not filter_scoped_3) or
       (public_principal_4 and not filter_scoped_4) or
       (public_principal_5 and not filter_scoped_5) or
       public_principal_beyond or
       (s3_single_statement_allow and s3_single_statement_public and
        not filter_s3_single_statement_scoped)))
     or (selection_lambda and not filter_lambda_scoped)) and not filter_failed
falsepositives:
  - Intentionally public static-website buckets, public datasets, and public container
    images; allowlist by resource name.
  - A wildcard Principal scoped by aws:PrincipalOrgID / aws:PrincipalAccount /
    aws:SourceArn / aws:SourceAccount / aws:SourceOwner / kms:CallerAccount (the SNS
    default topic policy, the KMS key policy for EBS default encryption), or a grant to
    an AWS service principal, is not public and is excluded.
  - CloudFront OAC/OAI bucket policies (service principal cloudfront.amazonaws.com).
  - An Allow+Deny pair both naming "*" where the Deny negates the exposure (for example
    a public Allow with a Deny for every source outside a VPC) fires, because the scope
    key sits in the Deny, not in the Allow. S3 Block Public Access judges the grant the
    same way; clearing it needs evaluation of the Deny's condition.
  - A scoping key whose value is a wildcard (StringLike aws:SourceVpc "vpc-*"), which S3
    still counts as public, is filtered, because the rule checks that the key is present
    in the statement, not its value.
  - A policy with six or more statements whose public Allow statements at position 6 or
    later are all scoped fires, because statements 1 to 5 are tested one by one, and a public
    Allow after them fires without a scope test. Decode the policy to clear it.
  - An S3 bucket policy whose Statement is one object is filtered only for the listed
    operator/key spellings (StringEquals, StringLike, ArnLike, ArnEquals; keys as AWS
    writes them); another spelling of a scoped statement fires.
  - A scoping key named outside the statement's Condition block (in its Sid, or as a
    condition value) does not scope the statement, so such a public Allow fires.
  - The statement reader takes nested objects two levels below a statement (Principal,
    Condition and its operator blocks), which is all the policy grammar has; a policy it
    cannot read (deeper nesting) does not fire.
level: high
