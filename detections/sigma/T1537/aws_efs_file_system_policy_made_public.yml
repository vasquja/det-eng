title: AWS EFS File System Policy Grants Public Access
id: 7e96a19e-2f88-4307-b5f4-2da8718a096c
status: experimental
description: |
  Detects an EFS PutFileSystemPolicy that attaches a resource-based policy allowing the public
  principal ("*" / {"AWS":"*"}) with no scoping condition, exposing a network file system to
  anonymous mount/access. Public-principal detection for EFS is largely absent from open rule
  sets -- this is new ground vs TRR9019's resource-policy family.

  It keys on the default-logged CloudTrail management event
  elasticfilesystem.amazonaws.com / PutFileSystemPolicy, matching an Allow + Principal "*" token
  in requestParameters.policy and suppressing only when every statement that Allows the public
  principal carries a scoping condition key in that same statement (aws:PrincipalOrgID /
  aws:SourceArn / aws:SourceAccount / aws:SourceVpc / aws:SourceOwner, or
  elasticfilesystem:AccessedViaMountTarget set to true), as EFS itself judges "public". The
  policy arrives as a JSON string that this rule matches as text (the same approach TRR9019 took
  for mixed-encoding policy services); the statement walk checks that a key is present, not its
  value, so a production pipeline should still JSON-decode and evaluate each condition.
references:
  - https://attack.mitre.org/techniques/T1537/
  - https://docs.aws.amazon.com/efs/latest/ug/API_PutFileSystemPolicy.html
  - https://docs.aws.amazon.com/efs/latest/ug/access-control-block-public-access.html
author: det-eng
date: 2026/10/13
tags:
  - attack.exfiltration
  - attack.t1537
  - attack.persistence
  - attack.t1098
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_efs_policy:
    eventSource: 'elasticfilesystem.amazonaws.com'
    eventName: 'PutFileSystemPolicy'
  selection_allow:
    # Require an Allow statement, so a Deny-only policy (e.g. an enforce-in-transit-encryption
    # policy: Effect Deny + Principal "*" + aws:SecureTransport=false) does not fire.
    requestParameters.policy|re: '"Effect"\s*:\s*"Allow"'
  selection_public_principal:
    # Literal asterisk principal, string OR single-element array ["*"], matched with a regex so
    # the '*' is NOT a Sigma wildcard (a |contains '"AWS":"*"' would match any named principal).
    requestParameters.policy|re: '"(?:Principal|AWS)"\s*:\s*\[?\s*"\*"'
  filter_scoped:
    # Not public when every statement that Allows the public principal is scoped IN
    # THAT SAME STATEMENT, by one of the keys below or by the mount-target key (EFS User
    # Guide, 'Blocking public access' > 'The meaning of "public"': a policy is non-public
    # only if it grants access only to fixed values of those keys). The filter holds
    # when (1) no statement is an Allow + public principal that lacks every key and the
    # mount-target key set to true (the negative lookahead walks each statement,
    # stepping over nested objects up to two levels deep), and (2) one of the keys
    # occurs. So an unconditioned public Allow next to an org-scoped statement fires.
    # Text match: a key's value is not checked, and a key's name anywhere in the public
    # statement counts as scoping it.
    requestParameters.policy|re: '^(?![\s\S]*\{(?=(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*?"Effect"\s*:\s*"Allow")(?=(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*?"Principal"\s*:\s*(?:"\*"|\{[^{}]*"AWS"\s*:\s*(?:"\*"|\[[^\]]*"\*")))(?:(?:(?!(?i:aws:PrincipalOrgID|aws:SourceArn|aws:SourceAccount|aws:SourceVpc|aws:SourceOwner|elasticfilesystem:AccessedViaMountTarget"\s*:\s*"?true))[^{}])|\{(?:(?:(?!(?i:aws:PrincipalOrgID|aws:SourceArn|aws:SourceAccount|aws:SourceVpc|aws:SourceOwner|elasticfilesystem:AccessedViaMountTarget"\s*:\s*"?true))[^{}])|\{(?:(?!(?i:aws:PrincipalOrgID|aws:SourceArn|aws:SourceAccount|aws:SourceVpc|aws:SourceOwner|elasticfilesystem:AccessedViaMountTarget"\s*:\s*"?true))[^{}])*\})*\})*\})[\s\S]*?(?i:aws:PrincipalOrgID|aws:SourceArn|aws:SourceAccount|aws:SourceVpc|aws:SourceOwner)'
  filter_mount_target:
    # The EFS console's policy wizard scopes its public Allow with Bool
    # elasticfilesystem:AccessedViaMountTarget = true, so only clients that reach a mount
    # target in the file system's VPC get in. The EFS User Guide ('The meaning of
    # "public"') lists that key among the conditions that make a file system policy
    # non-public, and shows the wizard policy with it set to true as non-public. Same
    # per-statement test as filter_scoped: the filter holds only when (1) no statement
    # is an Allow + public principal without the key set to true (or a filter_scoped
    # key), and (2) one public Allow carries the key set to true in an operator block
    # of its Condition. So the key in a Deny statement, or in one Allow next to a
    # second, unconditioned public Allow, does not suppress, and the value false is not
    # filtered. Condition keys are case-insensitive, so the match is too.
    requestParameters.policy|re: '^(?![\s\S]*\{(?=(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*?"Effect"\s*:\s*"Allow")(?=(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*?"Principal"\s*:\s*(?:"\*"|\{[^{}]*"AWS"\s*:\s*(?:"\*"|\[[^\]]*"\*")))(?:(?:(?!(?i:aws:PrincipalOrgID|aws:SourceArn|aws:SourceAccount|aws:SourceVpc|aws:SourceOwner|elasticfilesystem:AccessedViaMountTarget"\s*:\s*"?true))[^{}])|\{(?:(?:(?!(?i:aws:PrincipalOrgID|aws:SourceArn|aws:SourceAccount|aws:SourceVpc|aws:SourceOwner|elasticfilesystem:AccessedViaMountTarget"\s*:\s*"?true))[^{}])|\{(?:(?!(?i:aws:PrincipalOrgID|aws:SourceArn|aws:SourceAccount|aws:SourceVpc|aws:SourceOwner|elasticfilesystem:AccessedViaMountTarget"\s*:\s*"?true))[^{}])*\})*\})*\})[\s\S]*?(?i:\{(?=(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*?"Effect"\s*:\s*"Allow")(?=(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*?"Principal"\s*:\s*(?:"\*"|\{[^{}]*"AWS"\s*:\s*(?:"\*"|\[[^\]]*"\*")))(?=(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*?"Condition"\s*:\s*\{(?:[^{}]|\{[^{}]*\})*?\{[^{}]*"elasticfilesystem:AccessedViaMountTarget"\s*:\s*"?true))'
  filter_failed:
    errorCode: '*'
  condition: selection_efs_policy and selection_allow and selection_public_principal and not filter_scoped and not filter_mount_target and not filter_failed
falsepositives:
  - A file-system policy granting a named account scoped by aws:PrincipalOrgID / aws:SourceArn is
    not public and is excluded. So is the EFS console wizard's policy, which grants the AWS
    principal '*' only through a mount target (elasticfilesystem:AccessedViaMountTarget set to
    true), a condition that EFS itself counts as non-public.
  - Intentionally shared file systems; allowlist by file-system ID. Pair with EFS Block Public
    Access status.
  - Per-statement limitation -- the scoping filters are evaluated per statement, but the Allow
    and the Principal "*" selections are still matched across the whole document. So an Allow for
    a named principal next to a Deny with Principal "*" (for example an enforce-in-transit
    encryption statement) and no scoping key fires. Decode per statement in a production pipeline.
level: high
