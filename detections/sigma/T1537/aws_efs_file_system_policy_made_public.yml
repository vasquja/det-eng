  filter_mount_target_4:
    requestParameters.policy|re:
      - '^(\[|\s*\{([^{}\"]|\"([^\"\\]|\\.)*\")*\"Statement\"\s*:\s*\[?)\s*(\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\})*\})*\}\s*,\s*){3}\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\})*\})*\"Condition\"\s*:\s*\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\})*\{([^{}\"]|\"([^\"\\]|\\.)*\")*\"[Ee][Ll][Aa][Ss][Tt][Ii][Cc][Ff][Ii][Ll][Ee][Ss][Yy][Ss][Tt][Ee][Mm]\:[Aa][Cc][Cc][Ee][Ss][Ss][Ee][Dd][Vv][Ii][Aa][Mm][Oo][Uu][Nn][Tt][Tt][Aa][Rr][Gg][Ee][Tt]\"\s*:\s*\"?[Tt][Rr][Uu][Ee]'
  filter_mount_target_5:
    requestParameters.policy|re:
      - '^(\[|\s*\{([^{}\"]|\"([^\"\\]|\\.)*\")*\"Statement\"\s*:\s*\[?)\s*(\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\})*\})*\}\s*,\s*){4}\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\})*\})*\"Condition\"\s*:\s*\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\})*\{([^{}\"]|\"([^\"\\]|\\.)*\")*\"[Ee][Ll][Aa][Ss][Tt][Ii][Cc][Ff][Ii][Ll][Ee][Ss][Yy][Ss][Tt][Ee][Mm]\:[Aa][Cc][Cc][Ee][Ss][Ss][Ee][Dd][Vv][Ii][Aa][Mm][Oo][Uu][Nn][Tt][Tt][Aa][Rr][Gg][Ee][Tt]\"\s*:\s*\"?[Tt][Rr][Uu][Ee]'

  scoping_key_present:
    # A scoping key anywhere in the policy. When the policy holds no public Allow
    # statement that the statement test can read (public_allow_any; for example an Allow
    # for a named principal next to a Deny with Principal "*"), the document-level
    # selections above still hold, and the rule fires only if no scoping key occurs at all
    # (see falsepositives).
    requestParameters.policy|re|i: 'aws:PrincipalOrgID|aws:SourceArn|aws:SourceAccount|aws:SourceVpc|aws:SourceOwner'
  filter_failed:
    errorCode: '*'
  # Null-safe negation: a backend with three-valued logic (ES|QL and other SQL
  # backends) reads NOT of a test on a missing field as NULL and drops the record.
  # CloudTrail writes errorCode only when the call returns an error, so the filter is
  # ORed with a test that the field is absent.
  sel_no_error_code:
    errorCode: null
  condition: >
    selection_efs_policy and selection_allow and selection_public_principal and (sel_no_error_code or not filter_failed) and
    ((public_allow_statement and not (filter_scoped or filter_mount_target)) or
     (public_allow_statement_2 and not (filter_scoped_2 or filter_mount_target_2)) or
     (public_allow_statement_3 and not (filter_scoped_3 or filter_mount_target_3)) or
     (public_allow_statement_4 and not (filter_scoped_4 or filter_mount_target_4)) or
     (public_allow_statement_5 and not (filter_scoped_5 or filter_mount_target_5)) or
     public_allow_statement_beyond or
     (not public_allow_any and not scoping_key_present))
falsepositives:
  - A file-system policy granting a named account scoped by aws:PrincipalOrgID / aws:SourceArn is
    not public and is excluded. So is the EFS console wizard's policy, which grants the AWS
    principal '*' only through a mount target (elasticfilesystem:AccessedViaMountTarget set to
    true), a condition that EFS itself counts as non-public.
  - Intentionally shared file systems; allowlist by file-system ID. Pair with EFS Block Public
    Access status.
  - Document-level fallback -- when the statement test finds no public Allow statement, the Allow
    and the Principal "*" selections are matched across the whole document. So an Allow for a
    named principal next to a Deny with Principal "*" (for example an enforce-in-transit
    encryption statement) and no scoping key anywhere fires. Decode per statement in a production
    pipeline.
  - A policy with six or more statements whose public Allow statements at position 6 or later
    are all scoped fires, because statements 1 to 5 are tested one by one, and a public Allow after them
    fires without a scope test.
  - A scoping key named outside the statement's Condition (in its Sid, or as a condition value)
    does not scope the statement, so such a public Allow fires.
level: high
