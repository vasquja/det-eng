title: AWS EFS File System Policy Grants Public Access
id: 7e96a19e-2f88-4307-b5f4-2da8718a096c
status: experimental
description: |
  Detects an EFS PutFileSystemPolicy that attaches a resource-based policy allowing the public
  principal ("*" / {"AWS":"*"}) with no scoping condition, exposing a network file system to
  anonymous mount/access. Public-principal detection for EFS is largely absent from open rule
  sets -- this is new ground vs TRR9019's resource-policy family.

  It keys on the default-logged CloudTrail management event
  elasticfilesystem.amazonaws.com / PutFileSystemPolicy, matching an Allow + Principal "*" token
  in requestParameters.policy and suppressing only when every statement that Allows the public
  principal carries a scoping condition key in that same statement (aws:PrincipalOrgID /
  aws:SourceArn / aws:SourceAccount / aws:SourceVpc(e) / aws:SourceOwner, or
  elasticfilesystem:AccessedViaMountTarget set to true), as EFS itself judges "public". The
  policy arrives as a JSON string that this rule reads as text (the same approach TRR9019 took
  for mixed-encoding policy services). The statement test is a portable regex (no lookaround)
  anchored at the start of the policy: it reads whole JSON tokens (strings with their escapes,
  nested objects two levels deep), skips N-1 statements and tests statement N on its own
  Condition, for N = 1 to 5; a public Allow at statement 6 or later fires without a scope test.
  It checks that a key is present in the statement's Condition, not its value (other than the
  mount-target 'true'), so a production pipeline should still JSON-decode and evaluate each
  condition. Every value stays inside Lucene's default determinization budget.
references:
  - https://attack.mitre.org/techniques/T1537/
  - https://docs.aws.amazon.com/efs/latest/ug/API_PutFileSystemPolicy.html
  - https://docs.aws.amazon.com/efs/latest/ug/access-control-block-public-access.html
author: det-eng
date: 2026/10/13
tags:
  - attack.exfiltration
  - attack.t1537
  - attack.persistence
  - attack.t1098
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_efs_policy:
    eventSource: 'elasticfilesystem.amazonaws.com'
    eventName: 'PutFileSystemPolicy'
  selection_allow:
    # Require an Allow statement, so a Deny-only policy (e.g. an enforce-in-transit-encryption
    # policy: Effect Deny + Principal "*" + aws:SecureTransport=false) does not fire.
    requestParameters.policy|re: '\"Effect\"\s*:\s*\"Allow\"'
  selection_public_principal:
    # Literal asterisk principal, as a string or anywhere in a list of strings (["*"],
    # ["arn:aws:iam::111122223333:root", "*"]), matched with a regex so the '*' is NOT a
    # Sigma wildcard (a |contains '"AWS":"*"' would match any named principal). The list
    # is read as whole strings (with their escapes) up to the "*" entry.
    requestParameters.policy|re: '\"(Principal|AWS)\"\s*:\s*(\[\s*(\"([^\"\\]|\\.)*\"\s*,\s*)*)?\"\*\"'
  # Per-statement test, in portable regex (no lookaround), the same as
  # aws_resource_policy_made_public: each value is anchored at the start of the policy
  # ('^'), reads past its top-level keys to "Statement", skips N-1 whole statements and
  # tests statement N. A statement is read as JSON tokens (a whole string with its escapes,
  # a character that is not a brace or a quote, or a whole nested object two levels deep),
  # so a brace or a key name inside a string value is never read as structure.
  # public_allow_statement[_N]: statement N Allows the public principal ("*", {"AWS":"*"} or
  # "*" in a list), keys in any order. filter_scoped[_N] and filter_mount_target[_N]:
  # statement N carries, as a key of an operator block of its own Condition, a scoping key
  # (aws:PrincipalOrgID, aws:SourceArn, aws:SourceAccount, aws:SourceVpc and aws:SourceVpce,
  # aws:SourceOwner; EFS User Guide, 'Blocking public access' > 'The meaning of "public"')
  # or elasticfilesystem:AccessedViaMountTarget set to true (the EFS console wizard's
  # policy, which the same page counts as non-public). Condition keys are case-insensitive,
  # so every letter matches in either case. The condition pairs them per statement, so
  # every public Allow statement is tested on its own scope (C15). Statements 1 to 5 are
  # tested one by one; a public Allow statement at position 6 or later fires without the
  # scope test (public_allow_statement_beyond), a false positive on purpose. '\[?' reads a
  # Statement that is one object, not a list. Text test: a key's value (other than the
  # mount-target 'true') and operator are not checked.
  public_allow_statement:
    requestParameters.policy|re:
      - '^(\[|\s*\{([^{}\"]|\"([^\"\\]|\\.)*\")*\"Statement\"\s*:\s*\[?)\s*\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\})*\})*(\"Effect\"\s*:\s*\"Allow\"([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\})*\})*\"Principal\"\s*:\s*(\"\*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\"AWS\"\s*:\s*(\"\*\"|\[\s*(\"([^\"\\]|\\.)*\"\s*,\s*)*\"\*\")([^{}\"]|\"([^\"\\]|\\.)*\")*\})|\"Principal\"\s*:\s*(\"\*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\"AWS\"\s*:\s*(\"\*\"|\[\s*(\"([^\"\\]|\\.)*\"\s*,\s*)*\"\*\")([^{}\"]|\"([^\"\\]|\\.)*\")*\})([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\"|\{([^{}\"]|\"([^\"\\]|\\.)*\")*\})*\})*\"Effect\"\s*:\s*\"Allow\")'
