title: Kubernetes Malicious Admission Webhook Created
id: 83a524dc-8d4d-47a9-998d-99418583672a
status: experimental
description: |
  Detects the creation of an admission webhook configuration wired to a URL-mode
  endpoint (clientConfig.url, which normally points off-cluster), by inspecting the request body (requestObject, which needs audit level
  Request or higher). This is the TRR9025 severity layer on top of the chokepoint
  (k8s_admission_webhook_created.yml): the chokepoint fires on every
  admissionregistration create, this rule picks out the high-confidence malicious
  shape. It fires when a created MutatingWebhookConfiguration or
  ValidatingWebhookConfiguration has a clientConfig.url (any http(s) URL; normally
  off-cluster).

  URL mode is the single non-spoofable, low-false-positive discriminator:
  a legitimate webhook (cert-manager, Gatekeeper, Kyverno, a sidecar injector) almost
  always calls an in-cluster Service via clientConfig.service, never a raw URL, so a
  URL-mode webhook is the strongest tell that the webhook ships admitted objects -- every
  created Secret, every pod spec -- to an attacker endpoint (Procedure A mutating
  backdoor callback, Procedure B Secret exfiltration). The match uses |contains
  against the JSON-serialized webhooks array in both the spaced (request-body) and
  compact (Go) forms, because the audit backend stores an array field as JSON text
  (the same dual-form convention as the TRR9008 neuter grader). It does NOT key on
  cluster-wide rules or a secrets scope: those do not separate a malicious webhook
  from the admission tooling every cluster runs (Kyverno and Gatekeeper validate
  cluster-wide and over Secrets), so grading on them would be a high-severity false
  positive on normal installs.

  Demonstrated gap: a webhook wired to an IN-CLUSTER clientConfig.service backed by an
  attacker-controlled pod has no clientConfig.url, so this grader does not fire. The
  chokepoint still catches the create; correlate it with the creation of the backing
  Service and pod. The match is any URL-mode webhook: a url that names an in-cluster
  host also fires (the API documents that url should not name an in-cluster Service).
  A repoint of an existing webhook from clientConfig.service to url is an update or
  patch, not a create, so this rule does not fire on it; only the TRR9008 chokepoint
  (k8s_admission_webhook_disabled) does. Metadata level cannot feed this rule: clientConfig lives in
  requestObject, and without Request level a malicious and a benign webhook create are
  byte-identical. A CEL ValidatingAdmissionPolicy (Procedure C) cannot call
  off-cluster, so it is covered at the chokepoint only.
references:
  - https://attack.mitre.org/techniques/T1546/
  - https://kubernetes.io/docs/reference/access-authn-authz/extensible-admission-controllers/
  - https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
author: det-eng
date: 2026/10/14
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1546
logsource:
  product: kubernetes
  service: audit
detection:
  select_webhook_create:
    objectRef.apiGroup: 'admissionregistration.k8s.io'
    objectRef.resource:
      - 'mutatingwebhookconfigurations'
      - 'validatingwebhookconfigurations'
    verb: 'create'
  sel_offcluster_url:
    requestObject.webhooks|contains:
      - '"url": "http'
      - '"url":"http'
  condition: select_webhook_create and sel_offcluster_url
falsepositives:
  - A legitimate webhook that genuinely uses URL mode (rare; most call an in-cluster
    Service). Baseline the known webhook name, actor, and endpoint.
level: high
