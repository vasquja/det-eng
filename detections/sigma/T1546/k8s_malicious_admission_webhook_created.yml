title: Kubernetes Malicious Admission Webhook Created
id: 83a524dc-8d4d-47a9-998d-99418583672a
status: experimental
description: |
  Detects the creation of an admission webhook configuration that looks built to
  persist or exfiltrate, by inspecting the request body (requestObject, which needs
  audit level Request or higher). This is the TRR9025 severity layer on top of the
  chokepoint (k8s_admission_webhook_created.yml): the chokepoint fires on every
  admissionregistration create, this rule picks out the ones that matter. It fires
  when a created MutatingWebhookConfiguration or ValidatingWebhookConfiguration has
  either:

    - a clientConfig.url pointing off-cluster (an http(s) URL). A legitimate webhook
      almost always calls an in-cluster Service (clientConfig.service), not a raw
      URL, so an external URL is the single strongest tell that the webhook ships
      admitted objects -- every created Secret, every pod spec -- to an attacker
      endpoint (Procedure A mutating backdoor callback, Procedure B Secret
      exfiltration); or

    - rules that reach cluster-wide (apiGroups ["*"] or resources ["*"]) AND include
      Secrets, i.e. a webhook positioned to receive every Secret in the cluster even
      through an in-cluster relay.

  The literal wildcard rule match uses |re with an escaped star, not a plain
  |contains of "*", because in a Sigma value a bare * is a WILDCARD: '["*"]' as a
  |contains pattern would match ["pods"] too (a false positive). The clientConfig.url
  and the Secrets scope use |contains against the JSON-serialized webhooks array in
  both the spaced (request-body) and compact (Go) forms, because the audit backend
  stores an array field as JSON text (the same dual-form convention as the TRR9008
  neuter grader).

  Metadata level cannot feed this rule: clientConfig, rules, and resources all live
  in requestObject. Without Request level a malicious and a benign webhook create are
  byte-identical. A CEL ValidatingAdmissionPolicy (TRR9025 Procedure C) cannot call
  off-cluster, so it is intentionally not graded here -- it is covered at the
  chokepoint only, at its lower risk.
references:
  - https://attack.mitre.org/techniques/T1546/
  - https://kubernetes.io/docs/reference/access-authn-authz/extensible-admission-controllers/
  - https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
author: det-eng
date: 2026/10/14
tags:
  - attack.persistence
  - attack.credential-access
  - attack.t1546
logsource:
  product: kubernetes
  service: audit
detection:
  select_webhook_create:
    objectRef.apiGroup: 'admissionregistration.k8s.io'
    objectRef.resource:
      - 'mutatingwebhookconfigurations'
      - 'validatingwebhookconfigurations'
    verb: 'create'
  sel_offcluster_url:
    requestObject.webhooks|contains:
      - '"url": "http'
      - '"url":"http'
  sel_wildcard_scope:
    requestObject.webhooks|re:
      - '"apiGroups"\s*:\s*\[\s*"\*"'
      - '"resources"\s*:\s*\[\s*"\*"'
  sel_secrets_scope:
    requestObject.webhooks|contains:
      - '"secrets"'
  condition: select_webhook_create and (sel_offcluster_url or (sel_wildcard_scope and sel_secrets_scope))
falsepositives:
  - A legitimate webhook that genuinely calls an external URL (rare; most call an
    in-cluster Service). Baseline the known webhook name, actor, and endpoint.
  - A platform component that legitimately validates or mutates across many groups.
    Triage the created object against the actor; baseline the known installers.
level: high
