title: add_key Syscall By Non-Allowlisted Process (Keyring Stuffing)
id: 77682671-f1f7-446d-a2af-4db7845ea9d3
status: experimental
description: |
  Detects each `add_key(2)` syscall from a process outside the set that
  normally uses the kernel keyring. Repeated add_key calls are the setup for
  several kernel keyring privilege-escalation bugs (CVE-2016-0728,
  CVE-2022-1998).

  This is a single-event rule: it has no count or correlation, so one add_key
  fires it, and a burst fires it once per call. Where your pipeline supports
  it, count hits per pid in a short window and alert on the burst; a single
  add_key from an unlisted tool (for example `keyctl add`) is usually benign.

  Two filters suppress stock keyring users. `keyring_processes` matches by
  `comm`. `luks_images` matches cryptsetup and systemd-cryptsetup by `exe`
  paired with their comm: they hand every LUKS2 volume key to dm-crypt with
  add_key("logon", ...).

  Filter limits. A filter trusts the name and the binary, not the code that
  runs in the process. A process sets its own comm with prctl(PR_SET_NAME), so
  each `keyring_processes` entry suppresses a process that renames itself.
  Pairing exe with comm stops that rename, and a binary that only sits at an
  allowed path. It does not stop code injected into the real binary:
  cryptsetup is an ordinary, dynamically linked binary that is not setuid, so
  an unprivileged user can run it with LD_PRELOAD (or ptrace a running copy),
  and the injected add_key calls keep comm `cryptsetup` and its exe. A
  process in a container controls both values, because the kernel logs `exe`
  relative to the process's own root. The event schema has no uid, so the
  filter cannot require the root that a LUKS unlock runs as.
references:
  - https://man7.org/linux/man-pages/man2/add_key.2.html
  - https://nvd.nist.gov/vuln/detail/CVE-2016-0728
  - https://gitlab.com/cryptsetup/cryptsetup/-/blob/main/lib/utils_keyring.c
author: det-eng
date: 2026/10/05
modified: 2026/10/16
tags:
  - attack.privilege-escalation
  - attack.t1068
  - cve.2016-0728
logsource:
  product: linux
  service: auditd
detection:
  add_key_syscall:
    type: SYSCALL
    syscall: add_key
  keyring_processes:
    comm:
      - gnome-keyring-d
      - gssproxy
      - rpc.gssd
      - nfsidmap
      - request-key
      - systemd
      - sshd
  luks_images:
    # LUKS2 unlock: the volume key goes to dm-crypt as a "logon" key.
    - comm: cryptsetup
      exe:
        - /usr/sbin/cryptsetup
        - /sbin/cryptsetup
        - /usr/bin/cryptsetup
    # comm is the 15-character truncation of systemd-cryptsetup. systemd >= 256
    # installs the binary in /usr/bin with a link in /usr/lib/systemd.
    - comm: systemd-cryptse
      exe:
        - /usr/lib/systemd/systemd-cryptsetup
        - /lib/systemd/systemd-cryptsetup
        - /usr/bin/systemd-cryptsetup
  condition: add_key_syscall and not keyring_processes and not luks_images
falsepositives:
  - Administrators adding keys with `keyctl add` or `keyctl padd` (one hit per
    key)
  - Kerberos/GSSAPI and NFS idmapping components not covered by the allowlist
  - eCryptfs and fscrypt key setup — extend `keyring_processes` for the host
  - Not a false positive but a known miss — add_key calls from code injected
    into cryptsetup or systemd-cryptsetup (LD_PRELOAD, ptrace) are suppressed
    by `luks_images`. On hosts that never unlock LUKS volumes, remove
    `luks_images`
level: medium
