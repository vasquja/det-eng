title: Kubernetes Admission Webhook or Policy Disabled
id: 1f30ff44-6a0c-4a2d-b63e-d0b0487223b9
status: experimental
description: |
  Detects a write that removes or disarms Kubernetes dynamic admission control: a
  delete, deletecollection, update, or patch of an object in the
  admissionregistration.k8s.io API group (ValidatingWebhookConfiguration,
  MutatingWebhookConfiguration, and the CEL ValidatingAdmissionPolicy and
  ValidatingAdmissionPolicyBinding). This is the TRR9008 Strategy 1 chokepoint,
  covering Procedure A (delete a validating webhook config), B (delete a mutating
  webhook config), and C (neuter one in place). Admission webhooks are how
  OPA/Gatekeeper, Kyverno, image-signature verifiers, and Falco admission paths
  enforce policy, so removing or disarming them clears the way for the next
  malicious pod, unsigned image, or privilege grab.

  The create verb is deliberately EXCLUDED: creating a malicious webhook is
  persistence (Event Triggered Execution, TRR9025), a different technique. But a
  server-side-apply install of a missing object (kubectl apply --server-side, or a
  GitOps or Helm deploy that uses server-side apply) is a patch answered 201, not a
  create, so it does fire this rule (K21). The TRR9025 create rules
  (T1546/k8s_admission_webhook_created.yml, and
  T1546/k8s_malicious_admission_webhook_created.yml for a URL-mode webhook) fire on
  the same record, so such an install alerts twice; that double alert is expected.
  The TRR9008 neuter grader filters it (an install cannot neuter an installed
  webhook). A refused server-side-apply install (a patch answered 4xx) fires neither
  TRR9025 create rule (their patch branch needs 201); this rule records it. There is
  no replace audit verb either: an HTTP PUT (kubectl replace, or apply sent as PUT)
  is recorded as verb=update. So the four verbs here are the complete disabling set.

  The rule fires at Metadata (verb, apiGroup, and objectRef.name are enough to see
  a delete or flag a patch/update). It cannot tell a benign webhook edit from a
  neuter; the companion rule (k8s_admission_webhook_neutered.yml) grades that at
  Request level. Baseline the ACTOR, not the object: suppress the policy engine's
  own service account, GitOps/Helm identities, and system:kube-controller-manager
  by user.username and user.groups -- an attacker touches the same objects.
references:
  - https://attack.mitre.org/techniques/T1685/
  - https://kubernetes.io/docs/reference/access-authn-authz/extensible-admission-controllers/
  - https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
author: det-eng
date: 2026/10/12
tags:
  - attack.defense-impairment
  - attack.t1685
logsource:
  product: kubernetes
  service: audit
detection:
  select_adm_write:
    objectRef.apiGroup: 'admissionregistration.k8s.io'
    verb:
      - 'delete'
      - 'deletecollection'
      - 'update'
      - 'patch'
  # Server-side dry run of an update or patch: the options are read from the query
  # only, so ?dryRun=All (the whole parameter) is what the server used.
  filter_dry_run_write:
    verb:
      - 'update'
      - 'patch'
    requestURI|re:
      - '[?&]dryRun=All$'
      - '[?&]dryRun=All\&'
  # Server-side dry run of a delete: in the DeleteOptions body (Request level, as
  # the shipped policy logs admissionregistration deletes). The query form is not
  # filtered for a delete: with a body present the API server ignores the query.
  filter_dry_run_delete_body:
    verb:
      - 'delete'
      - 'deletecollection'
    requestObject.dryRun|contains: 'All'
  condition: select_adm_write and not filter_dry_run_write and not filter_dry_run_delete_body
falsepositives:
  - The policy engine's own controller reconciling its webhook configuration
    (Gatekeeper, Kyverno), and GitOps or Helm upgrades that replace a webhook
    config. Baseline these identities by user.username and user.groups.
  - Cluster upgrades that update the built-in admission configurations. Baseline
    the upgrade tooling.
  - A server-side dry run under an audit policy that logs these deletes at Metadata
    only. The update and patch form is filtered at any level (the option is in the
    query); the delete form needs the DeleteOptions body, which the shipped lab policy
    records (Request level).
level: medium
