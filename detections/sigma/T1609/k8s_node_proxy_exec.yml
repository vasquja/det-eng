title: Command Execution Through the Kubernetes Node Proxy
id: 4698f139-0538-4a87-b444-a6ea6b0a328c
status: experimental
description: |
  Detects command execution forwarded to a kubelet through the API server node
  proxy (nodes/proxy), where the request path names the kubelet /exec, /run, or
  /attach endpoint. This is TRR9002 Strategy 3, covering Procedure D.

  The audit record for this path shows objectRef.resource=nodes,
  subresource=proxy — NOT pods/exec — so the Strategy 1 rule does not see it.
  nodes/proxy is a powerful permission that many monitoring tools request to
  read metrics, and it is enough to run a command in any pod on the node. The
  subresource alone is high volume (metrics and stats scraping), so the rule
  also requires an exec path in requestURI. A path whose first segment after
  /proxy/ is another kubelet endpoint (containerLogs, portForward, checkpoint,
  logs, debug) is not an exec even when a later segment is named exec, run or
  attach, so it is filtered. A nodes/proxy request whose requestURI path (anything
  before ?) holds a percent-encoded byte or a dot segment fires on its own: the
  kubelet receives the decoded path, which can differ from the endpoint the raw
  requestURI seems to name.
references:
  - https://attack.mitre.org/techniques/T1609/
  - https://kubernetes.io/docs/reference/access-authn-authz/kubelet-authn-authz/
author: det-eng
date: 2026/10/06
tags:
  - attack.execution
  - attack.t1609
  - attack.t1059.013
logsource:
  product: kubernetes
  service: audit
detection:
  select_node_proxy:
    objectRef.resource: 'nodes'
    objectRef.subresource: 'proxy'
  select_exec_path:
    requestURI|contains:
      - '/exec/'
      - '/run/'
      - '/attach/'
  # Another kubelet endpoint (the first segment after /proxy/) whose later path
  # segments name a namespace, pod or container exec, run or attach.
  filter_other_kubelet_endpoint:
    requestURI|re: '^/api/v1/nodes/[^/?]+/proxy/(containerLogs|portForward|checkpoint|logs|debug)([/?].*)?$'
  # The audit record keeps the raw request line, but the API server routes,
  # authorizes (objectRef) and proxies the decoded path. A nodes/proxy request whose
  # requestURI path (anything before ?) holds a percent-encoded byte or a dot
  # segment can therefore name a different kubelet endpoint than requestURI shows,
  # even when the encoding is in the /api/v1/nodes/<n>/proxy/ prefix itself; it
  # fires whatever endpoint it appears to name, and the filter above never
  # suppresses it. Ordinary clients send neither in a nodes/proxy path.
  select_path_not_normalized:
    requestURI|re:
      - '^[^?]*(%[0-9A-Fa-f]{2}|/\.\./)'
      - '^[^?]*/\.\.(\?.*)?$'
  condition: select_node_proxy and ((select_exec_path and not filter_other_kubelet_endpoint) or select_path_not_normalized)
falsepositives:
  - Rare. Legitimate use of the node proxy to reach kubelet exec/run/attach is
    unusual; triage every hit. Routine nodes/proxy traffic to /metrics and
    /stats does not match because of the requestURI path filter.
level: high
