title: Kubernetes Pod Requests Host Access (Escape Surface)
id: 2cfa4756-b65b-4166-81fd-f9247663cd10
status: experimental
description: |
  Detects a pod write whose specification requests host access: a privileged
  container, a hostPath volume, a host namespace (hostPID/hostNetwork/hostIPC), or
  a dangerous Linux capability. This is the TRR9007 Strategy 1 chokepoint, covering
  Procedure A (privileged), B (hostPath), C (host namespace), and D (capabilities).
  A pod with any of these can reach the node and every other pod on it, with no
  kernel exploit -- Kubernetes hands over the host because the pod spec asked.

  Every path puts its dangerous field in the pod spec, and the pod spec is the
  request body the API server records, so one admission-time rule covers all four.
  The privileged and capability checks read the containers, the initContainers
  (an init container runs on the node with its own securityContext) and the
  ephemeralContainers (kubectl debug patches the pods/ephemeralcontainers
  subresource: --profile=sysadmin sets privileged, --profile=general adds
  SYS_PTRACE). The rule also catches an attempt that admission REJECTS, because
  requestObject is logged with the 403 as well.

  A status write (objectRef.subresource status) is filtered, as in
  k8s_podspec_confinement_disabled.yml: a status update that sends the full pod
  carries the spec too, but the pod status strategy resets the spec to the stored one,
  so it cannot add host access.

  The rule needs audit level Request (or higher): requestObject is absent at
  Metadata, so a Metadata-only policy makes this rule blind. The host-namespace
  fields (hostPID/hostNetwork/hostIPC) are top-level booleans; the container and
  volume fields are in JSON-serialized arrays. privileged is matched with
  |contains in both the spaced (Request-body) and compact (Go) forms, so the rule
  is portable across a det-eng audit log and a production SIEM. A capability
  matches only inside a capabilities "add" list, and a hostPath only as a volume
  source key ("hostPath": {), with |re patterns that accept either form. A
  container name, an env value, a "drop" list or a volume name that spells a
  capability or "hostpath" does not fire. "ALL" grants every capability and is on
  the list. The capability match is case-insensitive (|re|i) and accepts an
  optional CAP_ prefix, because the API server does not validate the names and
  the runtimes normalise them: containerd upper-cases each added name and tests
  ALL with EqualFold, and CRI-O also keeps a CAP_ prefix in any case. So
  "sys_admin", "all" and "Cap_Sys_Admin" grant the capability and fire.
  The add list is read element by element (whole JSON strings, or null, which the API
  server decodes as an empty name), so a "]" inside an earlier element does not end
  the list early.

  A JSON patch (kubectl patch --type=json) of the pods/ephemeralcontainers subresource
  logs requestObject as the operation list, so the requestObject.spec.ephemeralContainers
  selection above cannot see it. (kubectl debug sends a strategic-merge patch, which the
  selection above reads; a JSON patch comes from kubectl patch --subresource=
  ephemeralcontainers --type=json or another client.) The sel_jp_* items grade a JSON
  patch too (they read the ops text and so apply only to a JSON patch): an operation that
  adds a privileged ephemeral container, or one that adds an escape capability to its add
  list, whether the dangerous field is the op path's last segment (in either key order,
  with ignored extra keys between them) or set in the op value, a replace of the whole
  object (path ""), and a copy or move into the leaf path. A list index in the leaf
  path is any JSON-pointer token, because the API server's JSON patch library reads +0,
  -0 and -1 as indexes. This closes the pod half of
  the gap once tracked as RULE_DEFECTS K18. A pod's regular containers are
  immutable after create, and host namespaces and volumes are pod-level, so the
  ephemeral-container subresource is the only write-time JSON-patch surface here.

  This is noisy without baselining: kube-proxy, the CNI DaemonSet (kindnet,
  Calico, Cilium), and other infrastructure legitimately request host access.
  Baseline those by EXACT pod name, image, and identity -- never by the dangerous
  field (an attacker uses the same fields) and never by namespace (an attacker
  hides in kube-system). A companion rule (k8s_podspec_controller_host_access.yml)
  catches the same request made through a workload controller.
references:
  - https://attack.mitre.org/techniques/T1611/
  - https://kubernetes.io/docs/concepts/security/pod-security-standards/
  - https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
author: det-eng
date: 2026/10/12
tags:
  - attack.privilege-escalation
  - attack.t1611
logsource:
  product: kubernetes
  service: audit
detection:
  selection_pod:
    objectRef.resource: 'pods'
    verb:
      - 'create'
      - 'update'
      - 'patch'
  sel_privileged:
    requestObject.spec.containers|contains:
      - '"privileged": true'
      - '"privileged":true'
  sel_privileged_init:
    requestObject.spec.initContainers|contains:
      - '"privileged": true'
      - '"privileged":true'
  sel_privileged_ephem:
    requestObject.spec.ephemeralContainers|contains:
      - '"privileged": true'
      - '"privileged":true'
  sel_caps:
    requestObject.spec.containers|re|i: '\"add\":\s*\[\s*((\"([^"\\]|\\.)*\"|null)\s*,\s*)*\"((CAP_)?(SYS_ADMIN|SYS_PTRACE|SYS_MODULE|DAC_READ_SEARCH|SYS_BOOT|SYS_RAWIO|NET_ADMIN|BPF|SYSLOG)|ALL)\"'
  sel_caps_init:
    requestObject.spec.initContainers|re|i: '\"add\":\s*\[\s*((\"([^"\\]|\\.)*\"|null)\s*,\s*)*\"((CAP_)?(SYS_ADMIN|SYS_PTRACE|SYS_MODULE|DAC_READ_SEARCH|SYS_BOOT|SYS_RAWIO|NET_ADMIN|BPF|SYSLOG)|ALL)\"'
  sel_caps_ephem:
    requestObject.spec.ephemeralContainers|re|i: '\"add\":\s*\[\s*((\"([^"\\]|\\.)*\"|null)\s*,\s*)*\"((CAP_)?(SYS_ADMIN|SYS_PTRACE|SYS_MODULE|DAC_READ_SEARCH|SYS_BOOT|SYS_RAWIO|NET_ADMIN|BPF|SYSLOG)|ALL)\"'
  sel_hostpath:
    requestObject.spec.volumes|re: '\"hostPath\":\s*\{'
  sel_hostpid:
    requestObject.spec.hostPID: true
  sel_hostnet:
    requestObject.spec.hostNetwork: true
  sel_hostipc:
    requestObject.spec.hostIPC: true
  # JSON patch (kubectl patch --type=json): requestObject is the operation list, so the
  # requestObject.spec.* selections above cannot see it (closed RULE_DEFECTS K18). On a
  # pod the only write-time JSON-patch surface for a dangerous field is the
  # ephemeralContainers subresource (regular containers are immutable after create;
  # hostPID/hostNetwork/hostIPC and volumes are pod-level and not set through this
  # subresource), so these branches grade a privileged or capability-adding ephemeral
  # container added by a JSON patch. They apply ONLY to a JSON patch, because a
  # strategic-merge body flattens to requestObject.spec.ephemeralContainers and never to
  # a bare requestObject field. Modelled on the TRR9008 JSON-patch selectors: an op at
  # the document root (""), /spec, /spec/ephemeralContainers or below with a dangerous
  # value; a leaf op whose path's last segment is the field, in either key order; or a
  # copy or move into that path. A list index in a capabilities/add path is any
  # JSON-pointer token ([^/"]+): the API server's JSON patch library
  # (gopkg.in/evanphx/json-patch.v4 v4.13.0) reads an index with Go strconv.Atoi and
  # accepts a negative index, so +0, -0 and -1 are indexes too (the TRR9025 repoint
  # grader's grammar). Between two keys of one op, the match skips whole JSON
  # strings and nested objects two levels deep (the T1685 grammar), so an ignored extra
  # key does not split the op, and it never crosses into the next op. An extra key nested
  # three levels deep splits the op and is not matched (RULE_DEFECTS.md K33). Each value
  # stays inside Lucene's default determinization budget (10,000; the largest here is
  # about 7,400 states).
  sel_jp_eph_path:
    requestObject|re: '\"path\"\s*:\s*\"(/spec(/ephemeralContainers(/[^"]*)?)?)?\"'
  sel_jp_priv_value:
    requestObject|re: '\"privileged\"\s*:\s*true'
  sel_jp_caps_value:
    requestObject|re|i: '\"add\"\s*:\s*\[\s*((\"([^"\\]|\\.)*\"|null)\s*,\s*)*\"((CAP_)?(SYS_ADMIN|SYS_PTRACE|SYS_MODULE|DAC_READ_SEARCH|SYS_BOOT|SYS_RAWIO|NET_ADMIN|BPF|SYSLOG)|ALL)\"'
  sel_jp_leaf_bool:
    requestObject|re:
      - '\"path\"\s*:\s*\"/spec/ephemeralContainers[^"]*/securityContext/privileged\"([^{}"]|\"([^"\\]|\\.)*\"|\{([^{}]|\{[^{}]*\})*\})*\"value\"\s*:\s*true'
      - '\"value\"\s*:\s*true([^{}"]|\"([^"\\]|\\.)*\"|\{([^{}]|\{[^{}]*\})*\})*\"path\"\s*:\s*\"/spec/ephemeralContainers[^"]*/securityContext/privileged\"'
  sel_jp_leaf_caps:
    requestObject|re|i:
      - '\"path\"\s*:\s*\"/spec/ephemeralContainers[^"]*/capabilities/add\"([^{}"]|\"([^"\\]|\\.)*\"|\{([^{}]|\{[^{}]*\})*\})*\"value\"\s*:\s*\[\s*((\"([^"\\]|\\.)*\"|null)\s*,\s*)*\"((CAP_)?(SYS_ADMIN|SYS_PTRACE|SYS_MODULE|DAC_READ_SEARCH|SYS_BOOT|SYS_RAWIO|NET_ADMIN|BPF|SYSLOG)|ALL)\"'
      - '\"path\"\s*:\s*\"/spec/ephemeralContainers[^"]*/capabilities/add/[^/"]+\"([^{}"]|\"([^"\\]|\\.)*\"|\{([^{}]|\{[^{}]*\})*\})*\"value\"\s*:\s*\"((CAP_)?(SYS_ADMIN|SYS_PTRACE|SYS_MODULE|DAC_READ_SEARCH|SYS_BOOT|SYS_RAWIO|NET_ADMIN|BPF|SYSLOG)|ALL)\"'
      - '\"value\"\s*:\s*\[\s*((\"([^"\\]|\\.)*\"|null)\s*,\s*)*\"((CAP_)?(SYS_ADMIN|SYS_PTRACE|SYS_MODULE|DAC_READ_SEARCH|SYS_BOOT|SYS_RAWIO|NET_ADMIN|BPF|SYSLOG)|ALL)\"([^{}"]|\"([^"\\]|\\.)*\"|\{([^{}]|\{[^{}]*\})*\})*\"path\"\s*:\s*\"/spec/ephemeralContainers[^"]*/capabilities/add\"'
      - '\"value\"\s*:\s*\"((CAP_)?(SYS_ADMIN|SYS_PTRACE|SYS_MODULE|DAC_READ_SEARCH|SYS_BOOT|SYS_RAWIO|NET_ADMIN|BPF|SYSLOG)|ALL)\"([^{}"]|\"([^"\\]|\\.)*\"|\{([^{}]|\{[^{}]*\})*\})*\"path\"\s*:\s*\"/spec/ephemeralContainers[^"]*/capabilities/add/[^/"]+\"'
  sel_jp_leaf_copy:
    requestObject|re:
      - '\"op\"\s*:\s*\"(copy|move)\"([^{}"]|\"([^"\\]|\\.)*\"|\{([^{}]|\{[^{}]*\})*\})*\"path\"\s*:\s*\"/spec/ephemeralContainers[^"]*(/securityContext/privileged|/capabilities/add(/[^/"]+)?)\"'
      - '\"path\"\s*:\s*\"/spec/ephemeralContainers[^"]*(/securityContext/privileged|/capabilities/add(/[^/"]+)?)\"([^{}"]|\"([^"\\]|\\.)*\"|\{([^{}]|\{[^{}]*\})*\})*\"op\"\s*:\s*\"(copy|move)\"'
  # A status write cannot change the spec (the status strategy resets it).
  filter_status:
    objectRef.subresource: 'status'
  condition: selection_pod and (sel_privileged or sel_privileged_init or sel_privileged_ephem or sel_caps or sel_caps_init or sel_caps_ephem or sel_hostpath or sel_hostpid or sel_hostnet or sel_hostipc or sel_jp_leaf_bool or sel_jp_leaf_caps or sel_jp_leaf_copy or (sel_jp_eph_path and (sel_jp_priv_value or sel_jp_caps_value))) and not filter_status
falsepositives:
  - Infrastructure that legitimately needs host access. kube-proxy runs privileged
    and hostNetwork; the CNI DaemonSet (kindnet, Calico, Cilium) runs privileged
    with hostPath mounts; monitoring and storage agents mount host paths. Baseline
    these by exact pod name, image, and identity -- not by the dangerous field or
    the namespace.
  - Operators debugging with a privileged pod, or with kubectl debug
    --profile=general or sysadmin (an ephemeral container that adds SYS_PTRACE or
    is privileged). Baseline the known identities.
level: high
