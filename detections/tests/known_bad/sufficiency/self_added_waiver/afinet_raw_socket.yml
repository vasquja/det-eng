title: AF_INET Raw Socket Created By Non-Ping/Traceroute Process
id: 3f6d2a94-8c1e-4b0a-9d2e-7c5a1f0b4e8d
status: experimental
description: |
  PLANTED ARTIFACT of detections/tests. It is not a detection of this repository.
  It replaces detections/sigma/T1040/afinet_raw_socket.yml in a copy of the
  repository (same id, same title, same file name). What changed: the two
  arguments are gone (`a0`: AF_INET / AF_INET6, `a1`: SOCK_RAW), so the rule now
  fires on EVERY socket() call of a process that is not on the allowlist. Every
  positive item left is a surface field (type, syscall): this is the shape a rule
  takes when it loses its argument. The sidecar beside it holds the cases that
  still pass. detections/check_sufficiency.py fails this rule on R2, unless
  CHOKEPOINT in that script lists it (detections/tests/test_sufficiency.py).
author: det-eng
date: 2026/10/05
tags:
  - attack.credential-access
  - attack.discovery
  - attack.t1040
logsource:
  product: linux
  service: auditd
detection:
  afinet_raw_socket:
    type: SYSCALL
    syscall: socket
  allowed_processes:
    comm:
      - ping
      - ping6
      - traceroute
      - traceroute6
  condition: afinet_raw_socket and not allowed_processes
level: medium
