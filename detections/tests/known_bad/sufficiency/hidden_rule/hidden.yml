title: PLANTED known-bad artifact - Rule In A Hidden File
id: 9d2f6a13-58c0-4e7b-b1a4-6c3e0f9d2a57
status: experimental
description: |
  PLANTED ARTIFACT of detections/tests. It is not a detection of this repository.
  The test plants this file as `detections/sigma/T1040/.hidden.yml`, with the
  sidecar beside it as `.hidden.cases.jsonl`. The positive case of that sidecar
  cannot fire the rule. A gate that reads the pair fails; a gate that lists
  detections/sigma/ refuses the file names. A gate that does neither accepts a
  rule that nothing checked (detections/tests/test_sufficiency.py).
