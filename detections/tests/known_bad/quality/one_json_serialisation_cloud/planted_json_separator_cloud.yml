title: PLANTED known-bad artifact - EBS Snapshot Made Public (one JSON serialisation)
id: 5e1c9a37-0b64-4d82-a7f5-9c3e2d6b8a10
status: experimental
description: |
  PLANTED ARTIFACT of detections/tests. It is not a detection of this repository.
  Derived from detections/sigma/T1537/aws_snapshot_or_ami_made_public.yml
  (selection_ec2_snapshot). The real rule lists both JSON forms of the list's text
  ('"group": "all"' and '"group":"all"'). The defect: this rule lists only the
  form with a blank after the colon, the form that json.dumps writes by default.
  That is the text sigma_eval.flatten() gives every offline gate, so the positive
  case fires there; a store that writes the list without blanks never holds it,
  and the rule is silent on the same event. No gate varies the JSON text of a list
  for a rule that is not a Kubernetes audit rule, so every gate accepts this rule
  today (detections/tests/test_quality.py, known gap ns-one-json-serialisation).
author: det-eng
date: 2026/11/10
tags:
  - attack.exfiltration
  - attack.t1537
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_ec2_snapshot:
    eventName: 'ModifySnapshotAttribute'
    requestParameters.createVolumePermission.add.items|contains: '"group": "all"'
  condition: selection_ec2_snapshot
level: high
