name: validate-detections

# Proves the atomic -> auditd -> Sigma loop on a real GitHub-hosted VM.
# A standard ubuntu-latest runner is a full VM (not a container), so the
# Linux audit subsystem is available to root. The job installs auditd, loads
# detections/audit/atomic.rules, runs each atomic, and checks the paired
# Sigma rule's SYSCALL selections match the resulting audit events.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install audit and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y auditd gcc python3 python3-yaml

      - name: Start auditd
        run: |
          sudo systemctl start auditd || sudo service auditd start
          sudo auditctl -s

      - name: Audit self-test (diagnostic)
        shell: bash
        run: |
          set +e
          echo "=== kernel + audit_enabled ==="
          uname -r; cat /proc/sys/kernel/audit_enabled 2>&1
          echo "=== load rules + list ==="
          sudo auditctl -R detections/audit/atomic.rules
          sudo auditctl -l
          echo "=== emit socket()/setns probes ==="
          sudo python3 -c "import socket; socket.socket(socket.AF_INET, socket.SOCK_DGRAM).close()"
          sudo python3 -c "import ctypes,os; ctypes.CDLL(None).setns(os.open('/proc/1/ns/mnt',0),0)" 2>&1 | head -1
          sleep 3
          echo "=== record types present in audit.log ==="
          sudo awk '{for(i=1;i<=NF;i++) if($i ~ /^type=/) print $i}' /var/log/audit/audit.log | sort | uniq -c | sort -rn | head
          echo "=== count of type=SYSCALL ==="
          sudo grep -c "type=SYSCALL" /var/log/audit/audit.log 2>&1
          echo "=== ausearch -sc socket (NO key filter) ==="
          sudo ausearch -sc socket -i 2>&1 | tail -12
          echo "=== tail of audit.log ==="
          sudo tail -15 /var/log/audit/audit.log 2>&1
          exit 0

      - name: Validate detections
        run: |
          sudo python3 detections/validate_detections.py --report | tee /tmp/val.out

      - name: Publish results to job summary
        if: always()
        run: |
          {
            echo '## Detection validation (atomic -> auditd -> Sigma)'
            echo ''
            echo '```'
            cat /tmp/val.out 2>/dev/null || echo '(no output captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
