name: validate-detections

# Proves the atomic -> auditd -> Sigma loop on a real GitHub-hosted VM.
# A standard ubuntu-latest runner is a full VM (not a container), so the
# Linux audit subsystem is available to root. The job installs auditd, loads
# detections/audit/atomic.rules, runs each atomic, and checks that the paired
# Sigma rule, compiled by pySigma, fires on the atomic's own successful
# syscalls. Then it runs controls (no-op, mutants, allowlisted names) that
# must NOT pass. Strict: a detection FAIL or a broken control fails the job.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  # Weekly regression: re-run even when nothing changed (pySigma, the runner
  # image and the kernel drift underneath the rules).
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install audit, build tools and validator requirements
        run: |
          bash .github/scripts/apt_install.sh auditd gcc python3-venv
          # A venv on the system Python runs cleanly under sudo (no
          # LD_LIBRARY_PATH needed, unlike a setup-python interpreter).
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet -r detections/requirements.txt

      - name: Start auditd
        run: |
          sudo systemctl start auditd || sudo service auditd start
          sudo auditctl -s

      - name: Validate detections
        shell: bash
        run: |
          # shell: bash enables pipefail, so tee does not mask the exit code.
          # --require-audit makes a broken audit setup fail instead of skip.
          sudo /tmp/venv/bin/python detections/validate_detections.py \
            --require-audit | tee /tmp/val.out

      - name: Publish results to job summary
        if: always()
        run: |
          {
            echo '## Detection validation (atomic -> auditd -> pySigma) + controls'
            echo ''
            echo '```'
            cat /tmp/val.out 2>/dev/null || echo '(no output captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  sigma-lint:
    # Lints the Sigma rules with the official pySigma validators (sigma-cli).
    # Parse/condition ERRORS fail the job; best-practice ISSUES are reported
    # in the summary, not gated (several are expected for auditd rules).
    # Then check_sigma_regex.py fails the job on any |re value outside the
    # portable regex subset (detections/README.md, "Portable regular
    # expressions"), compiling each value with Python re and RE2.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # google-re2 ships wheels up to cp314; '3.x' now resolves to 3.15,
          # where pip falls back to a Bazel source build that fails.
          python-version: '3.14'

      - name: Install sigma-cli
        run: |
          python3 -m venv /tmp/sigmaenv
          /tmp/sigmaenv/bin/pip install --quiet --upgrade pip
          /tmp/sigmaenv/bin/pip install --quiet sigma-cli
          # RE2 (the engine behind KQL and Go backends) for the regex lint.
          /tmp/sigmaenv/bin/pip install --quiet google-re2==1.1.20251105

      - name: Sigma check
        shell: bash
        run: |
          # Exclude the three validators that fetch external taxonomies over
          # the network (ATT&CK, D3FEND, CAR) so the gate stays offline and
          # deterministic. Default behaviour: FAIL on parse/condition errors,
          # REPORT (not fail) on best-practice issues.
          /tmp/sigmaenv/bin/sigma check \
            -x attacktag -x d3_fendtag -x cartag \
            detections/sigma/ | tee /tmp/sigma.out

      - name: Portable regex lint
        if: always()
        shell: bash
        run: |
          # shell: bash enables pipefail, so tee does not mask the exit code.
          /tmp/sigmaenv/bin/python .github/scripts/check_sigma_regex.py --require-re2 \
            | tee /tmp/sigma-regex.out

      - name: Publish results to job summary
        if: always()
        run: |
          {
            echo '## Sigma rule lint (pySigma validators)'
            echo ''
            echo 'Parse/condition errors fail the job; best-practice issues are reported only.'
            echo 'Expected issue: NumberAsString — auditd arg values (e.g. `a0: "11"`) are hex strings by design.'
            echo ''
            echo '```'
            cat /tmp/sigma.out 2>/dev/null || echo '(no output captured)'
            echo '```'
            echo ''
            echo '## Portable regex lint (check_sigma_regex.py)'
            echo ''
            echo '```'
            cat /tmp/sigma-regex.out 2>/dev/null || echo '(no output captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  markdown-links:
    # Verifies every relative Markdown link in the repo points at a file or
    # directory that exists. Offline and deterministic (no external URLs are
    # network-checked). Template dirs are skipped (they hold placeholder links).
    # Then checks the anchors (#...) of the links into, inside and out of
    # detections/k8s/PLATFORMS.md (standard library only; check_md_links.py
    # checks paths only).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check relative Markdown links
        run: python3 .github/scripts/check_md_links.py

      - name: Check the anchors of the links into and out of detections/k8s/PLATFORMS.md
        run: python3 detections/k8s_platforms_md.py --anchors

  # Proves on a runner the second way of .github/scripts/apt_install.sh: apt with public
  # resolvers in a private mount namespace. A fault of the runner's resolver is rare, so
  # without this job that way would run for the first time in a fault.
  apt-install-fallback:
    name: apt-install-fallback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install a package with the public resolvers (forced), and see that the runner's resolver is not changed
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum /etc/resolv.conf)"
          APT_INSTALL_FORCE_PUBLIC=1 bash .github/scripts/apt_install.sh auditd
          # The package is installed.
          dpkg -s auditd >/dev/null
          # The resolv.conf of the runner is as it was: the change was private to apt.
          after="$(sha256sum /etc/resolv.conf)"
          if [[ "$before" != "$after" ]]; then
            echo "::error::/etc/resolv.conf of the runner changed"
            exit 1
          fi
