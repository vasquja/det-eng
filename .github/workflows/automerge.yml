name: automerge

# Auto-merge a pull request once the full validation loop is green — det-eng's
# "the proof decides what is done" model, applied to the merge itself. This lets an
# AI (or anyone) drive a detection to a mergeable, CI-proven state and have it land
# without a manual click, at scale, while keeping an auditable, bounded blast radius.
#
# SAFETY RAILS (all must hold, re-checked on the exact head commit every time, and
# every gate fails CLOSED — any ambiguity holds the merge):
#   1. Per-PR opt-in: the PR must carry the `automerge` label. A label can be added
#      only by a collaborator with triage/write access, so the label IS the human (or
#      trusted-automation) opt-in. Remove the label to veto.
#   2. Same-repo only: fork PRs are never merged here (a fork's head.repo.full_name
#      carries the fork owner, so it can never equal the base). This is the key defense
#      against a malicious outside PR.
#   3. Not a draft, and the base branch is `main`.
#   4. Every check run on the exact head SHA has concluded success / neutral / skipped
#      (nothing failed, nothing still running), and there is at least one check.
#   5. No reviewer's latest review is CHANGES_REQUESTED (a human veto is honored).
#   6. No merge conflict (`mergeable == true`, confirmed — an unknown holds).
#   7. The merge is guarded by the head SHA, so a push that races the merge aborts it
#      rather than merging unreviewed code.
#   8. Human sign-off on PROTECTED paths. What counts as "benign enough" and what
#      counts as a sufficient check are human decisions, so a PR that changes any of
#        detections/benign/budgets.json, detections/benign/slices/**,
#        detections/check_sufficiency.py, detections/rule_cases.py,
#        detections/sigma_explain.py, detections/score_benign.py,
#        detections/benign_corpus.py,
#        .github/workflows/detection-quality.yml, .github/workflows/automerge.yml
#      (a rename away from one counts too) is merged here only with an APPROVED
#      review, as that reviewer's latest decision, ON THE EXACT HEAD COMMIT, from a
#      human (user type "User", not a bot) who is a repo owner/member/collaborator
#      and is not the PR author. Otherwise the PR is left for a human to approve or
#      merge. The file list is paginated and compared with the PR's changed_files
#      count; an API error or an incomplete list holds the merge.
#
# The label path uses `pull_request_target`, NOT `pull_request`: pull_request_target
# runs THIS file from the base branch (main) with a write token and never uses the PR
# branch's copy, so a PR cannot ship an altered automerge.yml that runs with write
# access. This is safe only because the job reads API metadata and never checks out or
# runs PR-authored code. The `workflow_run` path likewise always runs the base-branch
# copy. Nothing from the event (title, branch, body, author) is interpolated into the
# shell; github-context values come through the env: block.
#
# COVERAGE — the heavy validators (apiserver / cloud / k8s / staticpod) now ALWAYS
# report a status on a PR: each one triggers on every PR, a cheap `changes` job
# decides from the diff whether the heavy job runs, and an unrelated PR skips it (a
# skipped required check counts as success). They are wired to be branch-protection
# required checks, so both this auto-merge gate and the merge itself see a real,
# per-validator signal instead of "only the checks that happened to run". The
# `detection-quality` checks (rule-cases, check-sufficiency, benign-corpus and the
# shadow benign-linux-live capture) also run on every PR, with no path filter.
#
# Residual gap: a validator's `changes` detector keys on the SAME path list as the
# validator's `push: paths:`, so a PR that adds a technique directory NOT YET in that
# list is judged "not relevant" and its behavioral validation is skipped (the rule is
# still Sigma-compiled by the always-on `sigma-lint`). Keep each validator's
# `push: paths:` and its `changes`-job pattern list in sync when adding a technique,
# as the TRR flow does.
#
# Requirements: repository Actions permission must allow read/write workflow tokens
# (Settings -> Actions -> General -> Workflow permissions), and the `automerge` label
# must exist. No branch-protection or "Allow auto-merge" repo setting is needed.

on:
  workflow_run:
    workflows:
      - validate-detections
      - validate-apiserver-detections
      - validate-cloud-detections
      - validate-k8s-detections
      - validate-staticpod-detections
      - detection-quality
      - lint-trr
      - claude-code-review
    types: [completed]
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: automerge-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  automerge:
    name: automerge
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate the proof loop and merge when green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          LABEL: automerge
          EVENT: ${{ github.event_name }}
          PR_FROM_LABEL: ${{ github.event.pull_request.number }}
          SHA_FROM_RUN: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          # --- Resolve the candidate open PR(s) for this event --------------------
          if [ "$EVENT" = "pull_request_target" ]; then
            prs="$PR_FROM_LABEL"
          else
            # workflow_run: the PR(s) whose head commit is this run's head SHA.
            prs="$(gh api "repos/$REPO/commits/$SHA_FROM_RUN/pulls" \
                     --jq '.[] | select(.state=="open") | .number' 2>/dev/null || true)"
          fi
          if [ -z "${prs//[[:space:]]/}" ]; then
            echo "No candidate open PR for this event; nothing to do."
            exit 0
          fi

          for pr in $prs; do
            echo "::group::Evaluate PR #$pr"

            data="$(gh api "repos/$REPO/pulls/$pr")"
            state="$(jq -r '.state' <<<"$data")"
            draft="$(jq -r '.draft' <<<"$data")"
            base="$(jq -r '.base.ref' <<<"$data")"
            same_repo="$(jq -r '.head.repo.full_name == .base.repo.full_name' <<<"$data")"
            head_sha="$(jq -r '.head.sha' <<<"$data")"
            has_label="$(jq -r --arg l "$LABEL" 'any(.labels[]?; .name==$l)' <<<"$data")"

            [ "$state" = "open" ]     || { echo "skip: not open";        echo "::endgroup::"; continue; }
            [ "$draft" = "false" ]    || { echo "skip: draft";           echo "::endgroup::"; continue; }
            [ "$same_repo" = "true" ] || { echo "skip: fork PR";         echo "::endgroup::"; continue; }
            [ "$base" = "main" ]      || { echo "skip: base is $base";   echo "::endgroup::"; continue; }
            [ "$has_label" = "true" ] || { echo "skip: no '$LABEL' label"; echo "::endgroup::"; continue; }

            # --- Every review, all pages, read once (fail closed) ------------------
            # --slurp wraps all pages in one outer array, so the latest-review-per-
            # author below is computed across page breaks. gh rejects --slurp together
            # with --jq, so the pages are aggregated by the runner's standalone jq.
            if ! reviews="$(gh api --paginate --slurp "repos/$REPO/pulls/$pr/reviews" 2>/dev/null)"; then
              echo "skip: reviews unreadable"; echo "::endgroup::"; continue
            fi

            # --- A human reviewer's standing CHANGES_REQUESTED is a veto -----------
            # Any jq error defaults to the blocking value ("true").
            changes_requested="$(jq -r '
              add // []
              | [ .[] | select(.state=="CHANGES_REQUESTED" or .state=="APPROVED" or .state=="DISMISSED") ]
              | group_by(.user.login)
              | map(max_by(.submitted_at))
              | any(.[]?; .state=="CHANGES_REQUESTED")' <<<"$reviews" 2>/dev/null || echo "true")"
            [ "$changes_requested" = "false" ] || { echo "skip: changes requested"; echo "::endgroup::"; continue; }

            # --- Protected paths need a human sign-off on this head (rail 8) -------
            # One TSV line per changed file: filename, previous_filename (renames).
            if ! files="$(gh api --paginate "repos/$REPO/pulls/$pr/files" \
                            --jq '.[] | [.filename, (.previous_filename // "")] | @tsv' 2>/dev/null)"; then
              echo "skip: PR file list unreadable"; echo "::endgroup::"; continue
            fi
            changed_files="$(jq -r '.changed_files' <<<"$data")"
            listed="$(printf '%s' "$files" | grep -c . || true)"
            case "$changed_files" in
              ''|*[!0-9]*) echo "skip: changed_files unknown ($changed_files)"; echo "::endgroup::"; continue ;;
            esac
            if [ "$listed" -lt "$changed_files" ]; then
              # The files API stops at 3000 entries; an incomplete list cannot clear rail 8.
              echo "skip: listed $listed of $changed_files changed file(s)"; echo "::endgroup::"; continue
            fi
            protected="$(printf '%s\n' "$files" | tr '\t' '\n' | grep -E \
              '^(detections/benign/budgets\.json|detections/benign/slices/.+|detections/(check_sufficiency|rule_cases|sigma_explain|score_benign|benign_corpus)\.py|\.github/workflows/(detection-quality|automerge)\.yml)$' \
              | sort -u | paste -sd, - || true)"
            if [ -n "$protected" ]; then
              author="$(jq -r '.user.login' <<<"$data")"
              approvers="$(jq -r --arg sha "$head_sha" --arg author "$author" '
                add // []
                | [ .[] | select(.state=="CHANGES_REQUESTED" or .state=="APPROVED" or .state=="DISMISSED") ]
                | group_by(.user.login)
                | map(max_by(.submitted_at))
                | [ .[]
                    | select(.state == "APPROVED"
                             and .commit_id == $sha
                             and .user.type == "User"
                             and .user.login != $author
                             and (.author_association == "OWNER"
                                  or .author_association == "MEMBER"
                                  or .author_association == "COLLABORATOR"))
                    | .user.login ]
                | join(",")' <<<"$reviews" 2>/dev/null || true)"
              if [ -z "$approvers" ]; then
                echo "skip: touches protected path(s) $protected; a human must approve or merge"
                echo "::endgroup::"; continue
              fi
              echo "Protected path(s) $protected approved on $head_sha by: $approvers"
            fi

            # --- Every check run on the EXACT head SHA must be a pass --------------
            # Exclude only THIS workflow run's own check (match its run id in the
            # details_url), not any check that merely shares the name 'automerge'.
            runs="$(gh api --paginate "repos/$REPO/commits/$head_sha/check-runs" \
                      --jq '.check_runs[]
                            | select((.details_url // "") | contains("/runs/" + env.RUN_ID + "/") | not)
                            | [.status, (.conclusion // "")] | @tsv' 2>/dev/null || true)"
            total="$(printf '%s' "$runs" | grep -c . || true)"
            not_done="$(printf '%s\n' "$runs" | awk -F'\t' 'NF>0 && $1!="completed"{c++} END{print c+0}')"
            bad="$(printf '%s\n' "$runs" | awk -F'\t' \
                    'NF>0 && $1=="completed" && $2!="success" && $2!="neutral" && $2!="skipped"{c++} END{print c+0}')"

            if [ "$total" -lt 1 ]; then echo "skip: no check runs yet"; echo "::endgroup::"; continue; fi
            if [ "$not_done" -ne 0 ]; then echo "skip: $not_done check(s) still running"; echo "::endgroup::"; continue; fi
            if [ "$bad" -ne 0 ]; then echo "skip: $bad check(s) not successful"; echo "::endgroup::"; continue; fi

            # --- Legacy commit statuses (if any) must be success; fail closed ------
            status_json="$(gh api "repos/$REPO/commits/$head_sha/status" 2>/dev/null || true)"
            if [ -z "$status_json" ]; then echo "skip: commit status unreadable"; echo "::endgroup::"; continue; fi
            status_state="$(jq -r '.state' <<<"$status_json")"
            total_statuses="$(jq -r '.total_count' <<<"$status_json")"
            if [ "${total_statuses:-0}" -gt 0 ] && [ "$status_state" != "success" ]; then
              echo "skip: commit status is $status_state"; echo "::endgroup::"; continue
            fi

            # --- Mergeability must be CONFIRMED true (unknown holds) ---------------
            mergeable="$(jq -r '.mergeable' <<<"$data")"
            for _ in $(seq 1 10); do
              [ "$mergeable" = "null" ] || break
              sleep 3
              mergeable="$(gh api "repos/$REPO/pulls/$pr" --jq '.mergeable' 2>/dev/null || echo "null")"
            done
            [ "$mergeable" = "true" ] || { echo "skip: mergeable not confirmed ($mergeable)"; echo "::endgroup::"; continue; }

            # --- Re-read the label right before merging (honor a late veto) -------
            # gh's --jq takes no --arg, so list the label names and match them here;
            # any API error reads as "no labels" (fail closed).
            labels_now="$(gh api "repos/$REPO/pulls/$pr" --jq '.labels[]?.name' 2>/dev/null || true)"
            grep -Fxq -- "$LABEL" <<<"$labels_now" || { echo "skip: label removed"; echo "::endgroup::"; continue; }

            # --- All rails clear: squash-merge, guarded by the head SHA -----------
            echo "All checks green and rails clear; merging PR #$pr at $head_sha"
            if gh api -X PUT "repos/$REPO/pulls/$pr/merge" \
                 -f merge_method=squash -f sha="$head_sha" >/dev/null 2>&1; then
              echo "Merged PR #$pr."
            else
              echo "Merge was not applied (head moved, or a protection/permission gate). Leaving the PR open."
            fi
            echo "::endgroup::"
          done
