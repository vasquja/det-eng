name: automerge

# Enable GitHub's NATIVE auto-merge on a labeled pull request, so it lands
# automatically once branch protection is satisfied (all required checks green) --
# det-eng's "the proof decides what is done" model, applied to the merge, so an AI
# (or anyone) can drive a detection all the way to landed without a manual click.
#
# WHY NATIVE AUTO-MERGE (not a direct API merge): `main` is a protected branch, and a
# workflow's built-in GITHUB_TOKEN cannot merge directly into a protected branch --
# GitHub blocks GITHUB_TOKEN writes to protected refs unless the bot is a ruleset
# bypass actor (a deliberate guard so workflows can't circumvent branch protection).
# But ENABLING native auto-merge is allowed, and GitHub's own auto-merge then performs
# the merge when the required checks pass, honoring branch protection -- no bypass, no
# PAT, enforcement fully intact. The repo must have "Allow auto-merge" enabled (it is).
#
# SAFETY RAILS (checked before enabling; every gate fails CLOSED):
#   1. `automerge` label -- the per-PR opt-in (addable only by a collaborator with
#      triage/write). Removing it DISABLES auto-merge (the veto).
#   2. Same-repo only: fork PRs are never touched (head.repo != base.repo).
#   3. Open, not a draft, base branch is `main`.
#   4. No reviewer's latest review is CHANGES_REQUESTED. Because the ruleset requires
#      0 approvals, GitHub would not otherwise honor that veto, so a CHANGES_REQUESTED
#      review arriving later DISABLES auto-merge (the pull_request_review trigger).
#   5. No merge conflict (`mergeable != false`).
# GitHub enforces the required status checks itself before the auto-merge fires, so
# this workflow does not re-scan them. Squash keeps `main`'s required linear history.
#
# The label/review paths use `pull_request_target` / `pull_request_review`, which run
# THIS file from base (main) with a write token and never check out or run PR code;
# nothing from the event is interpolated into the shell (values come via env:).
#
# Requirements (one-time): "Allow auto-merge" on the repo; Actions workflow permissions
# read/write; the `automerge` label exists; and (for a green-but-behind PR to land)
# the `main` ruleset's "Require branches to be up to date before merging" off.

on:
  pull_request_target:
    types: [labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed, edited]

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Keyed by PR and action so a disable (unlabel / review) run is never
  # superseded-cancelled by an enable (label) run for the same PR.
  group: automerge-${{ github.event.pull_request.number }}-${{ github.event.action }}
  cancel-in-progress: false

jobs:
  automerge:
    name: automerge
    runs-on: ubuntu-latest
    steps:
      - name: Enable or disable native auto-merge from the label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          LABEL: automerge
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          PR_NUM: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          disable_am() { gh pr merge "$PR_NUM" --disable-auto -R "$REPO" >/dev/null 2>&1; }

          # standing_changes_requested: true if the latest review per author is
          # CHANGES_REQUESTED. Fails CLOSED (any API error -> "true").
          standing_changes_requested() {
            gh api --paginate --slurp "repos/$REPO/pulls/$PR_NUM/reviews" --jq '
              add
              | [ .[] | select(.state=="CHANGES_REQUESTED" or .state=="APPROVED" or .state=="DISMISSED") ]
              | group_by(.user.login)
              | map(max_by(.submitted_at))
              | any(.[]?; .state=="CHANGES_REQUESTED")' 2>/dev/null || echo "true"
          }

          # --- Label removed -> disable auto-merge (the veto) ------------------
          if [ "$EVENT" = "pull_request_target" ] && [ "$ACTION" = "unlabeled" ]; then
            if [ "$LABEL_NAME" = "$LABEL" ]; then
              if disable_am; then echo "Label removed; auto-merge disabled on #$PR_NUM."
              else echo "Label removed; auto-merge was not enabled on #$PR_NUM (or already merged)."; fi
            fi
            exit 0
          fi

          data="$(gh api "repos/$REPO/pulls/$PR_NUM")"
          has_label="$(jq -r 'any(.labels[]?; .name==env.LABEL)' <<<"$data")"

          # --- A review arrived -> honor a standing CHANGES_REQUESTED veto -----
          if [ "$EVENT" = "pull_request_review" ]; then
            [ "$has_label" = "true" ] || { echo "Review on #$PR_NUM but no '$LABEL' label; nothing to do."; exit 0; }
            if [ "$(standing_changes_requested)" = "true" ]; then
              if disable_am; then echo "Standing CHANGES_REQUESTED on #$PR_NUM; auto-merge disabled."
              else echo "CHANGES_REQUESTED on #$PR_NUM; auto-merge was not enabled."; fi
            else
              echo "No standing CHANGES_REQUESTED on #$PR_NUM; leaving auto-merge as-is."
            fi
            exit 0
          fi

          # --- A labeled event for some other label is not ours ---------------
          if [ "$ACTION" = "labeled" ] && [ "$LABEL_NAME" != "$LABEL" ]; then
            echo "Label '$LABEL_NAME' is not '$LABEL'; nothing to do."; exit 0
          fi

          # --- Rails before enabling auto-merge (all fail closed) -------------
          state="$(jq -r '.state' <<<"$data")"
          draft="$(jq -r '.draft' <<<"$data")"
          base="$(jq -r '.base.ref' <<<"$data")"
          same_repo="$(jq -r '.head.repo.full_name == .base.repo.full_name' <<<"$data")"
          [ "$state" = "open" ]     || { echo "skip: not open";          exit 0; }
          [ "$draft" = "false" ]    || { echo "skip: draft";             exit 0; }
          [ "$same_repo" = "true" ] || { echo "skip: fork PR";           exit 0; }
          [ "$base" = "main" ]      || { echo "skip: base is $base";     exit 0; }
          [ "$has_label" = "true" ] || { echo "skip: no '$LABEL' label"; exit 0; }
          [ "$(standing_changes_requested)" = "false" ] || { echo "skip: changes requested"; exit 0; }

          # No merge conflict (unknown -> retry; only a confirmed conflict blocks).
          mergeable="$(jq -r '.mergeable' <<<"$data")"
          for _ in $(seq 1 10); do
            [ "$mergeable" = "null" ] || break
            sleep 3
            mergeable="$(gh api "repos/$REPO/pulls/$PR_NUM" --jq '.mergeable' 2>/dev/null || echo "null")"
          done
          [ "$mergeable" != "false" ] || { echo "skip: merge conflict"; exit 0; }

          # --- Enable native auto-merge; GitHub merges when the checks pass ----
          echo "Rails clear; enabling native auto-merge (squash) on #$PR_NUM."
          if out="$(gh pr merge "$PR_NUM" --auto --squash -R "$REPO" 2>&1)"; then
            echo "Auto-merge enabled on #$PR_NUM; GitHub will squash-merge it once the required checks pass."
          else
            # Most common benign case: the PR is already fully mergeable, so GitHub
            # rejects "enable auto-merge" (nothing to wait for). We cannot direct-merge
            # a protected branch with GITHUB_TOKEN, so surface it rather than hide it.
            echo "::warning title=automerge::Could not enable auto-merge on #$PR_NUM (already mergeable, or auto-merge not allowed): $out"
          fi
