name: lint-trr

# Structural/semantic lint for Technique Research Reports under research/.
# Checks required sections and their order, the Metadata table, procedure-ID
# format (TRRID.PLATFORM.LETTER), that every procedure has a Detection Data
# Model PNG rendered from the DDM JSON beside it (hash-checked, no browser),
# that DDM JSON parses, and that research/index.json agrees with each report.
# Pure stdlib Python — no dependencies, fully offline, deterministic.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  # Weekly regression: re-run even when nothing changed (the runner image and its
  # Python move underneath the lint).
  schedule:
    - cron: '11 6 * * 1'

permissions:
  contents: read

jobs:
  trr-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Lint TRRs
        # `shell: bash` is necessary. Without it GitHub runs `bash -e`, with no
        # `pipefail`: the exit code of the step is that of `tee`, and a failed lint
        # shows as a green check.
        shell: bash
        run: python3 .github/scripts/trr_lint.py | tee /tmp/trr-lint.out

      - name: Publish results to job summary
        if: always()
        run: |
          {
            echo '## TRR lint (format + Detection Data Models)'
            echo ''
            echo '```'
            cat /tmp/trr-lint.out 2>/dev/null || echo '(no output captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Proves the cloud emulation scripts with stub CLIs: dry mode makes no cloud call
  # and exits 0 for each valid procedure letter, LIVE mode runs the exact command
  # sequence the tests hold, and a failed command or a stop signal runs the undo
  # command of each change made before it. A stub cannot prove what a provider accepts (that is
  # checked against the provider reference when a script is written). No cloud
  # account and no network: the stubs stand in for gcloud, az, aws and curl.
  emulation-scripts:
    name: emulation-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Test the cloud emulation scripts (stub CLIs, no cloud call)
        run: python3 -B -m unittest discover -s atomics/tests -v
