name: claude-code-review

# Automated pull-request review by Claude Code (anthropics/claude-code-action).
# Runs the `code-review` plugin on each PR and posts findings as inline
# comments. Authenticates with a Claude subscription via the
# CLAUDE_CODE_OAUTH_TOKEN repository secret (generate with `claude setup-token`).
# The Claude GitHub App (https://github.com/apps/claude) must be installed on
# this repository. Until both are in place, the job fails with an auth error.
#
# On public repositories GitHub withholds secrets from fork-PR runs, so the
# review runs only on PRs from branches in this repository.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
