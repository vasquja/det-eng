# TEMPORARY diagnostic. This branch is not for merge and is deleted after the run.
# Question: the static pod lab adds its auditd watch in the same step that installs and
# starts auditd. On ubuntu-26.04 the watch recorded nothing. Is the rule removed after
# the step's own check (for example by audit-rules.service, which loads the rule files)?
name: diag-audit-dir-watch
on:
  push:
    branches: [claude/diag-audit-dir-watch]
permissions:
  contents: read
jobs:
  sensor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: The sensor step, as in validate-staticpod-detections.yml
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/apt_install.sh auditd
          sudo systemctl start auditd || sudo service auditd start
          mkdir -p "${GITHUB_WORKSPACE}/.kind/trr9003-manifests"
          sudo auditctl -a always,exit -F dir="${GITHUB_WORKSPACE}/.kind/trr9003-manifests" -F perm=wa -F key=k8s_node_file
          rules="$(sudo auditctl -l)"
          grep -qF k8s_node_file <<<"${rules}" || { echo "::error::auditd watch not set"; exit 1; }
          echo "t=${EPOCHREALTIME} rules right after the add: ${rules}"

      - name: Watch the rule list for 40 seconds
        shell: bash
        run: |
          for i in $(seq 1 20); do
            echo "t=${EPOCHREALTIME} rules: $(sudo auditctl -l | tr '\n' ';')"
            sleep 2
          done
          echo host > "${GITHUB_WORKSPACE}/.kind/trr9003-manifests/host-write.yaml"
          sleep 2
          echo "records with the key: $(sudo grep -c 'key="k8s_node_file"' /var/log/audit/audit.log || true)"

      - name: What changed the rules
        shell: bash
        run: |
          echo "--- CONFIG_CHANGE records:"
          sudo grep -E 'type=CONFIG_CHANGE' /var/log/audit/audit.log | cut -c1-260 || true
          echo "--- units:"
          systemctl list-unit-files 'audit*' --no-pager || true
          systemctl show audit-rules.service -p ActiveState -p SubState -p ExecMainStartTimestamp -p ExecMainExitTimestamp -p Result --no-pager || true
          systemctl show auditd.service -p ActiveState -p SubState -p ExecMainStartTimestamp --no-pager || true
          echo "--- unit files:"
          systemctl cat audit-rules.service --no-pager 2>/dev/null || echo "(no audit-rules.service)"
          systemctl cat auditd.service --no-pager 2>/dev/null || true
          echo "--- journal:"
          sudo journalctl -u audit-rules.service -u auditd.service --no-pager -o short-precise 2>/dev/null | tail -40 || true
          echo "--- rule files:"
          sudo sh -c 'for f in /etc/audit/audit.rules /etc/audit/rules.d/*.rules; do echo "== $f"; cat "$f"; done' || true
          echo "--- now: ${EPOCHREALTIME}"
