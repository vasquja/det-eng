name: detection-quality

# The quality layers that sit beside the per-platform validators:
#
#   rule-cases         every positive / near-miss / filtered / confounder / benign case
#                      stored next to a rule (detections/sigma/<T>/<stem>.cases.jsonl)
#                      runs through the same pySigma backend as the validators, and
#                      each declared `breaks` must really be the single flip that
#                      would fire the rule (detections/rule_cases.py). Hard gate.
#   check-sufficiency  every rule must ship a positive and at least one VERIFIED
#                      near-miss or filtered negative (a near-miss shares the
#                      chokepoint and fails one required argument, for a correlation
#                      an argument of each base), unless a human waived that for a
#                      one-item presence rule (PRESENCE in check_sufficiency.py, which
#                      then only warns); and no rule may key on an emulation marker
#                      (detections/check_sufficiency.py). Hard gate.
#   sufficiency-ratchet  PULL REQUESTS ONLY. Two comparisons with the base branch,
#                      each failing this job, so automerge holds and a human decides:
#                      1. The base branch's own check_sufficiency.py reports the base
#                      tree (--json), and the head runs with --baseline. It fails when
#                      a rule loses verified negatives, exercised items, passing
#                      positives or its sidecar, or changes its logsource; when a base
#                      rule is missing from the head (deleted or renamed); and when any
#                      base sidecar case (any kind) is gone or has changed kind,
#                      breaks or events, or a verified negative (a case or a fixture
#                      record) is gone or changed. Rewording a case's why or source
#                      passes. Sidecar cases and fixtures are content, so without it
#                      a PR could delete or weaken negatives and merge on its own.
#                      Skipped (success) when the base has no check_sufficiency.py.
#                      2. The head's score_benign.py --baseline-scores compares the
#                      head's live benign scores with the base's committed
#                      detections/benign/scores.json: a rule scored on both sides that
#                      raises more hits fails, even inside its budget's headroom (a
#                      rule and scores.json are content, so without it a broadened rule
#                      would merge on its own); fewer hits pass. A rule absent from the
#                      base is new, and its budget alone governs it. Skipped (success,
#                      with a notice) when the base has no scores.json.
#                      Any other error, or an unreadable base scores.json, fails it.
#   benign-corpus      every rule scored against the committed benign corpus
#                      (detections/score_benign.py): the snapshot scores.json must be
#                      current, and a rule in `enforce` mode (every per-rule entry
#                      today) must stay within its budget. Shadow-mode overruns only
#                      warn.
#   benign-linux-live  SHADOW. A real Ubuntu runner runs ordinary admin, developer
#                      and service activity under the det-eng audit rules
#                      (detections/benign/linux/), and every Linux rule is scored on
#                      the capture. What a rule matches never fails this job; the
#                      capture is uploaded so a human can promote a sanitized copy
#                      into a recorded slice.
#
# No paths: filter on pull_request, so these checks ALWAYS report on a PR: automerge
# waits for every check run on the head commit. They are meant to be required checks
# in the main ruleset too, which is not configured yet (see detections/benign/README.md,
# "Branch protection: what binds a manual merge").
# The weekly schedule re-proves every rule even when nothing in the repo changed
# (pySigma, the runner image and the kernel drift underneath the rules).

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '53 6 * * 1'

permissions:
  contents: read

jobs:
  rule-cases:
    name: rule-cases
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install requirements
        run: pip install --quiet -r detections/requirements.txt

      - name: Run the cases stored next to every rule
        shell: bash
        run: |
          # shell: bash enables pipefail, so tee does not mask the exit code.
          python3 detections/rule_cases.py | tee /tmp/rule-cases.out

      - name: Publish results to job summary
        if: always()
        shell: bash
        run: |
          # shellcheck disable=SC2016  # the backticks are Markdown, not substitutions
          {
            echo '## Rule cases (positive, near-miss, filtered, confounder, benign)'
            echo ''
            echo 'Each negative must be the single item flip it declares (`breaks`), not merely a non-match.'
            echo ''
            echo '```'
            cat /tmp/rule-cases.out 2>/dev/null || echo '(no output captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  check-sufficiency:
    name: check-sufficiency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install requirements
        run: pip install --quiet -r detections/requirements.txt

      - name: Check that every rule's checks are sufficient
        shell: bash
        run: |
          python3 detections/check_sufficiency.py --markdown "$GITHUB_STEP_SUMMARY" \
            | tee /tmp/sufficiency.out

      - name: Publish the full log to job summary
        if: always()
        shell: bash
        run: |
          {
            echo ''
            echo '<details><summary>check_sufficiency.py output</summary>'
            echo ''
            echo '```'
            cat /tmp/sufficiency.out 2>/dev/null || echo '(no output captured)'
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

  sufficiency-ratchet:
    # PR only: compare the head with the base branch. The sufficiency report of each
    # side comes from its own copy of check_sufficiency.py; the benign scores are
    # the head's live scores against the base's committed scores.json (data only).
    # Fails closed: a base SHA that cannot be checked out, a base run that writes no
    # report, or an unreadable base scores.json fails the job.
    name: sufficiency-ratchet
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Report the base branch with its own check_sufficiency.py
        id: base
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$RUNNER_TEMP/base-tree"
          git worktree add --detach "$base" "$BASE_SHA"
          if [ ! -f "$base/detections/check_sufficiency.py" ]; then
            echo "::notice title=sufficiency-ratchet::the base ($BASE_SHA) has no detections/check_sufficiency.py; nothing to ratchet against"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pip install --quiet -r "$base/detections/requirements.txt"
          rm -f "$RUNNER_TEMP/base.json"
          # The base gate may itself fail (exit 1): its report still counts. A run
          # that writes no report fails here, and a report with no rule fails the
          # head's --baseline step.
          python3 "$base/detections/check_sufficiency.py" --json "$RUNNER_TEMP/base.json" \
            > "$RUNNER_TEMP/base.out" 2>&1 || true
          if [ ! -s "$RUNNER_TEMP/base.json" ]; then
            echo "::error title=sufficiency-ratchet::the base's check_sufficiency.py wrote no report"
            cat "$RUNNER_TEMP/base.out"
            exit 1
          fi
          tail -n 1 "$RUNNER_TEMP/base.out"
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Install requirements (head)
        if: steps.base.outputs.present == 'true'
        run: pip install --quiet -r detections/requirements.txt

      - name: Fail on any rule that lost or changed checks against the base
        if: steps.base.outputs.present == 'true'
        shell: bash
        run: |
          # The head's gate runs too (it fails on its own failures as well); the
          # ratchet section at the end of the output says what decreased.
          rc=0
          python3 detections/check_sufficiency.py --baseline "$RUNNER_TEMP/base.json" \
            > /tmp/ratchet.out 2>&1 || rc=$?
          cat /tmp/ratchet.out
          {
            echo '## Sufficiency ratchet (vs the base branch)'
            echo ''
            echo '```'
            sed -n '/^Ratchet against/,$p' /tmp/ratchet.out
            echo '```'
            echo ''
            echo '<details><summary>check_sufficiency.py --baseline output</summary>'
            echo ''
            echo '```'
            cat /tmp/ratchet.out
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Fail on any rule noisier on the benign corpus than on the base
        # Runs even when the step above failed, so the summary shows both.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          base="$RUNNER_TEMP/base-tree"
          if [ ! -e "$base/.git" ]; then
            echo "::error title=sufficiency-ratchet::the base tree was not checked out"
            exit 1
          fi
          if [ ! -e "$base/detections/benign/scores.json" ]; then
            echo "::notice title=sufficiency-ratchet::the base has no detections/benign/scores.json; no benign scores to ratchet against"
            exit 0
          fi
          # The base snapshot is data; only the head's code runs. (The head's
          # requirements are already installed when the base had check_sufficiency.py.)
          pip install --quiet -r detections/requirements.txt
          rc=0
          python3 detections/score_benign.py --examples 0 \
            --baseline-scores "$base/detections/benign/scores.json" \
            > /tmp/benign-ratchet.out 2>&1 || rc=$?
          cat /tmp/benign-ratchet.out
          {
            echo '## Benign-score ratchet (vs the base branch)'
            echo ''
            echo 'A rule that raises more benign hits than in the scores.json of the base branch fails, even inside its budget.'
            echo ''
            echo '```'
            if grep -q '^Benign ratchet against' /tmp/benign-ratchet.out; then
              sed -n '/^Benign ratchet against/,$p' /tmp/benign-ratchet.out
            else
              cat /tmp/benign-ratchet.out
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  benign-corpus:
    name: benign-corpus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install requirements
        run: pip install --quiet -r detections/requirements.txt

      - name: Score every rule against the benign corpus
        shell: bash
        run: |
          # --check: scores.json must match the current rules and corpus.
          # --enforce: an enforce-mode rule over its budget fails; shadow-mode warns.
          python3 detections/score_benign.py --check --enforce \
            --markdown "$GITHUB_STEP_SUMMARY" | tee /tmp/benign.out

      - name: Publish the full log to job summary
        if: always()
        shell: bash
        run: |
          {
            echo ''
            echo '<details><summary>score_benign.py output (explained example hits)</summary>'
            echo ''
            echo '```'
            cat /tmp/benign.out 2>/dev/null || echo '(no output captured)'
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

  benign-linux-live:
    # SHADOW: what a rule matches on the live capture never fails this job. It fails
    # only when the capture itself is broken (auditd unavailable, or no det-eng
    # records reached the log), the same infrastructure validate-detections needs.
    name: benign-linux-live
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install scorer requirements
        run: pip install --quiet -r detections/requirements.txt

      - name: Install audit, build tools, the workload's tools and the capture venv
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y auditd gcc python3-venv
          # The workload's tools. A package this image lacks only skips its workload
          # step (workload.sh checks for each tool), so a miss is a notice, not a failure.
          tools="tcpdump gdb strace ltrace mtr-tiny iputils-arping iputils-tracepath
                 cryptsetup-bin keyutils fio make git curl linux-tools-common
                 linux-tools-$(uname -r)"
          # shellcheck disable=SC2086  # word-split the package list on purpose
          if ! sudo apt-get install -y $tools; then
            for pkg in $tools; do
              sudo apt-get install -y "$pkg" >/dev/null 2>&1 \
                || echo "::notice title=benign-linux-live::package $pkg not installed; its workload step will skip"
            done
          fi
          # A venv on the SYSTEM Python runs cleanly under sudo (no LD_LIBRARY_PATH
          # needed, unlike the setup-python interpreter), as in validate-detections.
          /usr/bin/python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet -r detections/requirements.txt

      - name: Start auditd (room for the whole capture window)
        shell: bash
        run: |
          # A busy runner under the det-eng rules (ioctl, setsockopt, pipe2 from every
          # process) writes far more than the validator's short windows: give the log
          # room so it does not rotate mid-capture, and the kernel a deeper backlog.
          sudo sed -i -E 's/^\s*max_log_file\s*=.*/max_log_file = 512/' /etc/audit/auditd.conf
          sudo systemctl start auditd || sudo service auditd start
          # auditd re-reads auditd.conf on SIGHUP (its unit may refuse a manual restart).
          sudo pkill -HUP -x auditd || true
          sudo auditctl -b 32768 || true
          sudo auditctl -s

      - name: Capture the benign workload under the det-eng audit rules
        shell: bash
        run: |
          # --require-audit: a broken audit setup fails instead of passing silently.
          sudo /tmp/venv/bin/python detections/benign/linux/capture.py \
            --out /tmp/linux-benign.jsonl --require-audit \
            --summary-json /tmp/linux-benign-summary.json | tee /tmp/linux-capture.out

      - name: Score every Linux rule on the capture (shadow)
        shell: bash
        run: |
          # Shadow: hits are reported (and annotated as warnings), never enforced. Even
          # a scorer error only warns here; the benign-corpus job gates the scorer.
          python3 detections/score_benign.py \
            --extra-slice /tmp/linux-benign.jsonl \
            --extra-logsource linux/auditd \
            --extra-label ubuntu-runner-workload \
            --markdown "$GITHUB_STEP_SUMMARY" | tee /tmp/linux-score.out \
            || echo "::warning title=benign-linux-live::score_benign.py exited non-zero on the live capture; see the log"

      - name: Publish the capture summary to job summary
        if: always()
        shell: bash
        run: |
          # shellcheck disable=SC2016  # the backticks are Markdown, not substitutions
          {
            echo ''
            echo '## Live Linux benign capture (ubuntu-latest runner, shadow)'
            echo ''
            echo 'Ordinary admin, developer and service activity (`detections/benign/linux/workload.sh`)'
            echo 'under the det-eng audit rules. The capture is uploaded as the `linux-benign-capture`'
            echo 'artifact; a human may sanitize it and promote it into a recorded slice.'
            echo ''
            echo '<details><summary>capture.py output (per-syscall and per-exe counts)</summary>'
            echo ''
            echo '```'
            cat /tmp/linux-capture.out 2>/dev/null || echo '(no output captured)'
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-benign-capture
          path: |
            /tmp/linux-benign.jsonl
            /tmp/linux-benign-summary.json
            /tmp/linux-capture.out
            /tmp/linux-score.out
          if-no-files-found: warn
          retention-days: 30
