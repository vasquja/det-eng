name: validate-staticpod-detections
# A dispatch with a label (the weekly k8s-version-matrix.yml driver) puts the label in
# the run name, so the driver can find its own run. Every other run keeps the default
# name (an empty run-name). The job and check names do not change.
run-name: ${{ inputs.label && format('{0} [{1}]', github.workflow, inputs.label) || '' }}

# Proves the TRR9003 (static pod, T1543.005) loop on a real Kubernetes cluster,
# with one rule per sensor:
#   - Strategy 1 (chokepoint), node runtime sensor: the kubelet starts a pod with
#     config.source=file (Procedure A, on the control plane) or config.source=http
#     (Procedure B, live on the worker) -> CRI pod sandbox record -> the CRI Sigma
#     rule fires.
#   - Strategy 2 (fallback), API server audit log: the kubelet registers a
#     mirror pod -> `create pods` by a node identity -> the audit rule fires.
#   - Strategy 3, node file sensor (the runner's auditd, a write watch on the
#     static-pod directory): Procedure A writes its manifest through a marked copy
#     of tee -> a linux/file_event record -> the file-event rule fires; the rule
#     must match none of kubeadm's own control-plane manifest writes.
# The evasion variant (an invalid-namespace static pod) runs on the node with no
# pod object in the API; the CRI rule must catch it, which closes that gap.
#
# A kind cluster (Kubernetes in Docker; a control-plane node and a worker node)
# runs on the ubuntu-latest runner with API server audit logging on, and a small
# CRI poller on each node stands in for a runtime security agent
# (detections/k8s/cri-pod-sensor.sh). Procedure B runs live on the worker
# (TRR9003_RECONFIGURE=1): it sets staticPodURL, restarts the worker kubelet, and
# restores it. The job runs the
# benign emulation (a harmless busybox static pod), collects the three logs, and
# asserts each rule matches the emulation's own records. The CRI and audit rules also
# match the control-plane static pods by design, so as a negative control the job runs the
# validator on logs captured BEFORE the emulation, where no rule may pass. On a
# public repo the run is free.

on:
  push:
    branches: [ main ]
    paths:
      - 'detections/k8s/audit-policy-staticpod.yaml'
      - 'detections/k8s/kind-staticpod-cluster.yaml'
      - 'detections/k8s/cri-pod-sensor.sh'
      - 'detections/k8s/auditd_file_events.py'
      - 'detections/sigma/T1543.005/**'
      - 'detections/validate_staticpod_detections.py'
      - 'detections/sigma_eval.py'
      - 'detections/sigma_explain.py'
      - 'detections/requirements.txt'
      - 'atomics/T1543.005/**'
      - '.github/workflows/validate-staticpod-detections.yml'
  # PRs always trigger (no paths: filter) so the required `validate-staticpod`
  # check ALWAYS reports. The `changes` job decides from the diff whether the heavy
  # job runs; a skip on an unrelated PR counts as success. Push to main stays filtered.
  pull_request:
  # The inputs let the weekly version matrix (k8s-version-matrix.yml) run these same
  # steps on another Kubernetes minor. An empty input keeps the pin in env below, and
  # push, pull_request and schedule runs always use the pins.
  workflow_dispatch:
    inputs:
      node_image:
        description: 'kindest/node image as name:vX.Y.Z@sha256:<digest> (empty: the pin)'
        required: false
        default: ''
        type: string
      kubectl_version:
        description: 'kubectl version as vX.Y.Z, with kubectl_sha256 (empty: the pin)'
        required: false
        default: ''
        type: string
      kubectl_sha256:
        description: 'sha256 of that kubectl linux/amd64 binary, from dl.k8s.io (empty: the pin)'
        required: false
        default: ''
        type: string
      label:
        description: 'Label for the run name (the version matrix finds its run by it)'
        required: false
        default: ''
        type: string
  # Weekly regression: re-prove every rule even when no file in the paths above
  # changed (pySigma, the runner image, kind and the kernel drift underneath).
  # A schedule event has no PR base, so the `changes` job decides relevant=true.
  schedule:
    - cron: '43 6 * * 1'

permissions:
  contents: read

env:
  # Pinned Kubernetes for the kind cluster, the same in validate-k8s, validate-staticpod
  # and validate-apiserver. Bump it every quarter, and before the pinned minor reaches
  # end of life (v1.36: 2027-06-28): take the newest kind release, a kindest/node image
  # that release publishes (by digest), and kubectl of the same minor; update the
  # versions, the digest and both checksums in all three workflows, and the --image in
  # the create commands of detections/k8s/kind-*.yaml. Next bump due by 2027-01-20.
  # Kubernetes v1.36.5 is released, but kind has not published a kindest/node image for
  # it yet; the maintainer chose to pin v1.36.4 until it does.
  # A workflow_dispatch can replace the node image and kubectl (the inputs above, for
  # the version matrix); the pins below stay the only values for every other event.
  # When the pin moves, also move the legs of .github/workflows/k8s-version-matrix.yml
  # to the previous and the next minor that the new kind release publishes (image by
  # digest from its release notes; kubectl version and .sha256 from dl.k8s.io).
  # Then update the version sentences in detections/README.md (the matrix paragraph
  # and the Kubernetes version notes) and the Version notes of TRR9002, TRR9006 and
  # TRR9009 (research/trr90NN/k8s/README.md).
  KIND_VERSION: v0.33.0
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
  KIND_NODE_IMAGE: ${{ inputs.node_image || 'kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed' }}
  KUBE_SERVER_VERSION: v1.36.4
  KUBECTL_VERSION: ${{ inputs.kubectl_version || 'v1.36.4' }}
  KUBECTL_SHA256: ${{ inputs.kubectl_sha256 || '8b8f088da2dab964f853b38464033b1be15ede2839eca751482357c45abdd05a' }}
  CLUSTER_NAME: trr9003

jobs:
  changes:
    name: changes-staticpod
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.f.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ]; then
            echo "Non-PR event; running the validator."
            echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Exact file paths, or directory prefixes ending in '/'. Mirror of the
          # push: paths: list above (keep the two in sync when adding a technique).
          patterns=$(printf '%s\n' \
            'detections/k8s/audit-policy-staticpod.yaml' \
            'detections/k8s/kind-staticpod-cluster.yaml' \
            'detections/k8s/cri-pod-sensor.sh' \
            'detections/k8s/auditd_file_events.py' \
            'detections/sigma/T1543.005/' \
            'detections/validate_staticpod_detections.py' \
            'detections/sigma_eval.py' \
            'detections/sigma_explain.py' \
            'detections/requirements.txt' \
            'atomics/T1543.005/' \
            '.github/workflows/validate-staticpod-detections.yml')
          if ! changed="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" 2>/dev/null)"; then
            echo "git diff failed; running the validator to be safe."
            echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          relevant=false
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            while IFS= read -r pat; do
              [ -n "$pat" ] || continue
              if [ "${pat%/}" != "$pat" ]; then
                case "$file" in "$pat"*) relevant=true; break 2 ;; esac
              else
                [ "$file" = "$pat" ] && { relevant=true; break 2; }
              fi
            done <<< "$patterns"
          done <<< "$changed"
          echo "Changed files vs base:"; printf '%s\n' "$changed"
          echo "relevant=$relevant"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  validate:
    name: validate-staticpod
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    env:
      # Each emulated procedure appends one line (its window + exit status); the
      # validator binds each procedure gate to its window (--ledger). Job-level so
      # the emulate and validate steps share it; the version pins stay in the
      # workflow-level env block above.
      DETENG_LEDGER: /tmp/emulation-ledger.jsonl
      # The only image the static pods run, loaded into the node before use so a
      # Docker Hub hiccup inside the node cannot flake a pod start.
      LAB_IMAGES: busybox:1.36
      # Run Procedure B live (reconfigure the WORKER kubelet's staticPodURL), not the
      # read-only demonstration. The atomic serves the manifest from the runner on the
      # kind bridge gateway and restarts the worker kubelet (never the control plane).
      # The worker is ${CLUSTER_NAME}-worker = trr9003-worker, the TRR9003_WORKER
      # default of both emulate.sh and the validator.
      TRR9003_RECONFIGURE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install validator requirements
        run: pip install --quiet -r detections/requirements.txt

      - name: Install kind and kubectl (pinned)
        shell: bash
        env:
          IN_KUBECTL_VERSION: ${{ inputs.kubectl_version }}
          IN_KUBECTL_SHA256: ${{ inputs.kubectl_sha256 }}
        run: |
          set -euo pipefail
          # A dispatch can replace the pins (inputs). Give kubectl_version and
          # kubectl_sha256 together, and check each value's form before use.
          if [ -n "${IN_KUBECTL_VERSION}${IN_KUBECTL_SHA256}" ] \
             && { [ -z "${IN_KUBECTL_VERSION}" ] || [ -z "${IN_KUBECTL_SHA256}" ]; }; then
            echo "::error::give the inputs kubectl_version and kubectl_sha256 together"
            exit 1
          fi
          image_re='^[a-z0-9._:/-]+:v[0-9]+\.[0-9]+\.[0-9]+@sha256:[0-9a-f]{64}$'
          [[ "${KIND_NODE_IMAGE}" =~ ${image_re} ]] \
            || { echo "::error::node image '${KIND_NODE_IMAGE}' is not name:vX.Y.Z@sha256:<64 hex>"; exit 1; }
          [[ "${KUBECTL_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::kubectl version '${KUBECTL_VERSION}' is not vX.Y.Z"; exit 1; }
          [[ "${KUBECTL_SHA256}" =~ ^[0-9a-f]{64}$ ]] \
            || { echo "::error::kubectl sha256 '${KUBECTL_SHA256}' is not 64 hex digits"; exit 1; }
          curl -fsSLo ./kind \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  ./kind" | sha256sum -c -
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
          curl -fsSLo ./kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  ./kubectl" | sha256sum -c -
          chmod +x ./kubectl && sudo mv ./kubectl /usr/local/bin/kubectl
          kind version
          kubectl version --client

      - name: Start the node file-event sensor (auditd, Strategy 3)
        # Before the cluster exists, so the file log also holds kubeadm's own
        # control-plane manifest writes, which the file control tests the rule on. A
        # failure here must not stop the other sensors' gates: the file gate and the
        # file control fail closed without this sensor (no event -> MISS / FAILED).
        id: filesensor
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # Stand-in for a node file-integrity / EDR sensor: the runner's auditd (the
          # kind node is a container on the runner's kernel, and audit is not
          # namespaced, so the host auditd records the node's syscalls). Install it the
          # same way validate-detections.yml does on this runner image.
          sudo apt-get update
          sudo apt-get install -y auditd
          sudo systemctl start auditd || sudo service auditd start
          # The kubelet static-pod directory is bind-mounted from this host path
          # (kind-staticpod-cluster.yaml extraMount: the relative ./.kind/trr9003-manifests,
          # which kind resolves against the checkout, the working directory of the
          # create step). It is in the checkout, not in world-writable /tmp, because the
          # kubelet runs every manifest in it on a privileged node. Watch it for writes
          # and attribute changes. auditctl needs the absolute path. -F dir= is a
          # recursive tree watch (auditctl makes the same rule from -w on a directory);
          # -F dir= makes that explicit. A bind mount shares the directory's inodes, so
          # writes made through the node's mount are seen.
          mkdir -p "${GITHUB_WORKSPACE}/.kind/trr9003-manifests"
          sudo auditctl -a always,exit -F dir="${GITHUB_WORKSPACE}/.kind/trr9003-manifests" -F perm=wa -F key=k8s_node_file
          rules="$(sudo auditctl -l)"
          grep -qF k8s_node_file <<<"${rules}" || { echo "::error::auditd watch not set"; exit 1; }

      - name: Create kind cluster with audit logging
        id: cluster
        shell: bash
        run: |
          # The node file-event sensor (C2-7) bind-mounts the kubelet static-pod
          # directory to this host path in the checkout (kind-staticpod-cluster.yaml
          # extraMount), so the runner's auditd can watch it. Create it first so the
          # bind source exists and the runner user owns it (else Docker makes it as root).
          mkdir -p .kind/trr9003-manifests
          # Run from the repo root so the relative extraMounts paths resolve.
          kind create cluster \
            --name "${CLUSTER_NAME}" \
            --image "${KIND_NODE_IMAGE}" \
            --config detections/k8s/kind-staticpod-cluster.yaml \
            --wait 150s

      - name: Confirm the pinned Kubernetes version
        shell: bash
        env:
          IN_NODE_IMAGE: ${{ inputs.node_image }}
        run: |
          set -euo pipefail
          want="${KUBE_SERVER_VERSION}"; what="the pin"
          if [ -n "${IN_NODE_IMAGE}" ]; then
            # A dispatch with another node image: the image tag names the version.
            ref="${KIND_NODE_IMAGE%%@*}"; want="${ref##*:}"; what="the node image tag"
          fi
          server="$(kubectl version -o json | python3 -c 'import json, sys; print(json.load(sys.stdin)["serverVersion"]["gitVersion"])')"
          echo "Server Version: ${server}"
          if [ "${server}" != "${want}" ]; then
            echo "::error::the kind cluster runs ${server}, but ${what} is ${want}"
            exit 1
          fi
          echo "Kubernetes ${server} (node image ${KIND_NODE_IMAGE}, kubectl ${KUBECTL_VERSION})" >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm audit logging is active
        shell: bash
        run: |
          docker exec "${CLUSTER_NAME}-control-plane" \
            cat /etc/kubernetes/manifests/kube-apiserver.yaml | grep -- --audit- \
            || { echo "::error::audit flags not set on the API server"; exit 1; }

      - name: Load the lab image and wait for the default service account
        if: ${{ !cancelled() && steps.cluster.outcome == 'success' }}
        shell: bash
        run: |
          # Docker Hub pulls inside the node are the main source of flaky pod
          # starts: pull on the runner with a bounded retry, then load into the node.
          for img in ${LAB_IMAGES}; do
            for i in 1 2 3; do docker pull -q "$img" && break; sleep $((i * 10)); done
            # Load into every node (control-plane and worker), so Procedure B's URL
            # static pod on the worker starts without a Docker Hub pull.
            kind load docker-image --name "${CLUSTER_NAME}" "$img"
          done
          # A pod create before the token controller makes sa/default fails with
          # 'serviceaccount "default" not found' (kubectl 1.31+ supports --for=create).
          kubectl -n default wait --for=create serviceaccount/default --timeout=60s
          # Procedure B runs on the worker, so it must be Ready before the emulation.
          kubectl wait --for=condition=Ready node --all --timeout=120s

      - name: Capture the audit log before the emulation (negative control)
        if: ${{ !cancelled() && steps.cluster.outcome == 'success' }}
        shell: bash
        run: |
          # Wait for the control-plane mirror pods, so the baseline the rule also
          # matches is in this log.
          kubectl -n kube-system wait --for=condition=Ready pod \
            -l tier=control-plane --timeout=120s
          sleep 3
          docker exec "${CLUSTER_NAME}-control-plane" \
            cat /var/log/kubernetes/kube-apiserver-audit.log \
            > /tmp/pre-emulation-audit.log
          echo "Captured $(wc -l < /tmp/pre-emulation-audit.log) pre-emulation audit lines."

      - name: Start the node runtime sensor (CRI pod sandboxes)
        if: ${{ !cancelled() && steps.cluster.outcome == 'success' }}
        shell: bash
        run: |
          # Stand-in for a runtime security agent on EACH node: record every pod
          # sandbox the container runtime reports, with its annotations. Procedure A
          # runs on the control plane and Procedure B's URL static pod on the worker,
          # so the sensor must watch both nodes. Snapshots from both are concatenated;
          # the validator dedups by sandbox id, so a sandbox counts once.
          : > /tmp/pre-emulation-cri.jsonl
          for NODE in "${CLUSTER_NAME}-control-plane" "${CLUSTER_NAME}-worker"; do
            docker cp detections/k8s/cri-pod-sensor.sh "${NODE}:/usr/local/bin/cri-pod-sensor.sh"
            # One snapshot now: the negative-control input, beside the audit log above.
            docker exec "${NODE}" sh /usr/local/bin/cri-pod-sensor.sh once \
              >> /tmp/pre-emulation-cri.jsonl
            docker exec -d "${NODE}" \
              sh /usr/local/bin/cri-pod-sensor.sh watch /var/log/cri-pods.jsonl 1
          done
          # Wait for the first snapshot on both nodes, so each sensor is live before
          # the emulation.
          for NODE in "${CLUSTER_NAME}-control-plane" "${CLUSTER_NAME}-worker"; do
            for _ in $(seq 1 15); do
              docker exec "${NODE}" test -s /var/log/cri-pods.jsonl && break
              sleep 1
            done
            docker exec "${NODE}" test -s /var/log/cri-pods.jsonl \
              || { echo "::error::the CRI sensor on ${NODE} wrote nothing"; exit 1; }
          done
          echo "Sensors live; pre-emulation snapshot is $(wc -c < /tmp/pre-emulation-cri.jsonl) bytes."

      - name: Capture the node file events before the emulation (negative control)
        if: ${{ !cancelled() && steps.cluster.outcome == 'success' }}
        shell: bash
        env:
          FILESENSOR_OUTCOME: ${{ steps.filesensor.outcome }}
        run: |
          # The watch was added before the cluster was created, so this capture holds
          # kubeadm's control-plane manifest writes (the file control checks that the
          # rule matches none of them) and no marked writer yet (the A gate must stay
          # quiet here).
          if [ "${FILESENSOR_OUTCOME}" != "success" ]; then
            echo "::error title=file sensor::the node file-event sensor did not start; the file gate and the file control will fail"
          fi
          sudo cat /var/log/audit/audit.log 2>/dev/null | sudo tee /tmp/pre-audit-raw.log >/dev/null || true
          python3 detections/k8s/auditd_file_events.py /tmp/pre-audit-raw.log \
            --key k8s_node_file > /tmp/pre-emulation-file.jsonl || true
          echo "Captured $(wc -l < /tmp/pre-emulation-file.jsonl) pre-emulation file event(s)."

      - name: Emulate T1543.005 static pods (benign busybox)
        if: ${{ !cancelled() && steps.cluster.outcome == 'success' }}
        shell: bash
        run: |
          bash atomics/T1543.005/src/emulate.sh all

      - name: Collect the audit log and the node sensor log
        if: ${{ !cancelled() && steps.cluster.outcome == 'success' }}
        shell: bash
        run: |
          # Poll (max 30 s) until the audit log holds the audit records the
          # validator gates that come late: the kubelet's refused mirror-pod create
          # for the invalid-namespace pod (trr9003-ghost, code 404), sent during the
          # GAP procedure, and the worker kubelet's mirror create for Procedure B's
          # URL static pod (trr9003-url-*, code 201). B waits for that mirror pod in
          # the API before it restores the kubelet, so it came before B ended; the
          # injected pod's mirror create came earlier (Procedure A saw the mirror pod
          # in the API before it ended). There is no steady traffic to wait for here:
          # audit-policy-staticpod.yaml drops leases and every get/list/watch, so a
          # test for "an event newer than the ledger's last end" could time out.
          found=0
          for _ in $(seq 1 30); do
            docker exec "${CLUSTER_NAME}-control-plane" \
              cat /var/log/kubernetes/kube-apiserver-audit.log \
              > /tmp/kube-apiserver-audit.log || true
            # One grep per record, not grep | grep -q: under pipefail an early grep -q
            # exit can fail the pipeline (SIGPIPE) although it matched.
            if grep -Eq '"name": *"trr9003-ghost[^"]*".*"code": *404|"code": *404.*"name": *"trr9003-ghost' \
                 /tmp/kube-apiserver-audit.log \
               && { [ "${TRR9003_RECONFIGURE:-}" != "1" ] \
                    || grep -Eq '"name": *"trr9003-url-[^"]*".*"code": *201|"code": *201.*"name": *"trr9003-url-' \
                         /tmp/kube-apiserver-audit.log; }; then
              found=1; break
            fi
            sleep 1
          done
          if [ "${found}" -ne 1 ]; then
            echo "::notice title=collect::no trr9003-ghost mirror-create (code 404), or no trr9003-url mirror-create (code 201), in the audit log after 30 s; collecting the log as it is (the validator names what is missing)"
          fi
          echo "Collected $(wc -l < /tmp/kube-apiserver-audit.log) audit lines."
          # Both nodes' sensor logs, concatenated (the validator dedups by sandbox id).
          : > /tmp/cri-pods.jsonl
          for NODE in "${CLUSTER_NAME}-control-plane" "${CLUSTER_NAME}-worker"; do
            docker exec "${NODE}" cat /var/log/cri-pods.jsonl >> /tmp/cri-pods.jsonl || true
          done
          echo "Collected $(wc -l < /tmp/cri-pods.jsonl) CRI sensor snapshots (both nodes)."
          # Node file events: poll (max 30 s) for the marked writer's record, then
          # convert the auditd records to linux/file_event JSON lines. The validator
          # fails closed if the record never appears (gate MISS).
          for _ in $(seq 1 30); do
            sudo cat /var/log/audit/audit.log 2>/dev/null | sudo tee /tmp/node-audit-raw.log >/dev/null || true
            grep -q 'exe="/usr/local/bin/trr9003-tee"' /tmp/node-audit-raw.log && break
            sleep 1
          done
          python3 detections/k8s/auditd_file_events.py /tmp/node-audit-raw.log \
            --key k8s_node_file > /tmp/node-file-events.jsonl || true
          echo "Collected $(wc -l < /tmp/node-file-events.jsonl) file event(s)."

      - name: Validate detections (static pod -> audit log + node sensor -> Sigma)
        if: ${{ !cancelled() && steps.cluster.outcome == 'success' }}
        shell: bash
        run: |
          # shell: bash enables pipefail, so tee does not mask the exit code.
          python3 detections/validate_staticpod_detections.py \
            --audit-log /tmp/kube-apiserver-audit.log \
            --cri-log /tmp/cri-pods.jsonl \
            --file-log /tmp/node-file-events.jsonl \
            --ledger "${DETENG_LEDGER}" | tee /tmp/spval.out

      - name: Negative control (the baseline alone may not pass)
        if: ${{ !cancelled() && steps.cluster.outcome == 'success' }}
        shell: bash
        run: |
          python3 detections/validate_staticpod_detections.py \
            --audit-log /tmp/pre-emulation-audit.log \
            --cri-log /tmp/pre-emulation-cri.jsonl \
            --file-log /tmp/pre-emulation-file.jsonl --expect-miss | tee /tmp/spneg.out

      - name: Publish results to job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## TRR9003 static-pod detection validation (audit log + node runtime sensor -> Sigma)'
            echo ''
            echo '```'
            cat /tmp/spval.out 2>/dev/null || echo '(no validator output captured)'
            echo '```'
            echo ''
            echo '### Negative control (logs captured before the emulation)'
            echo ''
            echo '```'
            cat /tmp/spneg.out 2>/dev/null || echo '(no negative-control output captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the audit and node sensor logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staticpod-telemetry
          path: |
            /tmp/kube-apiserver-audit.log
            /tmp/pre-emulation-audit.log
            /tmp/cri-pods.jsonl
            /tmp/pre-emulation-cri.jsonl
            /tmp/node-file-events.jsonl
            /tmp/pre-emulation-file.jsonl
            /tmp/emulation-ledger.jsonl
          if-no-files-found: ignore

      - name: Delete the cluster
        if: always()
        shell: bash
        run: kind delete cluster --name "${CLUSTER_NAME}" || true
